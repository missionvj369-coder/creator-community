<!doctype html><html lang="en"><meta charset="utf-8"><title>Sound-session lifecycle check</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/human-within.css"><style>.qa-controls{position:fixed;z-index:999;bottom:12px;left:12px;background:white;padding:12px;border:1px solid #888}#result{font:12px monospace}</style><aside class="qa-controls"><strong>Test fixture · simulated visibility</strong><br><button id="hide">Simulate hidden</button><button id="show">Simulate visible</button><output id="result"></output></aside><main id="root"></main><script type="module">
import{boot}from'/js/store.js';import{renderSession}from'/js/views/session.js';import{BinauralSession}from'/js/audio.js';
let hidden=false,starts=0,stops=0,pauses=0,resumes=0;Object.defineProperty(document,'hidden',{configurable:true,get:()=>hidden});BinauralSession.prototype.start=function(){starts++;this.n={};this.paused=false;report();return true;};BinauralSession.prototype.pause=function(){pauses++;this.paused=true;report()};BinauralSession.prototype.resume=function(){resumes++;this.paused=false;report();return true;};Object.defineProperty(BinauralSession.prototype,'active',{get(){return !!this.n&&!this.paused;}});BinauralSession.prototype.stop=function(){stops++;this.n=null;report()};
const root=document.querySelector('#root');function report(){document.querySelector('#result').textContent=JSON.stringify({hidden,starts,stops,pauses,resumes})}
for(const[id,value]of[['hide',true],['show',false]])document.querySelector('#'+id).onclick=()=>{hidden=value;document.dispatchEvent(new Event('visibilitychange'));report()};
await boot();await renderSession(root,{idx:0,browse:true},{setHue(){},close(){root.firstElementChild.dispatchEvent(new Event('ugt:leave'));root.replaceChildren(document.createTextNode('Closed'));report()}});report();
</script></html>
