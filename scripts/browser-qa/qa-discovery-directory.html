<!doctype html><meta charset="utf-8"><title>Discovery navigation at phone widths</title><style>body{background:#eeeae0;font:14px Arial;padding:20px}h1{font:32px Georgia}main{display:flex;gap:25px;flex-wrap:wrap}iframe{border:0;height:900px;border-radius:20px}pre{white-space:pre-wrap}</style><h1>Discover · phone navigation</h1><pre id="report">Checking…</pre><main><iframe title="Discover at 320px" width="320" src="/#/discover"></iframe><iframe title="Discover at 390px" width="390" src="/#/discover"></iframe></main><script>

</script>
