<!doctype html><html lang="en"><meta charset="utf-8"><title>Sleep playback regression checks</title><h1>Sleep playback regression checks</h1><p>Test-only virtual audio; the production sleep controller runs unchanged.</p><pre id="report">Running…</pre><section id="intro"><button id="go">Begin</button></section><section id="stage"><p id="cap"></p><div id="orb"></div><button id="sleep-pause"></button><button id="end">End</button></section><section id="outro"><p></p><button id="again">Again</button></section><script type="module">
import {cinemaSound} from '/js/cinema-sound.js';
const KEY='human.within.sleep.position.v1',original=localStorage.getItem(KEY),output=[],players=[];
const assert=(v,t)=>{if(!v)throw Error(t);};const flush=async()=>{for(let i=0;i<24;i++)await Promise.resolve();};
cinemaSound.factory=()=>null;let intervals=[];window.setInterval=fn=>{intervals.push(fn);return intervals.length;};window.clearInterval=()=>{};
window.Audio=class extends EventTarget{constructor(src){super();this.src=src;this.readyState=1;this.currentTime=0;this.duration=1200;this.paused=true;this.ended=false;this.loads=0;this.plays=0;this.preload='';players.push(this);}async play(){this.plays++;this.paused=false;this.ended=false;}pause(){this.paused=true;}load(){this.loads++;this.currentTime=0;this.paused=true;}};
try{
 localStorage.setItem(KEY,JSON.stringify({seconds:1285,at:Date.now()}));await import('/js/bedtime-cinema.js');
 assert(document.querySelector('#go').textContent==='Continue · 21:25','Saved tail position offered');document.querySelector('#go').click();await flush();
 const [voice,tail]=players;assert(tail.currentTime===85&&!tail.paused,'Tail resumes at saved position');assert(tail.loads===0,'Painting must never reload the active tail');output.push('PASS — saved quiet-tail position restores without active-media reload');
 document.querySelector('#sleep-pause').click();await flush();assert(tail.paused,'Pause stops the tail');cinemaSound.mute();await cinemaSound.enable();assert(tail.paused,'Mute toggles cannot resume paused media');document.querySelector('#sleep-pause').click();await flush();assert(!tail.paused&&tail.currentTime===85,'Resume keeps tail position');output.push('PASS — tail pause, global mute and exact continuation');
 document.querySelector('#end').click();document.querySelector('#again').click();await flush();assert(!voice.paused&&voice.currentTime===0,'Begin again restarts at zero');voice.currentTime=45;intervals.forEach(fn=>fn());assert(tail.preload==='auto','Inactive tail preloads early');output.push('PASS — explicit restart and early inactive-tail preload');
 document.querySelector('#sleep-pause').click();await flush();voice.ended=true;voice.dispatchEvent(new Event('ended'));await flush();assert(tail.paused,'An end event after pause cannot start the next track');assert(document.querySelector('#sleep-pause').textContent==='Resume','Paused handoff keeps Resume visible');document.querySelector('#sleep-pause').click();await flush();assert(!tail.paused,'User can resume the quiet tail after a paused handoff');output.push('PASS — paused track handoff never autoplays');
 tail.currentTime=1200;tail.ended=true;tail.dispatchEvent(new Event('ended'));assert(tail.paused&&voice.paused,'Natural ending is quiet');assert(localStorage.getItem(KEY)===null,'Completed position clears');output.push('PASS — natural ending stops both tracks and clears continuation');
 document.querySelector('#report').textContent=output.join('\n')+'\nALL SLEEP CHECKS PASSED';
}catch(e){document.querySelector('#report').textContent=output.join('\n')+'\nFAIL — '+e.stack;}
finally{window.dispatchEvent(new Event('pagehide'));if(original===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,original);}
</script></html>
