name = "creator-community"
main = "worker/index.js"
compatibility_date = "2026-11-20"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/admin", "/admin/*", "/books/*"]

[[d1_databases]]
binding = "DB"
database_name = "creator-community"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
