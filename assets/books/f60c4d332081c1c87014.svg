<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600"><rect width="900" height="1600" fill="#f8f4e8"/><text x="70" y="78" font-family="Arial,sans-serif" font-size="20" fill="#00869a" font-weight="bold" font-style="normal">16 / BELOW THE SURFACE</text><text x="70" y="205" font-family="Georgia,serif" font-size="61" fill="#078399" font-weight="normal" font-style="normal">You may be avoiding</text><text x="70" y="275" font-family="Georgia,serif" font-size="61" fill="#078399" font-weight="normal" font-style="normal">the feeling that comes</text><text x="70" y="345" font-family="Georgia,serif" font-size="61" fill="#078399" font-weight="normal" font-style="normal">before the task.</text><text x="70" y="455" font-family="Arial,sans-serif" font-size="20" fill="#00869a" font-weight="bold" font-style="normal">WHAT MAY BE HAPPENING</text><text x="70" y="522" font-family="Arial,sans-serif" font-size="31" fill="#233039" font-weight="normal" font-style="normal">One influential account of procrastination describes</text><text x="70" y="566" font-family="Arial,sans-serif" font-size="31" fill="#233039" font-weight="normal" font-style="normal">short-term mood repair: moving away from an</text><text x="70" y="610" font-family="Arial,sans-serif" font-size="31" fill="#233039" font-weight="normal" font-style="normal">unpleasant task briefly improves how you feel. That</text><text x="70" y="654" font-family="Arial,sans-serif" font-size="31" fill="#233039" font-weight="normal" font-style="normal">immediate relief can compete with a future goal you</text><text x="70" y="698" font-family="Arial,sans-serif" font-size="31" fill="#233039" font-weight="normal" font-style="normal">genuinely care about. This is one possible</text><text x="70" y="742" font-family="Arial,sans-serif" font-size="31" fill="#233039" font-weight="normal" font-style="normal">explanation, alongside overload, unclear</text><text x="70" y="786" font-family="Arial,sans-serif" font-size="31" fill="#233039" font-weight="normal" font-style="normal">instructions, disability and other barriers. It helps</text><text x="70" y="830" font-family="Arial,sans-serif" font-size="31" fill="#233039" font-weight="normal" font-style="normal">to identify which difficulty is actually present.</text><text x="70" y="868" font-family="Arial,sans-serif" font-size="17" fill="#667573" font-weight="bold" font-style="normal">A WAY TO SEE THE PATTERN</text><rect x="70" y="893" width="228" height="81" rx="13" fill="#e2f1ed"/><text x="83" y="943" font-family="Arial,sans-serif" font-size="13" fill="#00869a" font-weight="bold" font-style="normal">THE UNCOMFORTABLE START</text><text x="307" y="943" font-family="Arial,sans-serif" font-size="28" fill="#00869a" font-weight="normal" font-style="normal">→</text><rect x="335" y="893" width="228" height="81" rx="13" fill="#e2f1ed"/><text x="348" y="943" font-family="Arial,sans-serif" font-size="13" fill="#00869a" font-weight="bold" font-style="normal">SHORT-TERM RELIEF</text><text x="572" y="943" font-family="Arial,sans-serif" font-size="28" fill="#00869a" font-weight="normal" font-style="normal">→</text><rect x="600" y="893" width="228" height="81" rx="13" fill="#e2f1ed"/><text x="613" y="943" font-family="Arial,sans-serif" font-size="13" fill="#00869a" font-weight="bold" font-style="normal">ONE VISIBLE ENTRY</text><text x="70" y="1025" font-family="Arial,sans-serif" font-size="20" fill="#00869a" font-weight="bold" font-style="normal">TRY THIS / MAKE THE ENTRY VISIBLE</text><text x="70" y="1095" font-family="Arial,sans-serif" font-size="31" fill="#233039" font-weight="normal" font-style="normal">Look at the task and choose one small beginning: open</text><text x="70" y="1139" font-family="Arial,sans-serif" font-size="31" fill="#233039" font-weight="normal" font-style="normal">the material, set out what you need, or look at its first</text><text x="70" y="1183" font-family="Arial,sans-serif" font-size="31" fill="#233039" font-weight="normal" font-style="normal">part. If the next action is unclear, ask for the missing</text><text x="70" y="1227" font-family="Arial,sans-serif" font-size="31" fill="#233039" font-weight="normal" font-style="normal">instruction. Let the beginning be small enough to try</text><text x="70" y="1271" font-family="Arial,sans-serif" font-size="31" fill="#233039" font-weight="normal" font-style="normal">without deciding how much you should finish.</text><text x="70" y="1383" font-family="Arial,sans-serif" font-size="25" fill="#667573" font-weight="normal" font-style="italic">A smaller entry cannot fix an impossible workload. Persistent</text><text x="70" y="1417" font-family="Arial,sans-serif" font-size="25" fill="#667573" font-weight="normal" font-style="italic">difficulty may call for adjustments, support or assessment.</text><path d="M70 1515H830" stroke="#d5d7ce"/><text x="70" y="1557" font-family="Arial,sans-serif" font-size="18" fill="#00869a" font-weight="bold" font-style="normal">SOURCES   [14]</text><text x="807" y="1557" font-family="Arial,sans-serif" font-size="18" fill="#667573" font-weight="bold" font-style="normal">40</text></svg>