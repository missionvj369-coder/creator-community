"title":"09 The One-Word Message","page":23},{"level":3,"title":"10 The Alarm You Can Feel","page":25},{"level":3,"title":"11 The Shrinking Map","page":27},{"level":3,"title":"12 The Weather Glasses","page":29},{"level":2,"title":"The Attention Arcade","page":31},{"level":3,"title":"13 The Pocket Door","page":32},{"level":3,"title":"14 The Little Doorbell","page":34},{"level":3,"title":"15 The Splintered Desk","page":36},{"level":3,"title":"16 The Heavy First Step","page":38},{"level":3,"title":"17 The Unclosed Tabs","page":40},{"level":3,"title":"18 The Mirror Market","page":42},{"level":2,"title":"The Invisible Rules","page":44},{"level":3,"title":"19 The Perfect Gate","page":45},{"level":3,"title":"20 The Borrowed Yes","page":47},{"level":3,"title":"21 The Cruel Coach","page":49},{"level":3,"title":"22 The Crowd Inside","page":51},{"level":3,"title":"23 The Uninvited Thought","page":53},{"level":3,"title":"24 The Moving Finish Line","page":55},{"level":2,"title":"The Night Garden","page":57},{"level":3,"title":"25 The Bedtime Meeting","page":58},{"level":3,"title":"26 The Tired Volume Knob","page":60},{"level":3,"title":"27 The Borrowed Tomorrow","page":62},{"level":3,"title":"28 The Demanding Pillow","page":64},{"level":3,"title":"29 The Wandering Lantern","page":66},{"level":3,"title":"30 The Open Window","page":68},{"level":1,"title":"The window stays open","page":70},{"level":1,"title":"How these pages use science","page":71},{"level":1,"title":"Sources and further reading","page":72},{"level":1,"title":"Back cover","page":80}]}</script>
<script>
'use strict';
(() => {
  const bookData = JSON.parse(document.getElementById('book-data').textContent);
  const pages = bookData.pages;
  const $ = id => document.getElementById(id);
  const book = $('book'), leaf = $('leaf'), shade = $('shade');
  const image = $('pageImage'), underImage = $('underImage'), viewport = $('viewport');
  const count = pages.length, storageKey = 'switch-off-flipbook-2026-page';
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
  const normalized = text => text.toLowerCase().replace(/\s+/g, ' ').trim();
  let index = 0, busy = false, zoomed = false, gesture = null, turn = null;
  let animation = null, serial = 0, queuedDirection = 0;
  const preloadCache = new Map();

  function resize() {
    const style = getComputedStyle(viewport.firstElementChild);
    const paddingX = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
    const paddingY = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);
    const width = Math.max(80, Math.min(viewport.clientWidth - paddingX - 4, (viewport.clientHeight - paddingY - 4) * 360 / 640, 560));
    book.style.setProperty('--pw', width + 'px');
    book.style.setProperty('--ph', width * 640 / 360 + 'px');
  }
  new ResizeObserver(resize).observe(viewport);
  function preload(neighbor) {
    if(document.readyState!=='complete'){addEventListener('load',()=>preload(neighbor),{once:true});return;}
    if (neighbor < 0 || neighbor >= count || preloadCache.has(neighbor)) return;
    const im = new Image(); im.src = pages[neighbor].image; preloadCache.set(neighbor, im);
    for (const key of preloadCache.keys()) if (Math.abs(key - index) > 2) preloadCache.delete(key);
  }
  function setImage(el, page) { if (el.dataset.page !== String(page)) {el.src = pages[page].image; el.dataset.page = page;} }
  function remember() {
    try { localStorage.setItem(storageKey, String(index)); } catch (_) {}
    try { history.replaceState(null, '', '#page=' + (index + 1)); } catch (_) {}
  }
  function makeLinks() {
    $('hotspots').replaceChildren();
    for (const link of pages[index].links) {
      const a = document.createElement('a'); a.className = 'page-link';
      a.style.left = link.box[0] + '%'; a.style.top = link.box[1] + '%';
      a.style.width = link.box[2] + '%'; a.style.height = link.box[3] + '%';
      a.setAttribute('aria-label', link.label); a.title = link.label;
      if (Number.isInteger(link.page)) {
        a.href = '#page=' + (link.page + 1);
        a.addEventListener('click', event => { event.preventDefault(); goTo(link.page); });
      } else { a.href = link.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; }
      $('hotspots').appendChild(a);
    }
  }
  function render(announce = true) {
    setImage(image, index); setImage(underImage, index);
    leaf.style.transform = 'rotateY(0deg)'; shade.style.opacity = '0';
    book.classList.remove('turning');
    book.setAttribute('aria-label', 'Page ' + (index + 1) + ' of ' + count + ': ' + pages[index].title);
    $('pageText').textContent = pages[index].text;
    $('chapterCaption').textContent = pages[index].title;
    $('pageCount').innerHTML = String(index + 1).padStart(2, '0') + '<span>/</span>' + count;
    $('pageCount').setAttribute('aria-label', 'Page ' + (index + 1) + ' of ' + count + '. Go to page');
    $('progress').max = String(count); $('progress').value = String(index + 1);
    $('progress').setAttribute('aria-valuetext', 'Page ' + (index + 1) + ' of ' + count);
    $('prevButton').disabled = index === 0; $('nextButton').disabled = index === count - 1;
    if (announce) $('announcement').textContent = 'Page ' + (index + 1) + ' of ' + count + '. ' + pages[index].title;
    makeLinks(); remember(); preload(index - 1); preload(index + 1);
  }
  function resetTurn() {
    serial++; if (animation) animation.cancel(); animation = null;
    gesture = null; turn = null; busy = false; queuedDirection = 0;
    render(false);
  }
  function goTo(target) {
    target = clamp(Math.trunc(Number(target) || 0), 0, count - 1);
    if (busy || turn) resetTurn();
    index = target; render(); viewport.scrollTo({top: 0, left: 0, behavior: 'instant'});
  }
  function beginTurn(direction) {
    if (busy || turn || index + direction < 0 || index + direction >= count) return false;
    turn = {direction, target: index + direction, progress: 0};
    if (direction === 1) {setImage(image, index); setImage(underImage, turn.target);}
    else {setImage(image, turn.target); setImage(underImage, index);}
    book.classList.add('turning'); applyTurn(0); return true;
  }
  function angle(progress) { return turn.direction === 1 ? -100 * progress : -100 * (1 - progress); }
  function applyTurn(progress) {
    if (!turn) return;
    turn.progress = clamp(progress, 0, 1);
    leaf.style.transform = 'rotateY(' + angle(turn.progress) + 'deg)';
    shade.style.opacity = String(Math.sin(turn.progress * Math.PI) * .65);
  }
  async function finishTurn(commit) {
    if (!turn) return;
    busy = true; const token = ++serial;
    const targetProgress = commit ? 1 : 0, targetPage = turn.target;
    const startAngle = angle(turn.progress), endAngle = angle(targetProgress);
    const duration = reduceMotion.matches ? 0 : Math.max(160, Math.abs(endAngle - startAngle) * 4.9);
    if (duration && typeof leaf.animate === 'function') {
      animation = leaf.animate([{transform: 'rotateY(' + startAngle + 'deg)'}, {transform: 'rotateY(' + endAngle + 'deg)'}], {duration, easing: 'cubic-bezier(.22,.62,.27,1)', fill: 'forwards'});
      try { await animation.finished; } catch (_) {}
    }
    if (token !== serial) return;
    if (animation) animation.cancel(); animation = null;
    const queued = queuedDirection; queuedDirection = 0;
    if (commit) index = targetPage;
    turn = null; busy = false; render(); viewport.scrollTo({top: 0, left: 0, behavior: 'instant'});
    if (queued) requestAnimationFrame(() => turnPage(queued));
  }
  function turnPage(direction) {
    if (busy) {queuedDirection = direction; return;}
    if (turn) return;
    if (beginTurn(direction)) finishTurn(true);
  }
  $('nextButton').addEventListener('click', () => turnPage(1));
  $('prevButton').addEventListener('click', () => turnPage(-1));
  $('progress').addEventListener('input', event => goTo(Number(event.target.value) - 1));

  // Pointer events handle touch swipes and mouse drags with the same page turn.
  book.addEventListener('pointerdown', event => {
    if (event.isPrimary === false || event.button !== 0 || busy || zoomed || event.target.closest('a')) return;
    gesture = {id: event.pointerId, x: event.clientX, y: event.clientY, time: performance.now(), width: book.getBoundingClientRect().width, dragging: false};
  });
  book.addEventListener('pointermove', event => {
    if (!gesture || gesture.id !== event.pointerId || zoomed) return;
    const dx = event.clientX - gesture.x, dy = event.clientY - gesture.y;
    if (!gesture.dragging) {
      if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) {gesture = null; return;}
      if (Math.abs(dx) < 10) return;
      if (!beginTurn(dx < 0 ? 1 : -1)) {gesture = null; return;}
      gesture.dragging = true;
      try {book.setPointerCapture(event.pointerId);} catch (_) {}
    }
    if (event.cancelable) event.preventDefault();
    const distance = turn.direction === 1 ? -dx : dx;
    applyTurn(distance / (gesture.width * .8));
  });
  book.addEventListener('pointerup', event => {
    if (!gesture || gesture.id !== event.pointerId) return;
    const g = gesture; gesture = null;
    try {if (book.hasPointerCapture(event.pointerId)) book.releasePointerCapture(event.pointerId);} catch (_) {}
    if (g.dragging && turn) {
      const dx = event.clientX - g.x;
      const directed = turn.direction === 1 ? -dx : dx;
      const velocity = directed / Math.max(1, performance.now() - g.time);
      finishTurn(turn.progress > .19 || (directed > 24 && velocity > .32));
    } else if (!zoomed && Math.abs(event.clientX - g.x) < 9 && Math.abs(event.clientY - g.y) < 9) {
      const rect = book.getBoundingClientRect(), ratio = (event.clientX - rect.left) / rect.width;
      if (ratio > .73) turnPage(1); else if (ratio < .23) turnPage(-1);
    }
  });
  book.addEventListener('pointercancel', () => {gesture = null; if (turn && !busy) finishTurn(false);});
  book.addEventListener('dragstart', event => event.preventDefault());

  function drawContents() {
    const list = $('chapterList'); list.replaceChildren();
    const query = normalized($('search').value);
    const entries = query ? pages.map((page, pageIndex) => ({title: page.title, page: pageIndex, text: page.text, level: 1})).filter(entry => normalized(entry.text + ' ' + entry.title).includes(query)) : bookData.contents;
    if (!entries.length) {const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'No pages found. Try a chapter name or another word.'; list.append(p);}
    for (const entry of entries) {
      const button = document.createElement('button'); button.type = 'button';
      button.className = 'toc-item' + (entry.level === 2 ? ' room' : entry.level === 3 ? ' chapter' : '') + (entry.page === index ? ' current' : '');
      const label = document.createElement('span'); label.className = 'toc-label'; label.textContent = entry.title;
      if (query) {
        const snippet = document.createElement('span'); snippet.className = 'search-snippet';
        const full = entry.text.replace(/\s+/g, ' '), where = normalized(full).indexOf(query);
        snippet.textContent = (where > 30 ? '…' : '') + full.slice(Math.max(0, where - 30), Math.max(0, where - 30) + 112) + '…'; label.append(snippet);
      }
      const page = document.createElement('span'); page.className = 'toc-page'; page.textContent = String(entry.page + 1).padStart(2, '0');
      button.append(label, page); button.addEventListener('click', () => {$('contentsDialog').close(); goTo(entry.page);}); list.append(button);
    }
  }
  $('contentsButton').addEventListener('click', () => {drawContents(); $('contentsDialog').showModal();});
  $('search').addEventListener('input', drawContents);
  $('pageCount').addEventListener('click', () => {$('pageNumber').value = String(index + 1); $('goDialog').showModal(); $('pageNumber').select();});
  $('goForm').addEventListener('submit', event => {event.preventDefault(); if (!$('pageNumber').checkValidity()) return; goTo(Number($('pageNumber').value) - 1); $('goDialog').close();});
  document.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', () => $(button.dataset.close).close()));
  document.querySelectorAll('dialog').forEach(dialog => dialog.addEventListener('click', event => {if (event.target === dialog) {const r = dialog.getBoundingClientRect(); if (event.clientX < r.left || event.clientX > r.right || event.clientY < r.top || event.clientY > r.bottom) dialog.close();}}));
  $('readTextButton').addEventListener('click', () => {
    $('contentsDialog').close(); $('textTitle').textContent = 'Page ' + (index + 1) + ' · ' + pages[index].title;
    $('transcript').replaceChildren();
    for (const paragraph of pages[index].text.split(/\n\s*\n/).filter(Boolean)) {const p = document.createElement('p'); p.textContent = paragraph.replace(/\n/g, ' '); $('transcript').append(p);}
    $('textDialog').showModal();
  });
  $('zoomButton').addEventListener('click', () => {
    if (busy || turn) resetTurn();
    zoomed = !zoomed; document.body.classList.toggle('zoomed', zoomed);
    $('zoomButton').setAttribute('aria-pressed', String(zoomed));
    $('zoomButton').setAttribute('aria-label', zoomed ? 'Fit page to screen' : 'Zoom page');
    $('zoomButton').title = zoomed ? 'Fit page to screen' : 'Zoom page';
    $('hint').textContent = zoomed ? 'Scroll · tap zoom to fit' : 'Swipe or use ← →';
    requestAnimationFrame(() => {viewport.scrollTo({top: 0, left: Math.max(0, (viewport.scrollWidth - viewport.clientWidth) / 2), behavior: 'instant'});});
  });
  if (!document.documentElement.requestFullscreen) $('fullButton').hidden = true;
  $('fullButton').addEventListener('click', async () => {try {if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen();} catch (_) {}});
  document.addEventListener('fullscreenchange', () => {$('fullButton').setAttribute('aria-label', document.fullscreenElement ? 'Exit fullscreen' : 'Enter fullscreen'); resize();});
  document.addEventListener('keydown', event => {
    if (document.querySelector('dialog[open]') || /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName) || event.altKey || event.ctrlKey || event.metaKey) return;
    if (['ArrowRight', 'PageDown'].includes(event.key) || (event.code === 'Space' && event.target.tagName !== 'BUTTON')) {event.preventDefault(); turnPage(event.shiftKey ? -1 : 1);}
    else if (['ArrowLeft', 'PageUp'].includes(event.key)) {event.preventDefault(); turnPage(-1);}
    else if (event.key === 'Home') {event.preventDefault(); goTo(0);}
    else if (event.key === 'End') {event.preventDefault(); goTo(count - 1);}
  });
  window.addEventListener('hashchange', () => {const m = location.hash.match(/^#page=(\d+)$/); if (m) goTo(Number(m[1]) - 1);});
  const hash = location.hash.match(/^#page=(\d+)$/);
  if (hash) index = clamp(Number(hash[1]) - 1, 0, count - 1);
  else {try {index = clamp(Number(localStorage.getItem(storageKey)) || 0, 0, count - 1);} catch (_) {}}
  render(false); resize();
  const ready = () => {$('opening').classList.add('hidden'); $('opening').setAttribute('aria-hidden', 'true');};
  if (image.complete) ready(); else {image.addEventListener('load', ready, {once: true}); image.addEventListener('error', ready, {once: true});}
})();

</script>
