04 THE INVISIBLE RULES\n\n19  The Perfect Gate                                    46\n\n20  The Borrowed Yes                                  48\n\n21  The Cruel Coach                                    50\n\n22  The Crowd Inside                                   52\n\n23  The Uninvited Thought                              54\n\n24  The Moving Finish Line                              56\n\n\n\n05 THE NIGHT GARDEN\n\n25  The Bedtime Meeting                               59\n\n26  The Tired Volume Knob                             61\n\n27  The Borrowed Tomorrow                            63\n\n28  The Demanding Pillow                              65\n\n29  The Wandering Lantern                             67\n\n30  The Open Window                                  69\n\n\nHow these pages use science                            72\n\nSources and further reading                              73\n\n\n\nThe contents and source numbers are clickable in supported\nPDF readers.\n\n\n\n\n\nWHY CAN'T I SWITCH OFF?                                           04","links":[{"box":[7.5,24.375,85.0,2.96875],"page":45,"label":"19 The Perfect Gate 46"},{"box":[7.5,27.34375,85.0,2.96875],"page":47,"label":"20 The Borrowed Yes 48"},{"box":[7.5,30.3125,85.0,2.96875],"page":49,"label":"21 The Cruel Coach 50"},{"box":[7.5,33.28125,85.0,2.96875],"page":51,"label":"22 The Crowd Inside 52"},{"box":[7.5,36.25,85.0,2.96875],"page":53,"label":"23 The Uninvited Thought 54"},{"box":[7.5,39.21875,85.0,2.96875],"page":55,"label":"24 The Moving Finish Line 56"},{"box":[7.5,48.59375,85.0,2.96875],"page":58,"label":"25 The Bedtime Meeting 59"},{"box":[7.5,51.5625,85.0,2.96875],"page":60,"label":"26 The Tired Volume Knob 61"},{"box":[7.5,54.53125,85.0,2.96875],"page":62,"label":"27 The Borrowed Tomorrow 63"},{"box":[7.5,57.5,85.0,2.96875],"page":64,"label":"28 The Demanding Pillow 65"},{"box":[7.5,60.46875,85.0,2.96875],"page":66,"label":"29 The Wandering Lantern 67"},{"box":[7.5,63.4375,85.0,2.96875],"page":68,"label":"30 The Open Window 69"},{"box":[7.5,69.53125,85.0,2.8125],"page":71,"label":"How these pages use science 72"},{"box":[7.5,73.75,85.0,2.8125],"page":72,"label":"Sources and further reading 73"}]},{"title":"A small guide","image":"/assets/books/61f3635fab1f8398a4ef.jpg","text":"A SMALL GUIDE\n\nFind the feeling.\nOpen the room.\n\n\nRead in any order. Each scene leads to an insight, an\noptional response and the evidence behind it.\n\n\n\n            I keep replaying it.\n 01\n       Take one lesson from the past.\n\n\n     What if everything goes wrong?\n 02\n        Find the first real problem.\n\n\n     My attention keeps slipping.\n 03\n      Change one familiar cue.\n\n\n      Nothing feels good enough.\n 04\n       Give the task a finish point.\n\n\n            I am tired, but still thinking.\n 05\n       Give tomorrow somewhere to wait.\n\n\n\n\n\nThe paper rooms are visual metaphors. These pages offer\ngeneral education, not diagnosis or treatment. If worry, low mood\nor sleep problems persist or disrupt daily life, speak with a\nqualified health professional. [29]\n\n\n\n\n\nREAD AT YOUR OWN PACE                                           05","links":[{"box":[7.5,34.0625,85.0,6.71875],"page":6,"label":"01 I keep replaying it. Take one lesson from the past."},{"box":[7.5,42.65625,85.0,6.71875],"page":19,"label":"02 What if everything goes wrong? Find the first real problem."},{"box":[7.5,51.25,85.0,6.71875],"page":32,"label":"03 My attention keeps slipping. Change one familiar cue."},{"box":[7.5,59.84375,85.0,6.71875],"page":45,"label":"04 Nothing feels good enough. Give the task a finish point."},{"box":[7.5,68.4375,85.0,6.71875],"page":58,"label":"05 I am tired, but still thinking. Give tomorrow somewhere to wait."},{"box":[7.5,81.25,85.0,11.71875],"page":78,"label":"The paper rooms are visual metaphors. These pages offer general education, not diagnosis or treatment. If worry, low mood or sleep problems persist or disrupt daily life, speak with a qualified health professional. [29]"}]},{"title":"The Replay Room","image":"/assets/books/d48d4bacaad12df06084.jpg","text":"ROOM 01  / EXPERIENCES 01-06\n\nThe Replay\nRoom\n\n\nThe day has ended. The\nscreening has not.\n\n\n\nA sentence returns. A face freezes. The version of\nyou who lived the moment meets the version who\nknows what to say now. In this room, the past keeps\nasking for another edit.\n\n\n\n\n\nREPLAY                                                           06","links":[]},{"title":"01 The Midnight Cinema","image":"/assets/books/0c972b0723b06d430a43.jpg","text":"01 / THE MIDNIGHT CINEMA\n\nWhy do I replay\nconversations after\neveryone else has gone\nhome?\n\n\n\n\n\nThe room is dark. The conversation is over. Then\nthe projector starts: your voice, their pause, the\nsentence you should have used. You improve your\nanswer to someone who is no longer there. The\nclock moves. The scene does not.\n\n\n\n\n\nTHE REPLAY ROOM                                                 07","links":[]},{"title":"01 The Midnight Cinema · Below the surface","image":"/assets/books/ebd70564b028a9b0cc36.jpg","text":"01  / BELOW THE SURFACE\n\nA memory can give you\ninformation. It cannot\ngive you another turn.\n\n\n\n\nWHAT MAY BE HAPPENING\n\nReflection becomes more useful when it moves\nfrom a judgement about your whole self to a specific\nevent and a possible next step. Research on\nrepetitive thought distinguishes these concrete and\nabstract styles. Another replay may add nothing\nonce the useful information has been found. That is\na reasonable place to stop reviewing.\n\n\n\nA WAY TO SEE THE PATTERN\n\n\n\n     THE EVENT           ONE LESSON          BACK TO TODAY\n\n\n\nTRY THIS / THE ONE-LINE LESSON\n\nFor an ordinary awkward conversation, choose one\nlesson: 'Next time, I will pause before answering.'\nKeep that sentence. When the scene returns,\nacknowledge that you have already taken the\nlesson, then resume the activity in front of you.\n\n\n\nIf you caused harm, a useful lesson may include a real apology\nor repair. This page is about review that has stopped producing\ninformation.\n\n\n\n\nSOURCES[01]                                                     08","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":72,"label":"[01]"}]},{"title":"02 The Imaginary Spotlight","image":"/assets/books/c4a379bf5f6435b07f52.jpg","text":"02 / THE IMAGINARY SPOTLIGHT\n\nWhy does an\nembarrassing moment\nfeel visible to everyone?\n\n\n\n\n\nYou say a word incorrectly. A cup falls. Your face\nwarms. Suddenly the whole room seems to have a\nfront-row seat. Days later, you can still hear the\nsound of it. You imagine everyone else can too.\n\n\n\n\n\nTHE REPLAY ROOM                                                 09","links":[]},{"title":"02 The Imaginary Spotlight · Below the surface","image":"/assets/books/8797f51e2dff9b487cb4.jpg","text":"02  / BELOW THE SURFACE\n\nYou carry a close-up of\nyourself. Other people\nhave a wider shot.\n\n\n\n\nWHAT MAY BE HAPPENING\n\nIn spotlight-effect experiments, people\noverestimated how much others noticed their\nappearance and contributions. Your own\nawkwardness is unusually vivid to you: you feel the\nheat in your face and hear the mistake from inside\nthe moment. Someone else has access to only part\nof that experience, alongside everything happening\nin their own day.\n\nA WAY TO SEE THE PATTERN\n\n\n\n   YOUR CLOSE-UP         THEIR WIDER DAY        REVISE THE ESTIMATE\n\n\n\nTRY THIS / WIDEN THE CAMERA\n\nThink of a harmless stumble someone else made\nyesterday. How much detail remains? Use that as\none reality check. If you spilled a drink, clean it up; if\na word came out wrong, correct it once and continue\nthe conversation.\n\n\n\nPeople can notice mistakes. This finding concerns\noverestimating attention, rather than proving that an audience\nnever notices.\n\n\n\n\nSOURCES[02]                                                     10","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":72,"label":"[02]"}]},{"title":"03 The Red Envelope","image":"/assets/books/625450e885463c0b4d7a.jpg","text":"03 / THE RED ENVELOPE\n\nWhy does one criticism\ncrowd out so many\nkind words?\n\n\n\n\n\nTen messages are warm. One is sharp. You carry\nthe sharp one into lunch, into traffic, into the\nshower. By night, it seems to be the only message\nyou received. The others are still there, unopened\nin your memory.\n\n\n\n\n\nTHE REPLAY ROOM                                                 11","links":[]},{"title":"03 The Red Envelope · Below the surface","image":"/assets/books/841fd6378c2047e4ec96.jpg","text":"03  / BELOW THE SURFACE\n\nA loud verdict can still\nbe a small sample.\n\n\n\n\n\nWHAT MAY BE HAPPENING\n\nNegative information often receives more\npsychological weight than comparable positive\ninformation, according to a broad research review.\nWeight and accuracy are different questions. A\nsharp comment may identify a genuine problem,\nexpress one person's preference or arrive in an\nunhelpful form. Its emotional force cannot tell you\nhow representative it is.\n\nA WAY TO SEE THE PATTERN\n\n\n\n THE SHARP COMMENT       SPECIFIC EVIDENCE       A FAIRER REVIEW\n\n\n\nTRY THIS / TAKE THE WHOLE REVIEW\n\nIf someone says, 'Your presentation was confusing,'\nask which part. Keep the specific point you can\nimprove. Then include the rest of the evidence: what\nthe audience understood, other feedback and the\npurpose of the talk.\n\n\n\nThe aim is a fairer judgement, including real faults. No fixed\nnumber of compliments cancels every criticism.\n\n\n\n\n\nSOURCES[03]                                                     12","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":72,"label":"[03]"}]},{"title":"04 The Argument After the Argument","image":"/assets/books/8703675747246e1b10c9.jpg","text":"04 / THE ARGUMENT AFTER THE ARGUMENT\n\nWhy do I keep winning\nan argument inside my\nhead?\n\n\n\n\n\nYou are washing a plate when the perfect reply\narrives. Then a better one. You explain everything\nbeautifully to the kitchen wall. The person you\nargued with is elsewhere. You are still trying to be\nunderstood in a room without a listener.\n\n\n\n\n\nTHE REPLAY ROOM                                                 13","links":[]},{"title":"04 The Argument After the Argument · Below the surface","image":"/assets/books/c0979f8ac675d6512d2e.jpg","text":"04  / BELOW THE SURFACE\n\nYour strongest reply\nmay be a request\nyou have not made.\n\n\n\n\nWHAT MAY BE HAPPENING\n\nRehearsing a conflict can keep attention on blame\nand imagined verdicts. Research on repetitive\nthought suggests that specific, action-oriented\nreflection can be more constructive than circling\nbroad questions about why something happened.\nThe important shift here is from an imaginary\naudience to a need you could actually communicate,\nif another conversation would be safe and useful.\n\nA WAY TO SEE THE PATTERN\n\n\n\n THE IMAGINARY REPLY       THE UNMET NEED       ONE REAL REQUEST\n\n\n\nTRY THIS / THE REPAIR SENTENCE\n\nTurn the speech into one request: 'When the\nconversation ended before I finished, I felt\ndismissed. Could we take five minutes to finish it?'\nDecide when to ask. If another conversation would\nbe unsafe, choose protection or support instead.\n\n\n\nThe request is an illustrative script, not a tested conflict\ntechnique. You do not owe access to someone who threatens or\nabuses you.\n\n\n\n\nSOURCES[01]                                                     14","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":72,"label":"[01]"}]},{"title":"05 The Bear Behind the Door","image":"/assets/books/4b93f17d685a8e148e2d.jpg","text":"05 / THE BEAR BEHIND THE DOOR\n\nWhy does trying to ban\na thought sometimes\nbring it back?\n\n\n\n\n\nDo not think about the bear. You shut the little door.\nIs it gone? You check. There it is. You shut the door\nagain. Soon the whole room is organised around an\nanimal you were trying not to see.\n\n\n\n\n\nTHE REPLAY ROOM                                                 15","links":[]},{"title":"05 The Bear Behind the Door · Below the surface","image":"/assets/books/e182f5934a8b7aa493cd.jpg","text":"05  / BELOW THE SURFACE\n\nThe guard at the\ndoor has to keep\nchecking for the bear.\n\n\n\n\nWHAT MAY BE HAPPENING\n\nIn classic experiments, attempting to suppress a\nwhite-bear thought was followed by increased\nthoughts about it. One proposed explanation is that\nchecking for the forbidden thought keeps it available\nin attention. The finding suggests a trap: making\ndisappearance your task can require repeated\nreminders of the very thought you want gone.\n\n\n\nA WAY TO SEE THE PATTERN\n\n\n\n FORBID THE THOUGHT       CHECK FOR IT        RETURN TO A TASK\n\n\n\nTRY THIS / CHOOSE A RETURN POINT\n\nWhen an ordinary unwanted thought interrupts\nreading, acknowledge it once: 'There is that thought.'\nPut your finger at the next sentence and read that\nsentence. Let finishing the sentence be the task,\nrather than checking whether the thought has\ndisappeared.\n\n\nSuppression does not always rebound. Recurrent, distressing\nthoughts or mental rituals deserve qualified support.\n\n\n\n\n\nSOURCES[04]                                                     16","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":72,"label":"[04]"}]},{"title":"06 The Planning Disguise","image":"/assets/books/b5c6435c226f6fabf0a4.jpg","text":"06 / THE PLANNING DISGUISE\n\nHow can I tell whether\nI am planning or just\nworrying?\n\n\n\n\n\nYou have thought about the problem for an hour.\nYou have considered the worst ending, the\nsecond-worst ending and what everyone might say.\nBut if someone asked what you will do next, your\nhands would still be empty.\n\n\n\n\n\nTHE REPLAY ROOM                                                 17","links":[]},{"title":"06 The Planning Disguise · Below the surface","image":"/assets/books/c7df01054f2bbf8f85ec.jpg","text":"06  / BELOW THE SURFACE\n\nA plan has a next action\nand a stopping point.\n\n\n\n\n\nWHAT MAY BE HAPPENING\n\nPractical problem-solving begins with a problem that\ncan be described and acted on. Public-health\nguidance recommends considering options,\nchoosing a manageable action and making a plan.\nThinking through every possible consequence can\nfeel productive while leaving the actual task\nunchanged. A concrete action lets you recognise\nwhen today's preparation is enough.\n\nA WAY TO SEE THE PATTERN\n\n\n\n NAME THE PROBLEM     CHOOSE ONE ACTION    KNOW WHEN TO STOP\n\n\n\nTRY THIS / GIVE ACTION AN ADDRESS\n\nReplace 'I must sort out that application' with 'After\nlunch, I will check which document is missing and\nrequest it.' Do that step. Let the next stage wait for\nthe information it needs, instead of mentally\ncompleting the whole project tonight.\n\n\n\nPlanning cannot supply missing money, safety, time or support.\nSome problems need resources as well as an action.\n\n\n\n\n\nSOURCES[30]                                                     18","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":78,"label":"[30]"}]},{"title":"The Alarm Room","image":"/assets/books/ca8ee4208e7bca66440d.jpg","text":"ROOM 02  / EXPERIENCES 07-12\n\nThe Alarm\nRoom\n\n\nTomorrow keeps knocking on\ntoday's door.\n\n\n\nA possibility arrives wearing the clothes of a fact. A\nsilence becomes a story. Your body prepares for a\nfuture that has not happened. Here, we look at how\nworry makes uncertainty feel urgent.\n\n\n\n\n\nALARM                                                            19","links":[]},{"title":"07 The What-If Corridor","image":"/assets/books/100c5a24a45dadf1d2ab.jpg","text":"07 / THE WHAT-IF CORRIDOR\n\nWhy does one worry\nkeep opening another\ndoor?\n\n\n\n\n\nWhat if the meeting goes badly? What if they lose\nconfidence in you? What if that changes\neverything? You walk through door after door until\nyou are frightened by a place several imagined\nfutures away from where you began.\n\n\n\n\n\nTHE ALARM ROOM                                                  20","links":[]},{"title":"07 The What-If Corridor · Below the surface","image":"/assets/books/95c1a67a62fd95fbdced.jpg","text":"07  / BELOW THE SURFACE\n\nA frightening ending\ncan be several\nunproven steps away.\n\n\n\n\nWHAT MAY BE HAPPENING\n\nHypothetical worry can link one possible event to\nanother until a distant outcome feels immediate.\nGuidance on tackling worry distinguishes these\npossibilities from practical problems that need\naction now. The later doors in a chain add\nimagined consequences; they do not automatically\nadd evidence that the first feared event is likely.\n\n\n\nA WAY TO SEE THE PATTERN\n\n\n\n  THE FIRST WHAT-IF       THE IMAGINED ENDING      ONE PROPORTIONATE STEP\n\n\n\nTRY THIS / RETURN TO THE FIRST DOOR\n\nWhen 'I might stumble in the meeting' becomes 'I\nwill lose my job,' return to the first claim. Prepare\nyour opening sentence and the information you\nneed. Stop there unless a real fact requires another\nprecaution.\n\n\n\nReal risks deserve proportionate preparation. This response is\nfor speculative chains, rather than ignoring an actual threat.\n\n\n\n\n\nSOURCES[05]                                                     21","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":72,"label":"[05]"}]},{"title":"08 The Unopened Envelope","image":"/assets/books/4cd3bcc23f40281d3b75.jpg","text":"08 / THE UNOPENED ENVELOPE\n\nWhy can waiting for an\nanswer feel worse than\na clear answer?\n\n\n\n\n\nYou refresh the page. Nothing. You reread the\nmessage you sent. Still nothing. The answer has\nnot arrived, but your mind keeps acting as though\none more check might make the envelope open.\n\n\n\n\n\nTHE ALARM ROOM                                                  22","links":[]},{"title":"08 The Unopened Envelope · Below the surface","image":"/assets/books/8cd202ed0eecf140dd49.jpg","text":"08  / BELOW THE SURFACE\n\nChecking for an answer\nand receiving an answer\nare different events.\n\n\n\n\nWHAT MAY BE HAPPENING\n\nResearch connects difficulty tolerating uncertainty\nwith worry; experimentally increasing this difficulty\nalso increased worry in one study. Checking can\noffer a momentary feeling of doing something\nwithout supplying new information. The practical\ndistinction is between an action that could change\nthe situation and one that only revisits the absence\nof an answer.\n\nA WAY TO SEE THE PATTERN\n\n\n\n NO NEW INFORMATION      ANOTHER CHECK       A CHOSEN CHECK TIME\n\n\n\nTRY THIS / CHOOSE YOUR NEXT CHECK\n\nFor a routine reply, choose a sensible next check: 'I\nwill look after lunch.' Until then, do one small activity\nthat does not depend on the answer. Follow up at an\nappropriate time if the person actually needs a\nreminder.\n\n\n\nUse a different plan for urgent medical, safety or\ndeadline-sensitive information. This example concerns ordinary\nwaiting.\n\n\n\n\nSOURCES[06]                                                     23","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":73,"label":"[06]"}]},{"title":"09 The One-Word Message","image":"/assets/books/dceb5fe9428a123c4970.jpg","text":"09 / THE ONE-WORD MESSAGE\n\nWhy can a short reply\nturn into a whole\nfrightening story?\n\n\n\n\n\nThe message says, 'Okay.' That is all. No smile. No\nextra word. You hear disappointment in it, then\nanger. By the time you put down the phone, you\nhave lived through an argument that nobody has\nactually started.\n\n\n\n\n\nTHE ALARM ROOM                                                  24","links":[]},{"title":"09 The One-Word Message · Below the surface","image":"/assets/books/31e9e71c27a0b0f41302.jpg","text":"09  / BELOW THE SURFACE\n\nThe screen delivers\nthe words. Your mind\nsupplies the voice.\n\n\n\n\nWHAT MAY BE HAPPENING\n\nExperiments on email found that people\noverestimated how effectively they conveyed tone.\nThey could hear their intended meaning internally\nwhile overlooking how little of that voice reached the\nrecipient. A short written reply leaves tone uncertain.\nThat helps explain why your reading of 'Okay' may\ncontain more information than the sender actually\nsupplied.\n\nA WAY TO SEE THE PATTERN\n\n\n\n THE WRITTEN WORDS      THE VOICE YOU ADD       ASK FOR CLARITY\n\n\n\nTRY THIS / READ THE LITERAL WORDS\n\nSeparate the message from the voice you added:\n'They wrote Okay; I heard disappointment.' If the\nmatter needs clarity, ask: 'Does that time work for\nyou, or should we change it?' Ask about the practical\nissue instead of treating the imagined tone as settled.\n\n\n\nThe research involved email; this example applies its idea to a\nshort message. A consistent pattern of mistreatment still matters.\n\n\n\n\n\nSOURCES[31]    [07]                                               25","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":78,"label":"[31]"},{"box":[26.94444,95.46875,6.66667,2.34375],"page":73,"label":"[07]"}]},{"title":"10 The Alarm You Can Feel","image":"/assets/books/824f451661e080e0818d.jpg","text":"10 / THE ALARM YOU CAN FEEL\n\nWhy can a worry show\nup in my body?\n\n\n\n\n\nNothing has moved in the room. Yet your shoulders\nrise, your stomach tightens and the small problem\nfeels suddenly enormous. You had expected worry\nto stay in your head. Your body has joined the\nconversation.\n\n\n\n\n\nTHE ALARM ROOM                                                  26","links":[]},{"title":"10 The Alarm You Can Feel · Below the surface","image":"/assets/books/1c051279ad32003894ad.jpg","text":"10  / BELOW THE SURFACE\n\nYour body can join\na worry before the\nfacts have changed.\n\n\n\n\nWHAT MAY BE HAPPENING\n\nStress and anxiety can involve physical symptoms,\nincluding tension, headaches and sleep disturbance.\nThe US National Institute of Mental Health describes\nthis connection. Noticing discomfort can itself\nbecome another reason to worry. Recognising that\npossibility can help you respond, but it cannot\nestablish that anxiety caused a particular symptom.\n\n\n\nA WAY TO SEE THE PATTERN\n\n\n\n    THE CONCERN        THE BODY RESPONSE      ASSESS THE NEXT NEED\n\n\n\nTRY THIS / NOTICE AND ASSESS\n\nFor a familiar stress response already assessed by a\nclinician, notice the tension without immediately\nbuilding a new story around it. Relax a comfortable\nmuscle and name the practical concern: 'I am waiting\nfor news.' Decide whether you need information, a\npause or someone's support.\n\n\nNew, severe or unexplained physical symptoms need medical\nassessment. Do not use this page to diagnose anxiety.\n\n\n\n\n\nSOURCES[08]                                                     27","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":73,"label":"[08]"}]},{"title":"11 The Shrinking Map","image":"/assets/books/fd077ce5f14d8ac3e95a.jpg","text":"11 / THE SHRINKING MAP\n\nWhy can avoiding\nsomething make it\nharder to return?\n\n\n\n\n\nYou skip one ordinary phone call. The relief is\nimmediate. Next time, the call feels heavier. Soon\nyou arrange your day around not making it. The\ntask has stayed the same size. Your route around it\nhas grown.\n\n\n\n\n\nTHE ALARM ROOM                                                  28","links":[]},{"title":"11 The Shrinking Map · Below the surface","image":"/assets/books/24b2cd04b9a715e397cd.jpg","text":"11  / BELOW THE SURFACE\n\nImmediate relief\ncan quietly redraw\nthe map of your life.\n\n\n\n\nWHAT MAY BE HAPPENING\n\nAvoidance can bring relief now while reducing\nopportunities to discover that a safe situation is\nmanageable. Public-health guidance recommends\napproaching ordinary feared situations in gradual\nsteps. The aim is to build experience, rather than\nwait until you can guarantee feeling calm. Learning\nand comfort may change at different speeds.\n\n\n\nA WAY TO SEE THE PATTERN\n\n\n\n     AVOIDANCE            QUICK RELIEF        ONE SAFE PRACTICE\n\n\n\nTRY THIS / MAKE ONE SMALL CROSSING\n\nIf ordinary phone calls are the difficulty, practise one\nopening sentence, then make a brief, safe call to\nask a shop's opening time. Let completing that small\ncall be enough for this attempt. Build the next step\nfrom what you learned.\n\n\n\nActual danger, abuse and trauma-related fears need appropriate\nprotection or professional guidance, not pressure to confront\nthem alone.\n\n\n\n\nSOURCES[09]                                                     29","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":73,"label":"[09]"}]},{"title":"12 The Weather Glasses","image":"/assets/books/b99b7394679d30d5e831.jpg","text":"12 / THE WEATHER GLASSES\n\nWhy does a strong\nfeeling sometimes\nseem like proof?\n\n\n\n\n\nYou feel unwanted, so the room looks\nunwelcoming. You feel incapable, so the task looks\nimpossible. The feeling is real. Through it, the\nwhole world seems to have changed colour.\n\n\n\n\n\nTHE ALARM ROOM                                                  30","links":[]},{"title":"12 The Weather Glasses · Below the surface","image":"/assets/books/71a00b0c33a7841b4048.jpg","text":"12  / BELOW THE SURFACE\n\nA feeling can be real\nwhile its explanation\nremains uncertain.\n\n\n\n\nWHAT MAY BE HAPPENING\n\nEmotional reasoning means using a feeling as\nsufficient evidence for a conclusion: 'I feel\ninadequate, so I must be inadequate.' The feeling is\nan experience; the conclusion is an interpretation.\nClinical guidance recommends recognising this\nthinking style. You can attend to what an emotion\nmay signal while checking whether your explanation\nfits the facts.\n\nA WAY TO SEE THE PATTERN\n\n\n\n    WHAT I FEEL          WHAT I KNOW        WHAT I WILL CHECK\n\n\n\nTRY THIS / KEEP TWO SENTENCES\n\nAfter an unanswered invitation, try: 'I feel left out. I\nknow that I have not received a reply yet.' Then\nchoose a proportionate next step, such as checking\nthe arrangements. You can acknowledge the hurt\nwhile leaving the other person's intention open.\n\n\n\nEmotions can point toward real needs or danger. Checking an\ninterpretation should help you respond to yourself with care.\n\n\n\n\n\nSOURCES[10]                                                     31","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":73,"label":"[10]"}]},{"title":"The Attention Arcade","image":"/assets/books/945d79858c1619b16147.jpg","text":"ROOM 03  / EXPERIENCES 13-18\n\nThe Attention\nArcade\n\n\nEvery little door wants you to\nopen it.\n\n\n\nA message. A task. A beautiful life on a bright screen.\nEach one asks for only a moment. By evening, the\nmoments have taken the day. This room follows the\nsmall things that pull you away.\n\n\n\n\n\nATTENTION                                                        32","links":[]},{"title":"13 The Pocket Door","image":"/assets/books/ed507755f60a8d76592c.jpg","text":"13 / THE POCKET DOOR\n\nWhy do I reach for my\nphone before deciding\nto?\n\n\n\n\n\nThe lift stops. A queue slows. Your tea needs\nanother minute. The phone is already in your hand.\nYou did not set out to go anywhere. Somehow you\nare inside the same bright little room again.\n\n\n\n\n\nTHE ATTENTION ARCADE                                            33","links":[]},{"title":"13 The Pocket Door · Below the surface","image":"/assets/books/1cb2f860e12fe0f8cd59.jpg","text":"13  / BELOW THE SURFACE\n\nThe habit begins in the\nmoment before the tap.\n\n\n\n\n\nWHAT MAY BE HAPPENING\n\nHabit research describes how repeated actions\nbecome linked to recurring contexts. A pause in a\nqueue can start prompting a phone check before\nyou make a fresh decision about what you want.\nThis makes the setting part of the pattern.\nChanging a cue or the ease of reaching the phone\ncan create room for a different response.\n\n\n\nA WAY TO SEE THE PATTERN\n\n\n\n A REPEATED SETTING      THE AUTOMATIC REACH     A DIFFERENT RESPONSE\n\n\n\nTRY THIS / CHANGE ONE SETTING\n\nChoose one familiar trigger, such as waiting for tea\nto brew. Put the phone on a shelf before starting.\nWhile you wait, hold the cup or look outside. Repeat\nthe change in that same setting, rather than asking\nyourself to resist every phone check all day.\n\n\n\nKeep access that supports health, disability needs, care or work.\nThe target is one unwanted automatic check.\n\n\n\n\n\nSOURCES[11]                                                     34","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":74,"label":"[11]"}]},{"title":"14 The Little Doorbell","image":"/assets/books/c2748c7a3250376598d7.jpg","text":"14 / THE LITTLE DOORBELL\n\nCan a notification\ndistract me even if I do\nnot answer?\n\n\n\n\n\nYou keep reading. You are being disciplined. The\nphone buzzes once. Your eyes stay on the page,\nbut part of you has gone to find out who might be\nwaiting behind the tiny doorbell.\n\n\n\n\n\nTHE ATTENTION ARCADE                                            35","links":[]},{"title":"14 The Little Doorbell · Below the surface","image":"/assets/books/a8291f1e98bc9ca17a92.jpg","text":"14  / BELOW THE SURFACE\n\nAn unanswered alert can\nstill start a conversation\nin your head.\n\n\n\n\nWHAT MAY BE HAPPENING\n\nIn a laboratory study, receiving phone notifications\ndisrupted an attention-demanding task even\nwithout direct interaction with the phone. An alert\ncan start thoughts about the sender or message\nwhile your eyes remain on the work. Choosing not\nto answer and preventing an interruption are\ntherefore different parts of protecting attention.\n\n\n\nA WAY TO SEE THE PATTERN\n\n\n\n     THE ALERT            THE UNSEEN CONVERSATION     A PROTECTED FINISH\n\n\n\nTRY THIS / PROTECT ONE FINISH POINT\n\nBefore reading one article or completing one form,\nsilence nonessential alerts and allow the contacts\nyou need. Choose when you will check again: after\nthe article or form. Give attention a clear finish point,\nrather than repeatedly deciding whether each buzz\ndeserves an answer.\n\n\nThe study measured a particular laboratory task. Keep alerts\nneeded for safety, accessibility, caregiving or urgent work.\n\n\n\n\n\nSOURCES[12]                                                     36","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":74,"label":"[12]"}]},{"title":"15 The Splintered Desk","image":"/assets/books/4b2ba9a6ea676f92e460.jpg","text":"15 / THE SPLINTERED DESK\n\nWhy can doing several\nthings feel busy but\nleave little finished?\n\n\n\n\n\nA report, a reply, a bill, a new tab. You touch each\none often enough to feel surrounded by work. At the\nend of the hour, every task has your fingerprints on\nit. None has your full attention.\n\n\n\n\n\nTHE ATTENTION ARCADE                                            37","links":[]},{"title":"15 The Splintered Desk · Below the surface","image":"/assets/books/f80609f5f8e79468fde5.jpg","text":"15  / BELOW THE SURFACE\n\nEvery switch asks a small\nquestion: where was I?\n\n\n\n\n\nWHAT MAY BE HAPPENING\n\nTask-switching experiments find costs when people\nchange between different task rules. The mind has\nto re-establish which rules apply, especially with\nmore complex tasks. A separate line of research\ndescribes attention lingering on a previous task. The\npractical issue is the work involved in leaving,\nreorienting and returning, even when each\ninterruption looks brief.\n\nA WAY TO SEE THE PATTERN\n\n\n\n    LEAVE TASK A         RESET FOR TASK B      A CUE FOR RETURN\n\n\n\nTRY THIS / LEAVE A RETURN MARKER\n\nBefore an unavoidable switch, leave one short\nreturn cue: 'Next: check the total in row six,' or 'Next:\nexplain the second example.' When you return, start\nwith that cue instead of surveying every unfinished\npart of the project again.\n\n\n\nThe return marker is a practical suggestion, not a result\ndemonstrated by the cited switching experiments. Some roles\nrequire frequent interruptions.\n\n\n\n\nSOURCES[13]    [32]                                               38","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":74,"label":"[13]"},{"box":[26.94444,95.46875,6.66667,2.34375],"page":79,"label":"[32]"}]},{"title":"16 The Heavy First Step","image":"/assets/books/664fa7769fb56232bb3d.jpg","text":"16 / THE HEAVY FIRST STEP\n\nWhy do I avoid a task I\ncare about finishing?\n\n\n\n\n\nYou want it finished. You have even cleared the\nafternoon. Yet the task sits there like a step too high\nto climb. You tidy something else. For a moment,\nyou feel better. Then the afternoon begins to\ndisappear.\n\n\n\n\n\nTHE ATTENTION ARCADE                                            39","links":[]},{"title":"16 The Heavy First Step · Below the surface","image":"/assets/books/4a191a4bfe0ddaf97bd8.jpg","text":"16  / BELOW THE SURFACE\n\nYou may be avoiding\nthe feeling that comes\nbefore the task.\n\n\n\n\nWHAT MAY BE HAPPENING\n\nOne influential account of procrastination describes\nshort-term mood repair: moving away from an\nunpleasant task briefly improves how you feel. That\nimmediate relief can compete with a future goal you\ngenuinely care about. This is one possible\nexplanation, alongside overload, unclear\ninstructions, disability and other barriers. It helps to\nidentify which difficulty is actually present.\n\nA WAY TO SEE THE PATTERN\n\n\n\n  THE UNCOMFORTABLE START     SHORT-TERM RELIEF      ONE VISIBLE ENTRY\n\n\n\nTRY THIS / MAKE THE ENTRY VISIBLE\n\nFor a writing task, replace 'work on it' with 'open the\ndocument and write a rough first sentence.' If you\ncannot name the first action, ask for the missing\ninstruction. Make the entry observable before\ndeciding how much you should finish.\n\n\n\nA smaller entry cannot fix an impossible workload. Persistent\ndifficulty may call for adjustments, support or assessment.\n\n\n\n\n\nSOURCES[14]                                                     40","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":74,"label":"[14]"}]},{"title":"17 The Unclosed Tabs","image":"/assets/books/d0e3b1aa0b9980ac0d73.jpg","text":"17 / THE UNCLOSED TABS\n\nWhy do unfinished\ntasks follow me into\nmy free time?\n\n\n\n\n\nYou leave the desk, but the desk does not leave\nyou. The unanswered email appears while you\ncook. The form returns during a film. Somewhere\ninside, a row of small windows keeps insisting that\neach one is still open.\n\n\n\n\n\nTHE ATTENTION ARCADE                                            41","links":[]},{"title":"17 The Unclosed Tabs · Below the surface","image":"/assets/books/37a776cac08015de54bb.jpg","text":"17  / BELOW THE SURFACE\n\nAn unfinished task\nneeds a trustworthy\nreturn address.\n\n\n\n\nWHAT MAY BE HAPPENING\n\nIn experiments, unfulfilled goals produced intrusive\nthoughts and interference with other tasks. Specific\nplans reduced those effects even before the goals\nwere completed. The useful idea is a credible\narrangement to return, rather than a wish to\nremember. This offers one reason a clear plan can\nbe more helpful than repeatedly rehearsing an\nunfinished task.\n\nA WAY TO SEE THE PATTERN\n\n\n\n THE UNFINISHED GOAL     A SPECIFIC RETURN        SPACE FOR SOMETHING ELSE\n\n\n\nTRY THIS / BOOK A CREDIBLE RETURN\n\nBefore leaving a task, decide: 'Tomorrow after\nbreakfast, I will find the receipt and attach it to the\nform.' Put the cue where you will see it. When the\ntask returns tonight, refer to the plan instead of\nplanning it again.\n\n\n\nThe studies used particular tasks and samples. A plan also\nneeds realistic time, access and resources.\n\n\n\n\n\nSOURCES[15]                                                     42","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":75,"label":"[15]"}]},{"title":"18 The Mirror Market","image":"/assets/books/773feae824ca5d2c04bd.jpg","text":"18 / THE MIRROR MARKET\n\nWhy does looking at\nother people's lives\nmake mine feel smaller?\n\n\n\n\n\nYour day contains laundry, a missed bus and an\nordinary lunch. On the screen, everyone seems to\nbe arriving somewhere beautiful. You compare their\nlit windows with the untidy room you live in, and\nyour own life starts to look like a mistake.\n\n\n\n\n\nTHE ATTENTION ARCADE                                            43","links":[]},{"title":"18 The Mirror Market · Below the surface","image":"/assets/books/6cf2999ceace69ad1e74.jpg","text":"18  / BELOW THE SURFACE\n\nYou are comparing\na lived day with\na selected scene.\n\n\n\n\nWHAT MAY BE HAPPENING\n\nResearch on social-media comparison includes\nassociations with lower self-esteem and experiments\nin which profile exposure affected self-evaluation.\nThese findings concern particular samples and\nsettings. The picture offers an additional reminder:\nyou know your own difficulties in detail, while a feed\npresents selected moments. The comparison may\ntherefore be missing important context.\n\nA WAY TO SEE THE PATTERN\n\n\n\n  A SELECTED SCENE      YOUR WHOLE DAY       RESTORE THE CONTEXT\n\n\n\nTRY THIS / RESTORE THE MISSING FRAME\n\nWhen a holiday post makes you feel behind, name\nexactly what you saw: 'A photograph from a trip.'\nLeave the unseen income, relationships and\ndifficulties unknown. Then choose one small thing\nyou value in your own day, such as calling a friend or\nfinishing your walk.\n\n\nFeeds can also bring connection and support. Change the\nexposure that repeatedly leaves you worse, rather than\nassuming all use has one effect.\n\n\n\n\nSOURCES[16]                                                     44","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":75,"label":"[16]"}]},{"title":"The Invisible Rules","image":"/assets/books/5440443b3f3754f6b74c.jpg","text":"ROOM 04  / EXPERIENCES 19-24\n\nThe Invisible\nRules\n\n\nWho wrote the rules you keep\nliving by?\n\n\n\nBe impressive. Be available. Get it right. Keep going.\nSome rules were spoken to you. Others grew quietly\nfrom experience. In this room, we notice which ones\nhave become too expensive to obey.\n\n\n\n\n\nEXPECTATIONS                                                     45","links":[]},{"title":"19 The Perfect Gate","image":"/assets/books/178f9f1a8de9b2789d72.jpg","text":"19 / THE PERFECT GATE\n\nWhy can getting it\nright make it so hard\nto finish?\n\n\n\n\n\nThe email is ready. Then you change the first line.\nYou read it again, check a word, imagine a better\nversion. The message still has somewhere to go.\nThe finish line keeps moving each time you reach it.\n\n\n\n\n\nTHE INVISIBLE RULES                                               46","links":[]},{"title":"19 The Perfect Gate · Below the surface","image":"/assets/books/877cc9cd2ff768f8d768.jpg","text":"19  / BELOW THE SURFACE\n\nA useful standard\ntells you when to\nlet the work go.\n\n\n\n\nWHAT MAY BE HAPPENING\n\nClinical guidance describes problematic\nperfectionism as demanding standards tied closely\nto self-worth and pursued despite significant costs.\nRepeated checking and difficulty finishing can be\npart of that pattern. The practical difference is\nwhether a standard helps judge the work's purpose,\nor keeps moving so that finishing never feels\npermitted.\n\nA WAY TO SEE THE PATTERN\n\n\n\n THE TASK'S PURPOSE     A CLEAR FINISH RULE      SEND THE FIRST VERSION\n\n\n\nTRY THIS / DEFINE DONE BEFORE STARTING\n\nFor an ordinary email, define done: the purpose is\nclear, the names and dates are correct, and the\nrecipient can act. Check those points, then send it.\nUse a finish rule suited to the task, rather than\nwaiting for complete confidence.\n\n\n\nMedical, engineering, legal and other high-stakes work needs its\nproper professional checks. This example concerns a low-stakes\nmessage.\n\n\n\n\nSOURCES[17]                                                     47","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":75,"label":"[17]"}]},{"title":"20 The Borrowed Yes","image":"/assets/books/321ee489de8c0eca2738.jpg","text":"20 / THE BORROWED YES\n\nWhy do I agree before\nchecking whether I can\nmanage it?\n\n\n\n\n\nSomeone asks for a small favour. You say yes\nwhile your stomach quietly says wait. Later, the\nfavour sits on top of everything else. You resent the\nweight, then feel guilty for resenting it.\n\n\n\n\n\nTHE INVISIBLE RULES                                               48","links":[]},{"title":"20 The Borrowed Yes · Below the surface","image":"/assets/books/1faf6e201d1d4f40a7bd.jpg","text":"20  / BELOW THE SURFACE\n\nA pause lets your\nanswer catch up\nwith your capacity.\n\n\n\n\nWHAT MAY BE HAPPENING\n\nAssertiveness involves expressing your needs\nclearly while respecting other people. Clinical\nresources describe beliefs about refusal and\ndisappointing others as possible barriers. Agreeing\nimmediately can bypass an important decision about\nyour available time. A pause creates a chance to\nconsider the request and give an answer you can\nrealistically honour.\n\nA WAY TO SEE THE PATTERN\n\n\n\n    THE REQUEST        CHECK YOUR CAPACITY       GIVE AN HONEST ANSWER\n\n\n\nTRY THIS / ANSWER AFTER THE PAUSE\n\nSay: 'Let me check what I can manage and reply\nthis evening.' Then give the answer you actually\nhave capacity for: 'I cannot take this on this week.'\nOffer a smaller contribution only if it fits, rather than\nusing it to soften every refusal.\n\n\n\nSafety, employment, financial dependence and caregiving affect\nhow freely a person can refuse. Adapt the wording to your\ncircumstances.\n\n\n\n\nSOURCES[18]                                                     49","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":75,"label":"[18]"}]},{"title":"21 The Cruel Coach","image":"/assets/books/570141f7d73f618eea43.jpg","text":"21 / THE CRUEL COACH\n\nDo I need to be harsh\nwith myself to\nimprove?\n\n\n\n\n\nYou make a mistake. The coach arrives\nimmediately: careless, hopeless, always the same.\nYou would never speak this way to a friend. Yet part\nof you fears that a kinder voice would let you get\naway with everything.\n\n\n\n\n\nTHE INVISIBLE RULES                                               50","links":[]},{"title":"21 The Cruel Coach · Below the surface","image":"/assets/books/a356709e0ae3cbdb3d23.jpg","text":"21  / BELOW THE SURFACE\n\nA useful inner voice\nnames the mistake and\nleaves room for repair.\n\n\n\n\nWHAT MAY BE HAPPENING\n\nIn experiments, responding to a weakness or\nmistake with self-compassion increased several\nindicators of improvement motivation. These\nincluded study effort after failure and motivation to\nmake amends. The result challenges the\nassumption that self-attack is necessary for\nresponsibility. It does not show that kindness works\nby pretending the mistake had no consequences.\n\nA WAY TO SEE THE PATTERN\n\n\n\n      THE FACT          THE CONSEQUENCE         THE REPAIR\n\n\n\nTRY THIS / FACT, CONSEQUENCE, REPAIR\n\nReplace 'I am hopeless' with three parts: 'I missed\nthe deadline. That delayed the team. I will tell them\nnow and propose a realistic delivery time.' Keep\nresponsibility attached to an action you can take,\ninstead of a name you call yourself.\n\n\n\nMaking amends may take more than a sentence. Compassion\ncan support facing consequences and listening to the people\naffected.\n\n\n\n\nSOURCES[19]                                                     51","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":76,"label":"[19]"}]},{"title":"22 The Crowd Inside","image":"/assets/books/b065da75bd9654f3bf1a.jpg","text":"22 / THE CROWD INSIDE\n\nWhy can someone else's\napproval decide how I\nfeel about myself?\n\n\n\n\n\nYou liked your work until you showed it to them.\nTheir face was difficult to read. Now you are unsure\nwhether you like anything about it. Their silence has\ntaken a seat at the centre of your own judgement.\n\n\n\n\n\nTHE INVISIBLE RULES                                               52","links":[]},{"title":"22 The Crowd Inside · Below the surface","image":"/assets/books/f76f8ebf8c2806a88c10.jpg","text":"22  / BELOW THE SURFACE\n\nWhen approval is the only\nfloor, one opinion can\nmove the whole room.\n\n\n\n\nWHAT MAY BE HAPPENING\n\nTheories of contingent self-worth describe\nself-esteem depending heavily on success in\nparticular domains, including approval, achievement\nand appearance. Feedback in a highly important\ndomain can then feel like a verdict on the whole\nperson. Broadening the standards you use can help\nyou ask a smaller, more useful question about the\nfeedback itself.\n\nA WAY TO SEE THE PATTERN\n\n\n\n ONE PERSON'S REACTION     A SPECIFIC CRITERION      A BROADER JUDGEMENT\n\n\n\nTRY THIS / CHOOSE YOUR OWN CRITERION\n\nBefore showing someone your work, choose one\ncriterion you can explain: 'Does this make the main\nidea clear?' Ask for feedback on that point. Consider\ntheir answer alongside the purpose of the work,\ninstead of asking their reaction to decide your entire\nworth.\n\n\nOther people's judgement can have real consequences. A\nbroader sense of worth does not remove unequal power or the\nneed for belonging.\n\n\n\n\nSOURCES[20]                                                     53","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":76,"label":"[20]"}]},{"title":"23 The Uninvited Thought","image":"/assets/books/4623fdee741e53e2f54d.jpg","text":"23 / THE UNINVITED THOUGHT\n\nDoes an unwanted\nthought reveal what I\nreally want?\n\n\n\n\n\nAn upsetting idea flashes through your mind. You\nrecoil from it. Then you worry about having had it at\nall. Soon the question is no longer just about the\nthought. It is about what kind of person could think\nit.\n\n\n\n\n\nTHE INVISIBLE RULES                                               54","links":[]},{"title":"23 The Uninvited Thought · Below the surface","image":"/assets/books/4cd1b86fc9b49ee68a47.jpg","text":"23  / BELOW THE SURFACE\n\nA thought arriving\nis different from\nyou choosing it.\n\n\n\n\nWHAT MAY BE HAPPENING\n\nUnwanted intrusive thoughts can occur without being\nwishes or intentions. NHS information makes this\ndistinction when explaining obsessive-compulsive\nsymptoms. A distressing thought alone does not\nestablish a diagnosis or reveal a hidden desire.\nRepeatedly examining it for certainty about your\ncharacter can itself become distressing and may be\nworth discussing with a professional.\n\nA WAY TO SEE THE PATTERN\n\n\n\n\n THE UNWANTED THOUGHT      THE MEANING YOU ADD      THE ACTION YOU CHOOSE\n\n\n\nTRY THIS / LET ACTION SHOW YOUR CHOICE\n\nFor an unwanted thought with no intention to act,\nacknowledge it once: 'That was an unwanted\nthought.' Continue the ordinary activity you chose,\nsuch as reading or making tea. You do not need to\nturn the acknowledgement into a phrase you repeat\nuntil it feels right.\n\n\nIf there is intent to harm or you cannot stay safe, seek urgent\nlocal help. Persistent intrusive thoughts or rituals deserve\nprofessional support.\n\n\n\n\nSOURCES[21]                                                     55","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":76,"label":"[21]"}]},{"title":"24 The Moving Finish Line","image":"/assets/books/8fcb8d1cb68b5362d59b.jpg","text":"24 / THE MOVING FINISH LINE\n\nWhy does reaching a\ngoal sometimes feel\ngood for such a short\ntime?\n\n\n\n\n\nFor months, you wanted this. Now it has happened.\nYou are pleased, then busy, then already\nmeasuring the distance to something else. You\nstand beyond the old finish line wondering why it\nfeels so much like another beginning.\n\n\n\n\n\nTHE INVISIBLE RULES                                               56","links":[]},{"title":"24 The Moving Finish Line · Below the surface","image":"/assets/books/4d6efa4c3296c055eefc.jpg","text":"24  / BELOW THE SURFACE\n\nThe feeling can\nfade while the\nachievement stays real.\n\n\n\n\nWHAT MAY BE HAPPENING\n\nResearch on hedonic adaptation examines how\npositive feelings after a life change can diminish. A\nlongitudinal study found support for a model involving\nfading positive emotion and rising aspirations.\nAppreciation and variety were associated with\nbetter-maintained benefits. The fading feeling does\nnot tell you that nothing changed; it may mean the\nchange has become familiar.\n\nA WAY TO SEE THE PATTERN\n\n\n\n THE POSITIVE CHANGE     GROWING FAMILIARITY     USE A REAL BENEFIT\n\n\n\nTRY THIS / LIVE ONE CONCRETE BENEFIT\n\nAfter finishing a project, name one thing the\ncompletion makes possible today. Perhaps you can\ntake a walk without that unfinished work waiting. Use\nthat benefit before setting the next target. Give the\nachievement a place in your day beyond its\nannouncement.\n\n\nThe cited study followed students over three months.\nAppreciation is not a guarantee of lasting happiness or a reason\nto ignore unmet needs.\n\n\n\n\nSOURCES[22]                                                     57","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":76,"label":"[22]"}]},{"title":"The Night Garden","image":"/assets/books/e03d3fced103e45cff4d.jpg","text":"ROOM 05  / EXPERIENCES 25-30\n\nThe Night\nGarden\n\n\nA little space for the mind you\nbrought home.\n\n\n\nThe pillow cannot finish your work or settle every fear.\nIt can hold your head. In the last room, we make\nspace for tiredness, wandering thoughts and the\nunfinished business of being alive.\n\n\n\n\n\nREST                                                              58","links":[]},{"title":"25 The Bedtime Meeting","image":"/assets/books/4ac2a05fe461038f1b3d.jpg","text":"25 / THE BEDTIME MEETING\n\nWhy does my mind\nbring up everything\nwhen I finally lie down?\n\n\n\n\n\nAll day, you moved. Now the lights are out and a\nmeeting begins above the pillow. An unpaid bill\ntakes a chair. Tomorrow's conversation sits beside\nit. A concern from last week has apparently brought\nnotes.\n\n\n\n\n\nTHE NIGHT GARDEN                                                 59","links":[]},{"title":"25 The Bedtime Meeting · Below the surface","image":"/assets/books/5d3bffd6d568022fe63f.jpg","text":"25  / BELOW THE SURFACE\n\nThe bed can become\nan inbox for the day.\n\n\n\n\n\nWHAT MAY BE HAPPENING\n\nPublic-health sleep guidance suggests making\nspace for worries and tomorrow's tasks before bed.\nA cognitive model of insomnia also describes worry\nand monitoring as possible contributors to arousal. If\nbedtime is your first pause, concerns may become\nmore noticeable there. That is one possible pattern,\nalongside physical, environmental and other causes\nof sleep difficulty.\n\nA WAY TO SEE THE PATTERN\n\n\n\n THE DAY'S REMINDERS      AN EARLIER PLAN       A DIFFERENT JOB FOR BED\n\n\n\nTRY THIS / GIVE TOMORROW A PLACE\n\nEarlier in the evening, give yourself a brief period to\nnote one concern and its next useful action:\n'Tomorrow after breakfast, I will call about the bill.'\nLeave the note outside the bedroom if that helps.\nLet it hold the reminder until the chosen time.\n\n\n\nThis is a general suggestion, not an insomnia treatment.\nPersistent sleep difficulty or impaired daytime functioning needs\nassessment.\n\n\n\n\nSOURCES[23]    [26]                                               60","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":77,"label":"[23]"},{"box":[26.94444,95.46875,6.66667,2.34375],"page":77,"label":"[26]"}]},{"title":"26 The Tired Volume Knob","image":"/assets/books/aa430fa0f995ab027049.jpg","text":"26 / THE TIRED VOLUME KNOB\n\nWhy can small\nproblems feel so much\nbigger after poor sleep?\n\n\n\n\n\nYesterday, you could have handled the noise, the\ndelay, the badly worded message. Today, each one\nlands hard. You wonder why you are becoming so\nunreasonable. You have forgotten to include the\nnight in your explanation of the day.\n\n\n\n\n\nTHE NIGHT GARDEN                                                 61","links":[]},{"title":"26 The Tired Volume Knob · Below the surface","image":"/assets/books/022d935c3fb243219c32.jpg","text":"26  / BELOW THE SURFACE\n\nA tired state can\nmasquerade as a\npermanent flaw.\n\n\n\n\nWHAT MAY BE HAPPENING\n\nSleep deficiency can affect attention,\ndecision-making and the ability to regulate emotions\nand behaviour. A difficult night can therefore be part\nof the explanation for today's reduced capacity. It\ndoes not settle whether the problem you face is real.\nIt gives you another factor to consider before judging\nyour character or making an avoidable,\nconsequential decision.\n\nA WAY TO SEE THE PATTERN\n\n\n\n   THE POOR NIGHT        TODAY'S CAPACITY        ADJUST THE NEXT DECISION\n\n\n\nTRY THIS / SAVE THE HOT REPLY\n\nIf a nonurgent message makes you furious after a\npoor night, save a draft instead of sending it\nimmediately. Review it when you are more rested, if\nthe matter can wait. For today, choose the essential\ntask and make the rest of your demands realistic.\n\n\n\nSleepy driving and hazardous work need immediate attention to\nsafety. Repeated or severe daytime sleepiness warrants medical\nadvice.\n\n\n\n\nSOURCES[24]                                                     62","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":77,"label":"[24]"}]},{"title":"27 The Borrowed Tomorrow","image":"/assets/books/27dfe22f2f8fdc6e8769.jpg","text":"27 / THE BORROWED TOMORROW\n\nWhy do I keep scrolling\nwhen I am already\ntired?\n\n\n\n\n\nYou want to sleep. You also want a little time that\nbelongs to you. The next video begins. Then\nanother. You are no longer enjoying it very much,\nbut ending the evening feels strangely difficult.\n\n\n\n\n\nTHE NIGHT GARDEN                                                 63","links":[]},{"title":"27 The Borrowed Tomorrow · Below the surface","image":"/assets/books/c99265b9c3c5c93b4dad.jpg","text":"27  / BELOW THE SURFACE\n\nPersonal time matters.\nSo does the morning\nit borrows from.\n\n\n\n\nWHAT MAY BE HAPPENING\n\nBedtime procrastination means going to bed later\nthan intended when external circumstances do not\nrequire the delay. An early survey linked the pattern\nwith insufficient sleep and self-regulation difficulties.\nWanting more personal time is a possible\nexplanation for the scene pictured here, rather than\na cause established by that study. Different\nsituations call for different responses.\n\nA WAY TO SEE THE PATTERN\n\n\n\n THE TIME YOU WANT      AN ACTIVITY WITH AN END     A CHOSEN BEDTIME\n\n\n\nTRY THIS / CHOOSE AN EVENING ENDING\n\nBefore becoming exhausted, choose the personal\ntime you actually want: one chapter or one episode\nwith a clear ending. Decide what follows it, such as\nputting the phone on charge away from bed. Keep\nthe enjoyable part intentional instead of letting\nautoplay choose its length.\n\n\nShift work, caregiving, pain and insomnia are different from\ndiscretionary delay. The aim is to protect personal time and\nneeded sleep together.\n\n\n\n\nSOURCES[25]                                                     64","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":77,"label":"[25]"}]},{"title":"28 The Demanding Pillow","image":"/assets/books/14e9799a1e01e4544cd9.jpg","text":"28 / THE DEMANDING PILLOW\n\nWhy can trying hard to\nsleep keep me awake?\n\n\n\n\n\nYou calculate how many hours are left. You check\nwhether you feel sleepy yet. You order yourself to\nrelax. The harder you work at the task, the more\nawake you feel inside the effort.\n\n\n\n\n\nTHE NIGHT GARDEN                                                 65","links":[]},{"title":"28 The Demanding Pillow · Below the surface","image":"/assets/books/ccb604ec3575c6c8a3d3.jpg","text":"28  / BELOW THE SURFACE\n\nSleep can become harder\nto invite when you keep\nchecking for its arrival.\n\n\n\n\nWHAT MAY BE HAPPENING\n\nA cognitive model of insomnia describes worry,\narousal and sleep-related monitoring as possible\nparts of a reinforcing cycle. Checking how much time\nremains can add another task to a wakeful night.\nNHS guidance advises against forcing sleep. This\noffers a different response to wakefulness, rather\nthan another target you must successfully achieve.\n\n\n\nA WAY TO SEE THE PATTERN\n\n\n\n THE SLEEP DEADLINE      REPEATED MONITORING        LESS PERFORMANCE PRESSURE\n\n\n\nTRY THIS / STEP OUT OF THE EXAM\n\nIf lying awake is making you frustrated and you can\nmove safely, get up for a quiet activity in low light,\nsuch as reading a few undemanding pages. Return\nwhen you feel sleepier. Keep clock-checking out of\nthe activity where possible.\n\n\n\nPersistent insomnia has effective treatments, including\nclinician-guided CBT-I. Sleep-hygiene tips alone are not an\nadequate treatment for every case.\n\n\n\n\nSOURCES[23]    [26]    [33]                                         66","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":77,"label":"[23]"},{"box":[26.94444,95.46875,6.66667,2.34375],"page":77,"label":"[26]"},{"box":[34.44444,95.46875,6.66667,2.34375],"page":79,"label":"[33]"}]},{"title":"29 The Wandering Lantern","image":"/assets/books/d658c8a47e5f9a9ddd90.jpg","text":"29 / THE WANDERING LANTERN\n\nWhy does my mind\nwander even when I\nmean to pay attention?\n\n\n\n\n\nYou read the same line again. Somewhere between\nits first word and its last, you visited tomorrow,\nremembered a kitchen and began an imaginary\nconversation. Then you notice the page in your\nhand. The lantern has come back.\n\n\n\n\n\nTHE NIGHT GARDEN                                                 67","links":[]},{"title":"29 The Wandering Lantern · Below the surface","image":"/assets/books/a3624a8cf65d194de314.jpg","text":"29  / BELOW THE SURFACE\n\nWhen you notice\nthe wandering,\na choice returns.\n\n\n\n\nWHAT MAY BE HAPPENING\n\nMind wandering shifts attention from the current\nexternal task toward self-generated thought.\nResearch describes costs to tasks such as reading,\nalong with possible functions such as planning.\nNoticing that attention has moved is an important\ndistinction from remaining unaware of it. The useful\nquestion is whether the wandering fits what you\nmeant to be doing now.\n\nA WAY TO SEE THE PATTERN\n\n\n\n  THE CHOSEN TASK       ATTENTION ELSEWHERE      NOTICE AND RETURN\n\n\n\nTRY THIS / FIND THE LAST CLEAR LINE\n\nWhen you notice you have read without taking it in,\nfind the last sentence you understood. Read the\nnext sentence with a finger or cursor marking your\nplace if useful. Let returning be the action; judging\nhow long you wandered only delays it.\n\n\n\nMind wandering is not always harmful. Persistent attention\nproblems that significantly affect daily life deserve appropriate\nsupport or assessment.\n\n\n\n\nSOURCES[27]                                                     68","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":77,"label":"[27]"}]},{"title":"30 The Open Window","image":"/assets/books/d7b45370eae5af5201c5.jpg","text":"30 / THE OPEN WINDOW\n\nWhat if a quieter mind\nstill has thoughts?\n\n\n\n\n\nThere are still things to do. A memory still passes.\nTomorrow has not agreed to be simple. Yet for a\nmoment, you are sitting by an open window. The\nthought arrives. You see it. The room remains\nlarger than the thought.\n\n\n\n\n\nTHE NIGHT GARDEN                                                 69","links":[]},{"title":"30 The Open Window · Below the surface","image":"/assets/books/d48e70606945ec656039.jpg","text":"30  / BELOW THE SURFACE\n\nA quieter mind can\nhold a feeling without\nputting it on trial.\n\n\n\n\nWHAT MAY BE HAPPENING\n\nResearch using laboratory, diary and longitudinal\nmethods links accepting mental experiences with\nbetter psychological health and less negative\nemotion during stress. The authors propose that\nacceptance can reduce reactions that amplify an\nalready difficult experience. The practical distinction\nis between having a feeling and adding a harsh\nverdict about yourself for having it.\n\nA WAY TO SEE THE PATTERN\n\n\n\n    THE FEELING         THE EXTRA VERDICT     ROOM TO RESPOND\n\n\n\nTRY THIS / LEAVE OUT THE EXTRA VERDICT\n\nWhen 'I am anxious' becomes 'I am failing because I\nam anxious,' leave out the second verdict. Name the\nfeeling once and notice the support of your chair or\na sound nearby. Then choose the next useful act,\nincluding asking someone for help.\n\n\n\nAcceptance does not mean approving mistreatment or\nabandoning change. If distress keeps taking over, qualified\nsupport is a useful next step.\n\n\n\n\nSOURCES[28]    [29]                                               70","links":[{"box":[19.44444,95.46875,6.66667,2.34375],"page":78,"label":"[28]"},{"box":[26.94444,95.46875,6.66667,2.34375],"page":78,"label":"[29]"}]},{"title":"The window stays open","image":"/assets/books/3d01cd556eb93d3aa86f.jpg","text":"THE WINDOW STAYS OPEN\n\n\nYou can put\nthe book down now.\n\n\n\n\n\nThere may still be a task on the desk. A\nmessage you have not answered. A future\nyou would like to know more about. For this\nmoment, you are allowed to stop reading and\nreturn to the room you are in.\n\n\n\n\n\nA little understanding can change the next response. You\ncan begin there.\n\n\n\nWHY CAN'T I SWITCH OFF?                                           71","links":[]},{"title":"How these pages use science","image":"/assets/books/b0532e8b5322edb4c89b.jpg","text":"THE NOTES BEHIND THE PICTURES\n\n\nA picture is a metaphor.\nAn explanation needs\nevidence.\n\n\nPatterns, not personal verdicts\n\nThe cited research includes experiments, observational\nstudies, theories, reviews and public-health guidance.\nThese provide different kinds of evidence. Associations\nalone cannot establish cause, and findings from a\nparticular task or sample do not automatically apply to\neveryone.\n\n\nPossibilities, not a treatment programme\n\nThe responses are small options informed by these ideas.\nThey have not been tested together as a book-based\nintervention. Your circumstances, health, relationships\nand resources influence what helps.\n\n\nFollow the source numbers\n\nEach explanation points to numbered references. The\nfollowing pages include source types and clickable links.\nPublication titles are sometimes shortened for readability;\nthe links lead to the original records or guidance.\n\n\n\n\nFirst digital edition, 2026. AI-generated text and artwork, revised and\nsource-checked for this edition.\nVijay Balakrishnan.\n\n\n\nWHY CAN'T I SWITCH OFF?                                           72","links":[]},{"title":"Sources and further reading","image":"/assets/books/be33fa0f6b7a2d4ebd6e.jpg","text":"SOURCES & FURTHER READING\n\nLook a little deeper.\n\nTap a source link to open the original record or guidance.\n\n\n01    Watkins, E. R. (2008)\n\n     Constructive and unconstructive repetitive\n    thought\n\n      Psychological Bulletin, 134, 163-206. Research review.\n\n     Open research record >\n\n02    Gilovich, T., Medvec, V. H., & Savitsky, K. (2000)\n\n    The spotlight effect in social judgment\n\n      Journal of Personality and Social Psychology, 78, 211-222.\n      Experimental studies.\n\n     Open research record >\n\n03    Baumeister, R. F., et al. (2001)\n\n    Bad is stronger than good\n\n      Review of General Psychology, 5, 323-370. Research review.\n\n     Open research record >\n\n04   Wegner, D. M., et al. (1987)\n\n     Paradoxical effects of thought suppression\n\n      Journal of Personality and Social Psychology, 53, 5-13.\n      Experimental studies.\n\n     Open research record >\n\n05   NHS Every Mind Matters\n\n     Tackling your worries\n\n       Public-health guidance on practical problems, hypothetical worries\n     and worry time.\n\n     Open public-health guidance >\n\n\n\n\n\nWHY CAN'T I SWITCH OFF?                                           73","links":[{"box":[15.0,30.96875,61.38889,2.1875],"url":"https://pubmed.ncbi.nlm.nih.gov/18298268/","label":"Open research record >"},{"box":[15.0,44.5625,61.38889,2.1875],"url":"https://pubmed.ncbi.nlm.nih.gov/10707330/","label":"Open research record >"},{"box":[15.0,56.25,61.38889,2.1875],"url":"https://doi.org/10.1037/1089-2680.5.4.323","label":"Open research record >"},{"box":[15.0,69.84375,61.38889,2.1875],"url":"https://pubmed.ncbi.nlm.nih.gov/3612492/", "label":"Open public-health guidance >"},{"box":[15.0,73.65625,61.38889,2.1875],"url":"https://www.nhs.uk/every-mind-matters/mental-wellbeing-tips/self-help-cbt-techniques/facing-your-fears/","label":"Open public-health guidance >"},{"box":[15.0,85.34375,61.38889,2.1875],"url":"https://www.health.wa.gov.au/sitecore/content/Healthy-WA/Articles/U_Z/Unhelpful-thinking-styles","label":"Open public-health guidance >"}]},{"title":"Sources and further reading","image":"/assets/books/69544427cc6892f2a6ee.jpg","text":"SOURCES & FURTHER READING\n\nLook a little deeper.\n\nTap a source link to open the original record or guidance.\n\n\n11   Wood, W., & Runger, D. (2016)\n\n    Psychology of habit\n\n      Annual Review of Psychology, 67, 289-314. Research review.\n\n     Open research record >\n\n12    Stothart, C., Mitchum, A., & Yehnert, C. (2015)\n\n    The attentional cost of receiving a cell phone\n     notification\n\n      Journal of Experimental Psychology: Human Perception and\n      Performance, 41, 893-897. Laboratory study.\n\n     Open research record >\n\n13    Rubinstein, J. S., Meyer, D. E., & Evans, J. E. (2001)\n\n    Executive control of cognitive processes in task\n     switching\n\n      Journal of Experimental Psychology: Human Perception and\n      Performance, 27, 763-797. Experimental studies.\n\n     Open research record >\n\n14    Sirois, F., & Pychyl, T. (2013)\n\n     Procrastination and the priority of short-term\n    mood regulation\n\n       Social and Personality Psychology Compass, 7, 115-127.\n       Theoretical review.\n\n     Open research record >\n\n\n\n\n\nWHY CAN'T I SWITCH OFF?                                           75","links":[{"box":[15.0,28.71875,61.38889,2.1875],"url":"https://pubmed.ncbi.nlm.nih.gov/26361052/","label":"Open research record >"},{"box":[15.0,44.5625,61.38889,2.1875],"url":"https://pubmed.ncbi.nlm.nih.gov/26121498/","label":"Open research record >"},{"box":[15.0,60.40625,61.38889,2.1875],"url":"https://pubmed.ncbi.nlm.nih.gov/11518143/","label":"Open research record >"},{"box":[15.0,76.25,61.38889,2.1875],"url":"https://doi.org/10.1111/spc3.12011","label":"Open research record >"}]},{"title":"Sources and further reading","image":"/assets/books/d13c6211eb770e2571ad.jpg","text":"SOURCES & FURTHER READING\n\nLook a little deeper.\n\nTap a source link to open the original record or guidance.\n\n\n15   Masicampo, E. J., & Baumeister, R. F. (2011)\n\n    Consider it done! Plan making can eliminate\n    the cognitive effects of unfulfilled goals\n\n      Journal of Personality and Social Psychology, 101, 667-683.\n      Experimental studies.\n\n     Open research record >\n\n16    Vogel, E. A., et al. (2014)\n\n     Social comparison, social media, and\n     self-esteem\n\n      Psychology of Popular Media Culture, 3, 206-222. Correlational\n     and experimental studies.\n\n     Open research record >\n\n17    Centre for Clinical Interventions, Western Australia\n\n     Perfectionism in perspective\n\n       Public-health self-help resources on demanding standards and\n       self-worth.\n\n     Open public-health guidance >\n\n18    Centre for Clinical Interventions, Western Australia\n\n     Assert yourself!\n\n       Public-health self-help resources, including saying no assertively.\n\n     Open public-health guidance >\n\n\n\n\n\nWHY CAN'T I SWITCH OFF?                                           76","links":[{"box":[15.0,32.875,61.38889,2.1875],"url":"https://pubmed.ncbi.nlm.nih.gov/21688924/","label":"Open research record >"},{"box":[15.0,48.71875,61.38889,2.1875],"url":"https://doi.org/10.1037/ppm0000047","label":"Open research record >"},{"box":[15.0,62.3125,61.38889,2.1875],"url":"https://www.cci.health.wa.gov.au/resources/looking-after-yourself/perfectionism","label":"Open public-health guidance >"},{"box":[15.0,74.0,61.38889,2.1875],"url":"https://www.cci.health.wa.gov.au/en/Resources/Looking-After-Yourself/Assertiveness","label":"Open public-health guidance >"}]},{"tit (2002)\n\n   A cognitive model of insomnia\n\n      Behaviour Research and Therapy, 40, 869-893. Theoretical model\n     and review.\n\n     Open research record >\n\n24   US National Heart, Lung, and Blood Institute\n\n    Sleep deprivation and deficiency: how sleep\n     affects your health\n\n       Public-health information on sleep, emotions, attention and\n       functioning.\n\n     Open public-health guidance >\n\n25    Kroese, F. M., et al. (2014)\n\n    Bedtime procrastination: introducing a new\n    area of procrastination\n\n       Frontiers in Psychology, 5, 611. Survey study; associations do not\n       establish causation.\n\n     Open research record >\n\n26   NHS Every Mind Matters\n\n   How to fall asleep faster and sleep better\n\n       Public-health guidance, including not forcing sleep.\n\n     Open public-health guidance >\n\n27   Smallwood, J., & Schooler, J. W. (2015)\n\n    The science of mind wandering\n\n      Annual Review of Psychology, 66, 487-518. Research review.\n\n     Open research record >\n\n\n\n\n\nWHY CAN'T I SWITCH OFF?                                           78","links":[{"box":[15.0,30.625,61.38889,2.1875],"url":"https://pubmed.ncbi.nlm.nih.gov/12186352/","label":"Open research record >"},{"box":[15.0,46.46875,61.38889,2.1875],"url":"https://www.nhlbi.nih.gov/health/sleep-deprivation/health-effects","label":"Open public-health guidance >"},{"box":[15.0,62.3125,61.38889,2.1875],"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC4062817/","label":"Open research record >"},{"box":[15.0,74.0,61.38889,2.1875],"url":"https://www.nhs.uk/every-mind-matters/mental-wellbeing-tips/how-to-fall-asleep-faster-and-sleep-better/","label":"Open public-health guidance >"},{"box":[15.0,85.6875,61.38889,2.1875],"url":"https://pubmed.ncbi.nlm.nih.gov/25293689/","label":"Open research record >"}]},{"title":"Sources and further reading","image":"/assets/books/997880911f26dcf76e94.jpg","text":"SOURCES & FURTHER READING\n\nLook a little deeper.\n\nTap a source link to open the original record or guidance.\n\n\n28    Ford, B. Q., et al. (2018)\n\n    The psychological health benefits of accepting\n     negative emotions and thoughts\n\n      Journal of Personality and Social Psychology, 115, 1075-1092.\n       Laboratory, diary and longitudinal evidence.\n\n     Open research record >\n\n29   US National Institute of Mental Health\n\n    Caring for your mental health\n\n       Public-health guidance on self-care and when to seek professional\n       help.\n\n     Open public-health guidance >\n\n30   NHS Every Mind Matters\n\n    Problem solving\n\n       Public-health guidance on identifying a practical problem and\n      making a specific, manageable plan.\n\n     Open public-health guidance >\n\n31    Kruger, J., Epley, N., Parker, J., & Ng, Z.-W. (2005)\n\n    Egocentrism over e-mail: can we communicate\n    as well as we think?\n\n      Journal of Personality and Social Psychology, 89, 925-936. Five\n      experiments on communicating tone.\n\n     Open research record >\n\n\n\n\n\nWHY CAN'T I SWITCH OFF?                                           79","links":[{"box":[15.0,32.875,61.38889,2.1875],"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC5767148/","label":"Open research record >"},{"box":[15.0,46.46875,61.38889,2.1875],"url":"https://www.nimh.nih.gov/health/topics/caring-for-your-mental-health","label":"Open public-health guidance >"},{"box":[15.0,60.0625,61.38889,2.1875],"url":"https://www.nhs.uk/every-mind-matters/mental-wellbeing-tips/self-help-cbt-techniques/problem-solving/","label":"Open public-health guidance >"},{"box":[15.0,75.90625,61.38889,2.1875],"url":"https://pubmed.ncbi.nlm.nih.gov/16393025/","label":"Open research record >"}]},{"title":"Sources and further reading","image":"/assets/books/b7b74f4b917940c2b88f.jpg","text":"SOURCES & FURTHER READING\n\nLook a little deeper.\n\nTap a source link to open the original record or guidance.\n\n\n32    Leroy, S. (2009)\n\n   Why is it so hard to
