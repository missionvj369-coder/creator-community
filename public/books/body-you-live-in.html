'use strict';
const PAGES=[{"number":1,"folio":"","kind":"cover","title":"The Body You Live In","text":"","chapter":-1,"fact":0,"image":"/assets/books/2a34e9085184558b2ff3.webp","links":[]},{"number":2,"folio":"","kind":"endpaper","title":"Inside cover","text":"","chapter":-1,"fact":0,"image":"/assets/books/60d33ff806c3d9f906d0.webp","links":[]},{"number":3,"folio":"i","kind":"half-title","title":"The Body You Live In","text":"","chapter":-1,"fact":0,"image":"/assets/books/1b771d74c57dd434e2bd.webp","links":[]},{"number":4,"folio":"ii","kind":"frontispiece","title":"A world within","text":"","chapter":-1,"fact":0,"image":"/assets/books/2a2adaae6efccd253c7d.webp","links":[]},{"number":5,"folio":"iii","kind":"title","title":"The Body You Live In","text":"","chapter":-1,"fact":0,"image":"/assets/books/c4dc16ebab9b1fceac14.webp","links":[]},{"number":6,"folio":"iv","kind":"copyright","title":"Copyright and edition information","text":"Copyright 2026 neoXhuman. All rights reserved. First illustrated edition, 2026. Illustrations are AI-assisted artistic interpretations. Sources are included for every fact.","chapter":-1,"fact":0,"image":"/assets/books/03f23f5dea5de81f34c9.webp","links":[]},{"number":7,"folio":"v","kind":"dedication","title":"Dedication","text":"For the body that has carried you through every ordinary day.","chapter":-1,"fact":0,"image":"/assets/books/8ec6fc3c97da180484fa.webp","links":[]},{"number":8,"folio":"vi","kind":"epigraph","title":"An ordinary breath","text":"An ordinary breath. A universe of living work. - neoXhuman","chapter":-1,"fact":0,"image":"/assets/books/138b93d80b13467d4f17.webp","links":[]},{"number":9,"folio":"vii","kind":"contents","title":"Contents","text":"","chapter":-1,"fact":0,"image":"/assets/books/ddfbafd49021228f7629.webp","links":[{"x":0.075,"y":0.2222222222222222,"w":0.85,"h":0.13333333333333333,"page":16},{"x":0.075,"y":0.375,"w":0.85,"h":0.13333333333333333,"page":26},{"x":0.075,"y":0.5277777777777778,"w":0.85,"h":0.13333333333333333,"page":36},{"x":0.075,"y":0.6805555555555556,"w":0.85,"h":0.13333333333333333,"page":46}]},{"number":10,"folio":"viii","kind":"contents","title":"Contents","text":"","chapter":-1,"fact":0,"image":"/assets/books/c59d16fff0c2fdb22832.webp","links":[{"x":0.075,"y":0.2222222222222222,"w":0.85,"h":0.13333333333333333,"page":56},{"x":0.075,"y":0.375,"w":0.85,"h":0.13333333333333333,"page":64},{"x":0.075,"y":0.5277777777777778,"w":0.85,"h":0.13333333333333333,"page":74},{"x":0.075,"y":0.6805555555555556,"w":0.85,"h":0.13333333333333333,"page":82}]},{"number":11,"folio":"ix","kind":"contents","title":"Contents","text":"","chapter":-1,"fact":0,"image":"/assets/books/03bb34e68568726d5582.webp","links":[{"x":0.075,"y":0.2222222222222222,"w":0.85,"h":0.13333333333333333,"page":92},{"x":0.075,"y":0.375,"w":0.85,"h":0.13333333333333333,"page":102},{"x":0.075,"y":0.5277777777777778,"w":0.85,"h":0.13333333333333333,"page":112},{"x":0.075,"y":0.6805555555555556,"w":0.85,"h":0.13333333333333333,"page":122},{"x":0.075,"y":0.8805555555555555,"w":0.2708333333333333,"h":0.019444444444444445,"page":136},{"x":0.075,"y":0.9013888888888889,"w":0.2708333333333333,"h":0.019444444444444445,"page":142},{"x":0.075,"y":0.9222222222222223,"w":0.2708333333333333,"h":0.019444444444444445,"page":155}]},{"number":12,"folio":"x","kind":"preface","title":"A place you already know","text":"You have known your hands for as long as you can remember. You know the small crease beside a knuckle, the way your fingers settle around a cup, the familiar shape of your own writing. Yet beneath that familiar surface is a world you have never seen.\n\nThe same is true of an ordinary breath. It arrives so quietly that you can miss it. Inside, air and blood meet across extraordinarily thin boundaries. Muscles change the space in your chest. Signals adjust the next breath to the needs of the moment. A simple action is the visible edge of a much larger collaboration.\n\nThis book begins with that sense of closeness and surprise. The human body is not a distant subject reserved for a classroom. It is the place from which you meet every other subject: food, love, work, movement, illness, sleep and the passage of time.\n\nThe pages ahead gather 99 essential facts into a visual journey. Some explain familiar experiences. Some untangle a common misunderstanding. Others introduce a small structure whose work reaches much further than its size suggests.","chapter":-1,"fact":0,"image":"/assets/books/0e8e8eee7c8658d7621d.webp","links":[]},{"number":13,"folio":"xi","kind":"preface","title":"A closer kind of curiosity","text":"The illustrations give these ideas a world to live in. Their paper gardens, rivers, rooms and pathways are artistic interpretations. They invite you closer; the words and references explain the science. A ribbon is not a nerve, and a garden is not an organ, but a thoughtful picture can help an unfamiliar process become easier to remember.\n\nYou can read from beginning to end, following the body from cells to a whole human life. You can also open a page because a question has stayed with you. There is no examination waiting at the back. Curiosity is enough.\n\nPerhaps the most useful change is a quiet one: a little less distance between you and the living body that has carried you through every day you have known.","chapter":-1,"fact":0,"image":"/assets/books/a4ec68f4cb9f5264ba97.webp","links":[]},{"number":14,"folio":"xii","kind":"reading","title":"One page. One discovery.","text":"Read a single fact or follow the chapters. Every page includes an illustration, an explanation and a thought to keep. Sources, glossary and index support further exploration.","chapter":-1,"fact":0,"image":"/assets/books/dc50c3aa7675ad362609.webp","links":[]},{"number":15,"folio":"xiii","kind":"art-note","title":"Reading the pictures","text":"The illustrations are artistic metaphors, not exact anatomical diagrams. Shapes, proportions and colours are creative choices. The words and sources explain the science.","chapter":-1,"fact":0,"image":"/assets/books/628de4e81ee59a0d0272.webp","links":[]},{"number":16,"folio":"xiv","kind":"threshold","title":"Begin within","text":"","chapter":-1,"fact":0,"image":"/assets/books/8d6a26ed053886e050f5.webp","links":[]},{"number":17,"folio":"1","kind":"chapter","title":"Small beginnings","text":"The living world beneath your skin.","chapter":0,"fact":0,"image":"/assets/books/529a57bed31d53f03663.webp","links":[]},{"number":18,"folio":"2","kind":"fact","title":"You are a community of cells.","text":"Your body is made of tens of trillions of human cells, specialised for different jobs.\n\nA red blood cell carries oxygen. A muscle cell creates force. A nerve cell sends signals. Size and cell counts vary between people; no single number describes every human.\n\nThe word \"body\" describes a living collaboration.","chapter":0,"fact":1,"image":"/assets/books/6bf45bbdad486cf32350.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nigms.nih.gov/biobeat/2024/09/cells-by-the-numbers-2"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIGMS, NIH","title":"Cells by the Numbers","url":"https://www.nigms.nih.gov/biobeat/2024/09/cells-by-the-numbers-2"}]},{"number":19,"folio":"3","kind":"fact","title":"Every cell has a border.","text":"A cell membrane is a selective boundary, not a sealed wall.\n\nIts double layer of fats contains proteins that move substances, receive signals and connect cells. Water, ions and nutrients cross in controlled ways, helping the inside stay different from the outside.\n\nLife depends on carefully managed exchange.","chapter":0,"fact":2,"image":"/assets/books/e8ba9a4df6eb7adda41d.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.genome.gov/genetics-glossary/Plasma-Membrane-Cell-Membrane"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NHGRI, NIH","title":"Plasma Membrane (Cell Membrane)","url":"https://www.genome.gov/genetics-glossary/Plasma-Membrane-Cell-Membrane"}]},{"number":20,"folio":"4","kind":"fact","title":"DNA is information, not a prophecy.","text":"DNA stores instructions used to build and maintain your body.\n\nIts sequence helps cells make proteins and regulate their work. Health also depends on environment, development, chance and behaviour. Having a genetic risk does not always mean a disease will develop.\n\nAn instruction is different from an inevitable outcome.","chapter":0,"fact":3,"image":"/assets/books/d6b7abaa2d821724034a.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.genome.gov/about-genomics/fact-sheets/Deoxyribonucleic-Acid-Fact-Sheet"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NHGRI, NIH","title":"Deoxyribonucleic Acid (DNA) Fact Sheet","url":"https://www.genome.gov/about-genomics/fact-sheets/Deoxyribonucleic-Acid-Fact-Sheet"}]},{"number":21,"folio":"5","kind":"fact","title":"Your chromosomes come in pairs.","text":"Most human body cells typically contain 23 pairs of chromosomes.\n\nOne set comes from each biological parent. Eggs and sperm usually carry 23 individual chromosomes. Mature red blood cells have no nucleus, and chromosome variations occur, so \"every cell has 46\" is too simple.\n\nThe usual pattern has important exceptions.","chapter":0,"fact":4,"image":"/assets/books/270063f57b4019fec5f0.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.genome.gov/about-genomics/fact-sheets/Chromosomes-Fact-Sheet"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NHGRI, NIH","title":"Chromosomes Fact Sheet","url":"https://www.genome.gov/about-genomics/fact-sheets/Chromosomes-Fact-Sheet"}]},{"number":22,"folio":"6","kind":"fact","title":"Same DNA. Different jobs.","text":"A skin cell and a nerve cell can use different parts of largely the same genetic instructions.\n\nGene regulation helps determine which proteins a cell makes. Chemical marks on DNA and its associated proteins can affect gene activity without changing the DNA sequence.\n\nDifferent pages of the same instruction book are in use.","chapter":0,"fact":5,"image":"/assets/books/b6dc2323a903b1d3fc46.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.genome.gov/about-genomics/fact-sheets/Epigenomics-Fact-Sheet"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NHGRI, NIH","title":"Epigenomics Fact Sheet","url":"https://www.genome.gov/about-genomics/fact-sheets/Epigenomics-Fact-Sheet"}]},{"number":23,"folio":"7","kind":"fact","title":"Your cells keep making usable energy.","text":"Mitochondria make much of the ATP that powers many cellular processes.\n\nATP is an energy-carrying molecule that cells continually use and replenish. Mitochondria also contain a small amount of their own DNA, usually inherited from the mother.\n\nA living cell needs a continuing energy supply.","chapter":0,"fact":6,"image":"/assets/books/fee04e2bb5fc15358902.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.genome.gov/genetics-glossary/Mitochondria"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NHGRI, NIH","title":"Mitochondria","url":"https://www.genome.gov/genetics-glossary/Mitochondria"}]},{"number":24,"folio":"8","kind":"fact","title":"You do not become entirely new every seven years.","text":"Different tissues replace their cells at very different rates.\n\nSome blood and gut-lining cells turn over quickly. Many nerve cells can last a lifetime. Tissue repair also varies, so there is no single date on which your whole body has been replaced.\n\nRenewal happens on many overlapping clocks.","chapter":0,"fact":7,"image":"/assets/books/50702bde7573921f9ac9.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://nigms.nih.gov/education/fact-sheets/Pages/regeneration"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIGMS, NIH","title":"Regeneration","url":"https://nigms.nih.gov/education/fact-sheets/Pages/regeneration"}]},{"number":25,"folio":"9","kind":"fact","title":"Your body is always making adjustments.","text":"Homeostasis keeps internal conditions within workable ranges.\n\nFeedback systems adjust temperature, blood glucose, water and many other variables. A small change can trigger a response that pushes conditions back toward balance; the target itself may change with circumstances.\n\nStability is an active process.","chapter":0,"fact":8,"image":"/assets/books/ecd84a49a08388ec2913.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://openstax.org/books/anatomy-and-physiology/pages/1-5-homeostasis"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"OpenStax, Rice University","title":"Anatomy and Physiology: Homeostasis","url":"https://openstax.org/books/anatomy-and-physiology/pages/1-5-homeostasis"}]},{"number":26,"folio":"10","kind":"quote","title":"A whole life begins with small exchanges.","text":"","chapter":0,"fact":0,"image":"/assets/books/29f6fa1f0e53d57741b2.webp","links":[]},{"number":27,"folio":"11","kind":"chapter","title":"Brain & nerves","text":"A body that feels, learns and responds.","chapter":1,"fact":0,"image":"/assets/books/97a4df22741ffae15bc8.webp","links":[]},{"number":28,"folio":"12","kind":"fact","title":"Nerves use electricity and chemistry.","text":"An electrical impulse can travel along a neuron; chemicals often carry the message to the next cell.\n\nAt many synapses, a neuron releases a neurotransmitter into a tiny gap. Receptors on the receiving cell help turn that chemical message into a response.\n\nA thought depends on cells communicating.","chapter":1,"fact":9,"image":"/assets/books/cf5546a924a79ea2f842.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.ninds.nih.gov/health-information/public-education/brain-basics/brain-basics-know-your-brain"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NINDS, NIH","title":"Brain Basics: Know Your Brain","url":"https://www.ninds.nih.gov/health-information/public-education/brain-basics/brain-basics-know-your-brain"}]},{"number":29,"folio":"13","kind":"fact","title":"Insulation helps nerve signals travel.","text":"Myelin wraps around many nerve fibres and helps electrical signals move efficiently.\n\nGaps between myelin segments allow a signal to be regenerated along the fibre. Damage to this insulation can disrupt communication.\n\nA microscopic covering can change how a whole body functions.","chapter":1,"fact":10,"image":"/assets/books/9d7c9a9ee654cf24ec4e.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.ninds.nih.gov/health-information/public-education/brain-basics/brain-basics-know-your-brain"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NINDS, NIH","title":"Brain Basics: Know Your Brain","url":"https://www.ninds.nih.gov/health-information/public-education/brain-basics/brain-basics-know-your-brain"}]},{"number":30,"folio":"14","kind":"fact","title":"Learning can change your brain.","text":"Practice and experience can alter connections and the organisation of brain circuits.\n\nThis capacity is called plasticity. Change depends on what is practised, how often, the person's age and other conditions. There is no single fixed timetable for every skill or person.\n\nPlasticity is a capacity, not a countdown.","chapter":1,"fact":11,"image":"/assets/books/f88b804a0ef37c9d02c8.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC5697733/"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"Wenger et al., Trends in Cognitive Sciences (2017)","title":"Expansion and Renormalization of Human Brain Structure During Skill Acquisition","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC5697733/"}]},{"number":31,"folio":"15","kind":"fact","title":"A memory is not stored in one drawer.","text":"Different brain systems contribute to forming and retrieving different kinds of memory.\n\nThe hippocampus helps form many new memories. Other networks support skills, emotion and long-term knowledge. Remembering depends on coordinated activity.\n\nYour past is supported by a network.","chapter":1,"fact":12,"image":"/assets/books/d07f281cbd93295ce890.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.ninds.nih.gov/health-information/public-education/brain-basics/brain-basics-know-your-brain"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NINDS, NIH","title":"Brain Basics: Know Your Brain","url":"https://www.ninds.nih.gov/health-information/public-education/brain-basics/brain-basics-know-your-brain"}]},{"number":32,"folio":"16","kind":"fact","title":"Pain is real, but it is not a damage meter.","text":"Pain emerges from the nervous system's processing of many signals.\n\nInjury can cause pain, but pain can also persist after healing or arise from altered nerve processing. Its intensity does not always match the amount of visible tissue damage.\n\nPain deserves care even when a scan looks normal.","chapter":1,"fact":13,"image":"/assets/books/0a574aab804f1449db98.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.ninds.nih.gov/health-information/disorders/pain"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NINDS, NIH","title":"Pain","url":"https://www.ninds.nih.gov/health-information/disorders/pain"}]},{"number":33,"folio":"17","kind":"fact","title":"Some reactions take a shorter route.","text":"A withdrawal reflex can begin through spinal circuits before you consciously decide to move.\n\nSensory neurons carry a signal inward; spinal connections activate motor neurons that move the affected limb. The brain also receives information and can influence reflexes.\n\nPulling away from heat can start before conscious awareness.","chapter":1,"fact":14,"image":"/assets/books/ddb9fc4653ec3a15547c.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://openstax.org/books/introduction-behavioral-neuroscience/pages/10-2-eliciting-contractions-from-lower-levels-lower-motoneurons-and-reflex-arcs"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"OpenStax, Rice University","title":"Lower Motoneurons and Reflex Arcs","url":"https://openstax.org/books/introduction-behavioral-neuroscience/pages/10-2-eliciting-contractions-from-lower-levels-lower-motoneurons-and-reflex-arcs"}]},{"number":34,"folio":"18","kind":"fact","title":"Many essential jobs run automatically.","text":"The autonomic nervous system helps regulate heartbeat, digestion, sweating and other functions.\n\nIts sympathetic and parasympathetic divisions adjust activity to changing needs. They interact continuously; the body does not live in a permanent \"on\" or \"off\" state.\n\nMuch of staying alive needs no conscious instruction.","chapter":1,"fact":15,"image":"/assets/books/b016d797dce109ff4951.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.medlineplus.gov/autonomicnervoussystemdisorders.html"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"MedlinePlus, NLM","title":"Autonomic Nervous System Disorders","url":"https://www.medlineplus.gov/autonomicnervoussystemdisorders.html"}]},{"number":35,"folio":"19","kind":"fact","title":"Stress is a whole-body event.","text":"The stress response can change breathing, heart rate, muscle tension and hormone release.\n\nIt can help you respond to immediate demands. When stress is persistent, repeated activation can affect health. A physical stress sensation is not, by itself, proof that you are in danger.\n\nAn alarm is a response; it is not always a prediction.","chapter":1,"fact":16,"image":"/assets/books/84197138a9a72360b370.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nccih.nih.gov/health/stress"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NCCIH, NIH","title":"Stress","url":"https://www.nccih.nih.gov/health/stress"}]},{"number":36,"folio":"20","kind":"quote","title":"Your experience of the world depends on a conversation between cells.","text":"","chapter":1,"fact":0,"image":"/assets/books/34af1f70544f32b5b901.webp","links":[]},{"number":37,"folio":"21","kind":"chapter","title":"Your sensory world","text":"Reality arrives as signals.","chapter":2,"fact":0,"image":"/assets/books/b301b94ec5effa5c8307.webp","links":[]},{"number":38,"folio":"22","kind":"fact","title":"Your eyes start vision; your brain completes it.","text":"Light is focused onto the retina, where specialised cells convert it into electrical signals.\n\nThe optic nerve carries those signals to the brain. Seeing depends on this whole pathway, not just on the eye's lens.\n\nYou experience a world assembled from signals.","chapter":2,"fact":17,"image":"/assets/books/e5c955e6a49df14cefa1.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nei.nih.gov/learn-about-eye-health/healthy-vision/how-eyes-work"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"National Eye Institute, NIH","title":"How the Eyes Work","url":"https://www.nei.nih.gov/learn-about-eye-health/healthy-vision/how-eyes-work"}]},{"number":39,"folio":"23","kind":"fact","title":"Your pupil is an opening.","text":"The coloured iris changes the pupil's size to control how much light enters the eye.\n\nIn bright conditions the opening usually becomes smaller; in dim conditions it usually becomes larger. The pupil itself is not a black object inside your eye.\n\nThe apparent black circle is a doorway for light.","chapter":2,"fact":18,"image":"/assets/books/6c5bbf7b64f82b9edd0c.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nei.nih.gov/learn-about-eye-health/healthy-vision/how-eyes-work"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"National Eye Institute, NIH","title":"How the Eyes Work","url":"https://www.nei.nih.gov/learn-about-eye-health/healthy-vision/how-eyes-work"}]},{"number":40,"folio":"24","kind":"fact","title":"Tears do more than express emotion.","text":"A healthy tear film protects and smooths the surface of your eye.\n\nIt includes oily, watery and mucus components that work together. Blinking spreads this film; problems with its amount or composition can cause dry-eye symptoms.\n\nA clear view depends on a very thin wet surface.","chapter":2,"fact":19,"image":"/assets/books/4a5c729bf44b26ee4298.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nei.nih.gov/eye-health-information/healthy-vision/how-eyes-work/how-tears-work"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"National Eye Institute, NIH","title":"How Tears Work","url":"https://www.nei.nih.gov/eye-health-information/healthy-vision/how-eyes-work/how-tears-work"}]},{"number":41,"folio":"25","kind":"fact","title":"Hearing begins as movement.","text":"Sound vibrates the eardrum and middle-ear bones, then creates waves in the fluid-filled cochlea.\n\nSensory hair cells convert that movement into electrical signals. The auditory nerve carries them to the brain.\n\nA voice becomes mechanical motion, then a nerve message.","chapter":2,"fact":20,"image":"/assets/books/5f94fe7ff25f17b5b11b.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nidcd.nih.gov/health/how-do-we-hear"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIDCD, NIH","title":"How Do We Hear?","url":"https://www.nidcd.nih.gov/health/how-do-we-hear"}]},{"number":42,"folio":"26","kind":"fact","title":"Loud sound can leave permanent damage.","text":"Noise can injure delicate sensory hair cells in the inner ear.\n\nIn humans, damaged hearing hair cells do not normally regrow. Risk depends on loudness, exposure time and distance, and a single very intense sound can also cause injury.\n\nEnjoying sound includes protecting the cells that detect it.","chapter":2,"fact":21,"image":"/assets/books/e078e656503a07feb271.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nidcd.nih.gov/health/how-does-noise-damage-your-hearing"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIDCD, NIH","title":"How Does Noise Damage Your Hearing?","url":"https://www.nidcd.nih.gov/health/how-does-noise-damage-your-hearing"}]},{"number":43,"folio":"27","kind":"fact","title":"Balance has more than one information source.","text":"Your brain combines signals from the inner ears, eyes, muscles and joints to help keep you steady.\n\nInner-ear structures sense head movement and position. Conflicting or disrupted information can contribute to dizziness or unsteadiness.\n\nStanding still is a coordinated sensory achievement.","chapter":2,"fact":22,"image":"/assets/books/6dcbd0d6b531284baefc.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nidcd.nih.gov/health/balance-disorders"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIDCD, NIH","title":"Balance Disorders","url":"https://www.nidcd.nih.gov/health/balance-disorders"}]},{"number":44,"folio":"28","kind":"fact","title":"Much of flavour comes through your nose.","text":"Odours reach smell receptors when you sniff and when aromas rise from food during chewing.\n\nYour brain combines smell with taste, texture and temperature. A blocked nose can therefore make a meal seem strangely flat.\n\nTaste and flavour are related, but they are not identical.","chapter":2,"fact":23,"image":"/assets/books/504e5f4b75914e34f7df.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nidcd.nih.gov/health/smell-disorders"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIDCD, NIH","title":"Smell Disorders","url":"https://www.nidcd.nih.gov/health/smell-disorders"}]},{"number":45,"folio":"29","kind":"fact","title":"The old tongue map is misleading.","text":"Sweet, sour, salty, bitter and umami are not restricted to separate tongue zones.\n\nTaste cells for these qualities are distributed across taste-bud-containing regions. Sensitivity can vary, but the tip is not the only place that detects sweetness.\n\nYour tongue is not divided into five exclusive territories.","chapter":2,"fact":24,"image":"/assets/books/fad3d826f573955d7d24.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nidcd.nih.gov/health/taste-disorders"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIDCD, NIH","title":"Taste Disorders","url":"https://www.nidcd.nih.gov/health/taste-disorders"}]},{"number":46,"folio":"30","kind":"quote","title":"A familiar world arrives through remarkable pathways.","text":"","chapter":2,"fact":0,"image":"/assets/books/d4f56e946a604033b821.webp","links":[]},{"number":47,"folio":"31","kind":"chapter","title":"Heart & blood","text":"The delivery network that never closes.","chapter":3,"fact":0,"image":"/assets/books/6608110a513dba66f6c3.webp","links":[]},{"number":48,"folio":"32","kind":"fact","title":"Your heart is two pumps working together.","text":"The right side sends blood to the lungs; the left side sends it around the body.\n\nIts four chambers and valves organise this movement. The muscular left ventricle supplies the pressure needed for the larger body circuit.\n\nThe lungs and the rest of the body are connected in a loop.","chapter":3,"fact":25,"image":"/assets/books/8b2a9cfd26ad393f341e.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nhlbi.nih.gov/health/heart/anatomy"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NHLBI, NIH","title":"How the Heart Works: Anatomy","url":"https://www.nhlbi.nih.gov/health/heart/anatomy"}]},{"number":49,"folio":"33","kind":"fact","title":"A heartbeat starts with an electrical signal.","text":"Specialised heart cells generate and conduct the signals that coordinate a beat.\n\nThe sinoatrial node normally sets the rhythm. Nerves and hormones can speed or slow it, while the heart's own electrical network organises the sequence.\n\nYour heart has a built-in timing system.","chapter":3,"fact":26,"image":"/assets/books/a398a9bf85ff547740fc.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nhlbi.nih.gov/health/heart/heart-beats"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NHLBI, NIH","title":"How the Heart Works: How the Heart Beats","url":"https://www.nhlbi.nih.gov/health/heart/heart-beats"}]},{"number":50,"folio":"34","kind":"fact","title":"Arteries and veins are named by direction.","text":"Arteries carry blood away from the heart; veins carry it back.\n\nThe pulmonary arteries carry oxygen-poor blood to the lungs. Pulmonary veins return oxygen-rich blood. Oxygen content alone does not define either kind of vessel.\n\nThe exception disappears when you follow the direction.","chapter":3,"fact":27,"image":"/assets/books/0fd4fdaa7c7318f7eee8.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nhlbi.nih.gov/health/heart/blood-flow"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NHLBI, NIH","title":"How Blood Flows through the Heart","url":"https://www.nhlbi.nih.gov/health/heart/blood-flow"}]},{"number":51,"folio":"35","kind":"fact","title":"The smallest vessels do the exchanging.","text":"Capillaries form fine networks between the arterial and venous sides of circulation.\n\nTheir thin walls allow oxygen, nutrients and wastes to move between blood and surrounding tissues. The large vessels transport; these tiny vessels bring the delivery close.\n\nA delivery network needs local access.","chapter":3,"fact":28,"image":"/assets/books/b2e462a410e9fcfc5193.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://training.seer.cancer.gov/anatomy/cardiovascular/blood/classification.html"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"SEER Training, National Cancer Institute","title":"Classification and Structure of Blood Vessels","url":"https://training.seer.cancer.gov/anatomy/cardiovascular/blood/classification.html"}]},{"number":52,"folio":"36","kind":"fact","title":"Your blood carries oxygen using iron.","text":"Haemoglobin inside red blood cells binds oxygen with the help of iron-containing groups.\n\nRed cells load oxygen in the lungs and deliver it to tissues. Having too little healthy haemoglobin can reduce oxygen delivery and contribute to fatigue.\n\nIron matters because of the job it helps a protein do.","chapter":3,"fact":29,"image":"/assets/books/fa4678e227dc2ef699e5.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.hematology.org/education/patients/blood-basics"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"American Society of Hematology","title":"Blood Basics","url":"https://www.hematology.org/education/patients/blood-basics"}]},{"number":53,"folio":"37","kind":"fact","title":"Blood cells are made inside bones.","text":"Blood-forming stem cells in bone marrow produce red cells, many white cells and platelets.\n\nThese products have different jobs: oxygen transport, defence and clotting. The soft tissue inside certain bones is therefore essential to your circulating blood.\n\nYour skeleton contains a blood-cell factory.","chapter":3,"fact":30,"image":"/assets/books/a1faa753b913604269a6.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.hematology.org/education/patients/blood-basics"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"American Society of Hematology","title":"Blood Basics","url":"https://www.hematology.org/education/patients/blood-basics"}]},{"number":54,"folio":"38","kind":"fact","title":"A clot is a coordinated repair.","text":"Platelets gather at an injured blood vessel, while clotting proteins help form a stabilising fibrin mesh.\n\nThis process limits bleeding. Clotting in the wrong place can block blood flow, so the body also needs ways to control and remove clots.\n\nA useful repair depends on the right place and timing.","chapter":3,"fact":31,"image":"/assets/books/8b44c41ae763d2673780.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nhlbi.nih.gov/health/clotting-disorders/how-blood-clots"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NHLBI, NIH","title":"How Does Blood Clot?","url":"https://www.nhlbi.nih.gov/health/clotting-disorders/how-blood-clots"}]},{"number":55,"folio":"39","kind":"fact","title":"Blood type is about recognition.","text":"ABO and Rh blood groups describe important markers on red blood cells.\n\nAn incompatible transfusion can trigger a dangerous immune reaction. Matching involves more than casually knowing one letter, and clinical testing remains essential.\n\nBlood compatibility is a medical check, not a guess.","chapter":3,"fact":32,"image":"/assets/books/46a38ddc68726995bc36.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.redcrossblood.org/donate-blood/blood-types.html"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"American Red Cross","title":"Blood Types","url":"https://www.redcrossblood.org/donate-blood/blood-types.html"}]},{"number":56,"folio":"40","kind":"fact","title":"Blood pressure contains two different moments.","text":"The upper number describes pressure when the heart contracts; the lower number describes pressure between beats.\n\nThese are systolic and diastolic pressure. Readings vary with conditions and technique, so diagnosis usually needs properly taken, repeated measurements.\n\nA reading describes force in the arteries, not how stressed you feel.","chapter":3,"fact":33,"image":"/assets/books/bb748645442a2a9d6ddb.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nhlbi.nih.gov/health/high-blood-pressure/diagnosis"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NHLBI, NIH","title":"High Blood Pressure: Diagnosis","url":"https://www.nhlbi.nih.gov/health/high-blood-pressure/diagnosis"}]},{"number":57,"folio":"41","kind":"chapter","title":"Every breath","text":"The invisible exchange keeping you here.","chapter":4,"fact":0,"image":"/assets/books/3cbbe1187573d038aa9f.webp","links":[]},{"number":58,"folio":"42","kind":"fact","title":"Breathing starts by changing space.","text":"When your diaphragm contracts, it moves down and helps enlarge the chest cavity.\n\nPressure inside the lungs falls, drawing air in. At quiet rest, breathing out is mostly driven by relaxation and elastic recoil.\n\nAir follows a pressure difference.","chapter":4,"fact":34,"image":"/assets/books/edb17f1afd89423237e1.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nhlbi.nih.gov/health/lungs/respiratory-system"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NHLBI, NIH","title":"How the Lungs Work: The Respiratory System","url":"https://www.nhlbi.nih.gov/health/lungs/respiratory-system"}]},{"number":59,"folio":"43","kind":"fact","title":"Your lungs trade gases across thin walls.","text":"Tiny air sacs called alveoli sit beside networks of capillaries.\n\nOxygen moves into the blood and carbon dioxide moves into the air sacs, down their respective concentration-related pressure gradients. The thin interface makes this exchange possible.\n\nThe important meeting is between air and blood.","chapter":4,"fact":35,"image":"/assets/books/64025d4ad785fb92164d.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nhlbi.nih.gov/health/lungs/breathing-benefits"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NHLBI, NIH","title":"What Breathing Does for the Body","url":"https://www.nhlbi.nih.gov/health/lungs/breathing-benefits"}]},{"number":60,"folio":"44","kind":"fact","title":"Breathing clears a waste gas, too.","text":"Your cells produce carbon dioxide as they use energy from nutrients.\n\nThe brain and other sensors monitor carbon dioxide, acidity and oxygen-related signals to help regulate breathing. Breathing is about removing carbon dioxide as well as bringing in oxygen.\n\nThe outward breath is part of the same essential exchange.","chapter":4,"fact":36,"image":"/assets/books/c52df4682766c3b1f33f.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nhlbi.nih.gov/health/lungs/body-controls-breathing"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NHLBI, NIH","title":"How Your Body Controls Breathing","url":"https://www.nhlbi.nih.gov/health/lungs/body-controls-breathing"}]},{"number":61,"folio":"45","kind":"fact","title":"Your nose prepares incoming air.","text":"The nasal passages help warm, moisten and filter air before it travels deeper.\n\nMucus and tiny hairs help trap particles. This preparation supports the respiratory tract, though it cannot remove every pollutant or germ.\n\nThe entrance to your airway also does useful work.","chapter":4,"fact":37,"image":"/assets/books/99caab3a8b81268c9ae9.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nhlbi.nih.gov/health/lungs/respiratory-system"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NHLBI, NIH","title":"How the Lungs Work: The Respiratory System","url":"https://www.nhlbi.nih.gov/health/lungs/respiratory-system"}]},{"number":62,"folio":"46","kind":"fact","title":"Your airways have a moving clean-up layer.","text":"Mucus traps particles, while tiny cilia help move it toward the throat.\n\nThis clearance system helps protect the lungs. Tobacco smoke can damage airway defences and contribute to lung disease.\n\nSome of your cleaning equipment is microscopic and constantly moving.","chapter":4,"fact":38,"image":"/assets/books/32a5ac507aa268854faf.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nhlbi.nih.gov/health/lungs/respiratory-system"},{"x":0.20833333333333334,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nhlbi.nih.gov/health/lungs/lung-health"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NHLBI, NIH","title":"How the Lungs Work: The Respiratory System","url":"https://www.nhlbi.nih.gov/health/lungs/respiratory-system"},{"name":"NHLBI, NIH","title":"How to Keep Your Lungs Healthy","url":"https://www.nhlbi.nih.gov/health/lungs/lung-health"}]},{"number":63,"folio":"47","kind":"fact","title":"Your voice is shaped breath.","text":"Air from the lungs passes through the voice box, where the vocal folds can vibrate.\n\nThe throat, mouth, nose and tongue help shape that sound into speech. Strain, illness and irritation can affect this delicate system.\n\nSpeaking is a collaboration between airflow and moving tissue.","chapter":4,"fact":39,"image":"/assets/books/7cca60a16f608e555eb7.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nidcd.nih.gov/health/taking-care-your-voice"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIDCD, NIH","title":"Taking Care of Your Voice","url":"https://www.nidcd.nih.gov/health/taking-care-your-voice"}]},{"number":64,"folio":"48","kind":"fact","title":"Movement makes your breathing work harder.","text":"Active muscles need more oxygen and produce more carbon dioxide, so breathing and circulation increase.\n\nRegular physical activity helps the heart and lungs work more efficiently. Fitness develops through repeated activity rather than a single deep breath.\n\nThe lungs work as part of a larger delivery system.","chapter":4,"fact":40,"image":"/assets/books/0135fc14e8ed112263d5.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nhlbi.nih.gov/health/lungs/lung-health"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NHLBI, NIH","title":"How to Keep Your Lungs Healthy","url":"https://www.nhlbi.nih.gov/health/lungs/lung-health"}]},{"number":65,"folio":"49","kind":"chapter","title":"The journey of food","text":"From the first bite to the last useful molecule.","chapter":5,"fact":0,"image":"/assets/books/5ea15d41a327cc17f921.webp","links":[]},{"number":66,"folio":"50","kind":"fact","title":"Digestion begins before food reaches your stomach.","text":"Chewing breaks food apart, and saliva moistens it and starts chemical digestion.\n\nSaliva also supports swallowing and helps protect the mouth. It is an active fluid rather than simply water that happens to be there.\n\nThe first digestive juice is already in your mouth.","chapter":5,"fact":41,"image":"/assets/books/cb5313103a3c9dc98fd7.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nidcr.nih.gov/health-info/saliva-salivary-gland-disorders"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIDCR, NIH","title":"Saliva and Salivary Gland Disorders","url":"https://www.nidcr.nih.gov/health-info/saliva-salivary-gland-disorders"}]},{"number":67,"folio":"51","kind":"fact","title":"Food does not simply fall through you.","text":"Waves of muscle activity move and mix material along the digestive tract.\n\nThis process, called peristalsis, helps transport food through the oesophagus and intestines. Gravity can help, but coordinated muscle movement does the organised work.\n\nYour digestive tract is an active tube.","chapter":5,"fact":42,"image":"/assets/books/ee9bd8cc5b6b757620bf.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.niddk.nih.gov/health-information/digestive-diseases/digestive-system-how-it-works"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIDDK, NIH","title":"Your Digestive System and How It Works","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/digestive-system-how-it-works"}]},{"number":68,"folio":"52","kind":"fact","title":"Your stomach needs protection from its own acid.","text":"A protective lining normally helps shield stomach tissue from acid and digestive activity.\n\nHelicobacter pylori infection and certain pain medicines can damage defences and contribute to peptic ulcers. An ulcer is not simply the result of \"too much worry.\"\n\nA strong digestive environment needs a protected boundary.","chapter":5,"fact":43,"image":"/assets/books/922fba237118e3fc6915.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.niddk.nih.gov/health-information/digestive-diseases/peptic-ulcers-stomach-ulcers/symptoms-causes"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIDDK, NIH","title":"Peptic Ulcers: Symptoms and Causes","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/peptic-ulcers-stomach-ulcers/symptoms-causes"}]},{"number":69,"folio":"53","kind":"fact","title":"Most nutrient absorption happens in the small intestine.","text":"After food is broken into smaller molecules, the intestinal lining transfers nutrients into circulation.\n\nIts folded surface and specialised cells support absorption. The stomach helps prepare a meal; the small intestine does much of the collecting.\n\nEating a nutrient and absorbing it are different steps.","chapter":5,"fact":44,"image":"/assets/books/2bb87d5f052c30046ebd.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.niddk.nih.gov/health-information/digestive-diseases/digestive-system-how-it-works"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIDDK, NIH","title":"Your Digestive System and How It Works","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/digestive-system-how-it-works"}]},{"number":70,"folio":"54","kind":"fact","title":"The pancreas supplies a digestive toolkit.","text":"The pancreas sends enzymes into the small intestine to help break down fats, proteins and carbohydrates.\n\nThis is separate from its hormone-producing role. If too few digestive enzymes reach the intestine, the body may struggle to digest and absorb nutrients.\n\nOne organ can have two very different kinds of output.","chapter":5,"fact":45,"image":"/assets/books/8c91a4fb3f1290b46d61.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.niddk.nih.gov/health-information/digestive-diseases/exocrine-pancreatic-insufficiency/definition-facts"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIDDK, NIH","title":"Exocrine Pancreatic Insufficiency: Definition and Facts","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/exocrine-pancreatic-insufficiency/definition-facts"}]},{"number":71,"folio":"55","kind":"fact","title":"Your liver makes bile; the gallbladder stores it.","text":"Bile helps the digestive process handle fats and absorb some vitamins.\n\nThe gallbladder releases stored bile into the small intestine. The liver also processes and stores absorbed nutrients, helping manage what becomes available to the rest of the body.\n\nThe factory and the storage pouch have different jobs.","chapter":5,"fact":46,"image":"/assets/books/5c3f142bb2261fe7d6b4.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.niddk.nih.gov/health-information/digestive-diseases/digestive-system-how-it-works"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIDDK, NIH","title":"Your Digestive System and How It Works","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/digestive-system-how-it-works"}]},{"number":72,"folio":"56","kind":"fact","title":"Some fibre feeds the microbes in your gut.","text":"Humans do not digest dietary fibre in the same way as starch or sugar.\n\nSome fibre is fermented by gut microbes; other forms add bulk or help with stool consistency. Different fibres have different effects, which is one reason food variety matters.\n\nA meal can nourish both you and your resident microbes.","chapter":5,"fact":47,"image":"/assets/books/7efd0f17c0e4a54dfc1e.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://newsinhealth.nih.gov/2010/08/rough-up-your-diet"},{"x":0.20833333333333334,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.niddk.nih.gov/health-information/digestive-diseases/gas-digestive-tract/symptoms-causes"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIH News in Health","title":"Rough Up Your Diet","url":"https://newsinhealth.nih.gov/2010/08/rough-up-your-diet"},{"name":"NIDDK, NIH","title":"Gas in the Digestive Tract: Symptoms and Causes","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/gas-digestive-tract/symptoms-causes"}]},{"number":73,"folio":"57","kind":"fact","title":"Your gut and brain communicate in both directions.","text":"Nerves, hormones and other signals link digestion with the nervous system.\n\nThis helps explain why stress can change bowel symptoms and why digestive discomfort can affect how you feel. These symptoms are physical, even when stress is involved.\n\nA brain-gut interaction does not mean \"imaginary.\"","chapter":5,"fact":48,"image":"/assets/books/2ea61da88a7b249ba2b3.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.niddk.nih.gov/health-information/digestive-diseases/irritable-bowel-syndrome/symptoms-causes"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIDDK, NIH","title":"Irritable Bowel Syndrome: Symptoms and Causes","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/irritable-bowel-syndrome/symptoms-causes"}]},{"number":74,"folio":"58","kind":"fact","title":"Tooth decay is a process, not a sudden hole.","text":"Mouth bacteria can turn sugars into acids that remove minerals from enamel.\n\nSaliva and fluoride help the enamel regain minerals in early stages. Repeated acid attacks can eventually create a cavity that needs treatment.\n\nA cavity has a history before it becomes visible.","chapter":5,"fact":49,"image":"/assets/books/9e95ca45193801491c48.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nidcr.nih.gov/health-info/tooth-decay/more-info/tooth-decay-process"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIDCR, NIH","title":"The Tooth Decay Process","url":"https://www.nidcr.nih.gov/health-info/tooth-decay/more-info/tooth-decay-process"}]},{"number":75,"folio":"59","kind":"chapter","title":"Water & balance","text":"Small adjustments. Enormous consequences.","chapter":6,"fact":0,"image":"/assets/books/e0c92d937df31af55f92.webp","links":[]},{"number":76,"folio":"60","kind":"fact","title":"Your kidneys filter, then make choices.","text":"Each kidney contains many filtering units called nephrons.\n\nBlood is filtered at the glomerulus. Tubules then return needed water and substances to the blood while helping remove wastes. Urine is the result of this processing.\n\nA kidney is more selective than a kitchen sieve.","chapter":6,"fact":50,"image":"/assets/books/9e2fd4c951d03d5615d0.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.niddk.nih.gov/health-information/kidney-disease/kidneys-how-they-work"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIDDK, NIH","title":"Your Kidneys and How They Work","url":"https://www.niddk.nih.gov/health-information/kidney-disease/kidneys-how-they-work"}]},{"number":77,"folio":"61","kind":"fact","title":"Water and salts are managed together.","text":"The kidneys adjust how much water and how many dissolved substances leave in urine.\n\nThis helps keep blood chemistry and fluid volume within useful ranges. The right balance changes with heat, activity, illness and other conditions.\n\nWater balance is also chemistry balance.","chapter":6,"fact":51,"image":"/assets/books/4fd49f3019260eb4f47e.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.niddk.nih.gov/health-information/kidney-disease/kidneys-how-they-work"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIDDK, NIH","title":"Your Kidneys and How They Work","url":"https://www.niddk.nih.gov/health-information/kidney-disease/kidneys-how-they-work"}]},{"number":78,"folio":"62","kind":"fact","title":"Kidneys also send important chemical messages.","text":"They help regulate blood pressure, support red-blood-cell production and activate vitamin D.\n\nThese jobs connect kidney health with circulation, blood and bones. Their role reaches well beyond making urine.\n\nA filtering organ is also a signalling organ.","chapter":6,"fact":52,"image":"/assets/books/06095a4c958bccb4fd5f.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.niddk.nih.gov/health-information/kidney-disease/kidneys-how-they-work"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIDDK, NIH","title":"Your Kidneys and How They Work","url":"https://www.niddk.nih.gov/health-information/kidney-disease/kidneys-how-they-work"}]},{"number":79,"folio":"63","kind":"fact","title":"Your bladder stores urine, not your kidneys.","text":"Urine travels from the kidneys down the ureters into the bladder.\n\nDuring urination it leaves through the urethra. Muscles, nerves and the brain coordinate storage and emptying; ureters and urethra are different structures.\n\nTwo similar-sounding words describe different parts of the route.","chapter":6,"fact":53,"image":"/assets/books/33963f48ef0c0ad70f6f.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.niddk.nih.gov/health-information/urologic-diseases/urinary-tract-how-it-works"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIDDK, NIH","title":"The Urinary Tract and How It Works","url":"https://www.niddk.nih.gov/health-information/urologic-diseases/urinary-tract-how-it-works"}]},{"number":80,"folio":"64","kind":"fact","title":"There is no perfect water quota for everyone.","text":"Fluid needs change with age, activity, temperature, pregnancy, illness and what you eat.\n\nDrinks and water in food both contribute. For many people, pale-yellow urine is a useful rough clue, but medicines and other factors can alter colour. Some medical conditions require individual fluid advice.\n\nHydration is a changing need, not a universal bottle count.","chapter":6,"fact":54,"image":"/assets/books/0c5ab5b5706ed5d0c4bc.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nhs.uk/live-well/eat-well/food-guidelines-and-food-labels/water-drinks-nutrition/"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NHS","title":"Water, Drinks and Hydration","url":"https://www.nhs.uk/live-well/eat-well/food-guidelines-and-food-labels/water-drinks-nutrition/"}]},{"number":81,"folio":"65","kind":"fact","title":"Too much water can also cause harm.","text":"Drinking excessive water faster than it can be removed can dilute blood sodium.\n\nSodium helps regulate fluid balance and nerve function. Severe low sodium can be dangerous, which is why forcing very large amounts of water is not a reliable health habit.\n\nMore is not automatically better.","chapter":6,"fact":55,"image":"/assets/books/035d03e024e87483839f.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://medlineplus.gov/ency/article/000394.htm"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"MedlinePlus, NLM","title":"Low Blood Sodium","url":"https://medlineplus.gov/ency/article/000394.htm"}]},{"number":82,"folio":"66","kind":"fact","title":"Dehydration has clues you can notice.","text":"Thirst, darker urine, urinating less and dizziness can occur when you lose more fluid than you replace.\n\nSweating, vomiting and diarrhoea can increase losses. Symptoms and risk vary, and significant dehydration needs medical attention.\n\nWater loss changes how the whole body works.","chapter":6,"fact":56,"image":"/assets/books/ae96bedd5c6106b07322.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nhs.uk/conditions/dehydration/"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NHS","title":"Dehydration","url":"https://www.nhs.uk/conditions/dehydration/"}]},{"number":83,"folio":"67","kind":"chapter","title":"Built to move","text":"A living framework, not a fixed structure.","chapter":7,"fact":0,"image":"/assets/books/bc761bbe913bfe27a1d5.webp","links":[]},{"number":84,"folio":"68","kind":"fact","title":"Bone is living tissue.","text":"Specialised cells continually remove old bone and build new bone.\n\nThis remodelling helps maintain the skeleton and manage minerals. Bone has a blood supply and responds to hormones, nutrition and mechanical demands.\n\nYour framework is being maintained from within.","chapter":7,"fact":57,"image":"/assets/books/8d56c0ebc704472ad1e8.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.niams.nih.gov/health-topics/what-bone"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIAMS, NIH","title":"What Is Bone?","url":"https://www.niams.nih.gov/health-topics/what-bone"}]},{"number":85,"folio":"69","kind":"fact","title":"The adult skeleton usually has 206 bones.","text":"That is the standard anatomical count, not an identical total in every person.\n\nSome bones fuse during growth, and small additional bones can vary between people. The skeleton supports movement and protects important organs.\n\nAn anatomical number describes a typical pattern.","chapter":7,"fact":58,"image":"/assets/books/6b36ba30461d3710ae4e.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.niams.nih.gov/health-topics/educational-resources/health-lesson-learning-about-bones"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIAMS, NIH","title":"Health Lesson: Learning About Bones","url":"https://www.niams.nih.gov/health-topics/educational-resources/health-lesson-learning-about-bones"}]},{"number":86,"folio":"70","kind":"fact","title":"Many joints use a low-friction meeting surface.","text":"In a typical freely moving joint, cartilage covers the ends of bones and fluid helps them move smoothly.\n\nThe surrounding capsule, ligaments and muscles contribute to stability. Different types of joints allow different kinds of movement.\n\nMovement depends on the surfaces between bones, too.","chapter":7,"fact":59,"image":"/assets/books/ec1d2c9e0867516a90d9.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.niams.nih.gov/health-topics/educational-resources/health-lesson-learning-about-joints"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIAMS, NIH","title":"Health Lesson: Learning About Joints","url":"https://www.niams.nih.gov/health-topics/educational-resources/health-lesson-learning-about-joints"}]},{"number":87,"folio":"71","kind":"fact","title":"Tendons and ligaments do different jobs.","text":"Tendons connect muscle to bone; ligaments usually connect one bone to another.\n\nThese strong connective tissues help transmit force and stabilise joints. Their names are not interchangeable, even though both can be injured.\n\nOne transfers a muscle's pull; the other helps secure a joint.","chapter":7,"fact":60,"image":"/assets/books/7a0397395e28aba4350c.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.niams.nih.gov/health-topics/educational-resources/health-lesson-learning-about-joints"},{"x":0.20833333333333334,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.niams.nih.gov/health-topics/educational-resources/health-lesson-learning-about-muscles"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIAMS, NIH","title":"Health Lesson: Learning About Joints","url":"https://www.niams.nih.gov/health-topics/educational-resources/health-lesson-learning-about-joints"},{"name":"NIAMS, NIH","title":"Health Lesson: Learning About Muscles","url":"https://www.niams.nih.gov/health-topics/educational-resources/health-lesson-learning-about-muscles"}]},{"number":88,"folio":"72","kind":"fact","title":"Muscles create force by pulling.","text":"Within skeletal muscle, organised protein filaments interact to generate tension.\n\nThe muscle transfers force through its attachments and can move or stabilise a joint. A muscle can also work without visibly shortening, such as when you hold a position.\n\nVisible movement is only one kind of muscle work.","chapter":7,"fact":61,"image":"/assets/books/9cac8071f268a799e87a.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.niams.nih.gov/health-topics/educational-resources/health-lesson-learning-about-muscles"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIAMS, NIH","title":"Health Lesson: Learning About Muscles","url":"https://www.niams.nih.gov/health-topics/educational-resources/health-lesson-learning-about-muscles"}]},{"number":89,"folio":"73","kind":"fact","title":"Many movements need opposing muscle groups.","text":"To bend and straighten a joint, the nervous system coordinates muscles with different pulling directions.\n\nAt the elbow, the biceps helps bend the arm and the triceps helps straighten it. Their activity is coordinated rather than simply one being completely on and the other off.\n\nControl comes from teamwork, not strength alone.","chapter":7,"fact":62,"image":"/assets/books/b30d18ab43cfe5024b70.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.niams.nih.gov/health-topics/educational-resources/health-lesson-learning-about-muscles"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIAMS, NIH","title":"Health Lesson: Learning About Muscles","url":"https://www.niams.nih.gov/health-topics/educational-resources/health-lesson-learning-about-muscles"}]},{"number":90,"folio":"74","kind":"fact","title":"Bones respond to being used.","text":"Weight-bearing activity and resistance exercise help stimulate bone maintenance.\n\nThe benefit depends on the kind of activity, age and health. Nutrition and hormones matter too; exercise is one contributor rather than a guarantee against fractures.\n\nMechanical demand is information for living bone.","chapter":7,"fact":63,"image":"/assets/books/076053e022495b0ec451.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.niams.nih.gov/health-topics/exercise-your-bone-health"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIAMS, NIH","title":"Exercise for Your Bone Health","url":"https://www.niams.nih.gov/health-topics/exercise-your-bone-health"}]},{"number":91,"folio":"75","kind":"fact","title":"Next-day soreness is not trapped lactic acid.","text":"Unfamiliar exercise can lead to delayed muscle soreness that develops hours later.\n\nIt involves responses to exercise-related tissue stress, especially after certain lengthening contractions. Lactate does not remain trapped in muscles for days to explain this soreness.\n\nSoreness is not a reliable score for a good workout.","chapter":7,"fact":64,"image":"/assets/books/3e6a77bebde2fac85d3b.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.acsm.org/docs/default-source/files-for-resource-library/delayed-onset-muscle-soreness-%28doms%29.pdf"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"American College of Sports Medicine","title":"Delayed Onset Muscle Soreness","url":"https://www.acsm.org/docs/default-source/files-for-resource-library/delayed-onset-muscle-soreness-%28doms%29.pdf"}]},{"number":92,"folio":"76","kind":"quote","title":"Your framework is living, responsive and in motion.","text":"","chapter":7,"fact":0,"image":"/assets/books/6cf548ee60a039b6d4e4.webp","links":[]},{"number":93,"folio":"77","kind":"chapter","title":"Skin & defence","text":"Boundaries, recognition and repair.","chapter":8,"fact":0,"image":"/assets/books/2ddd954a812d4882e17c.webp","links":[]},{"number":94,"folio":"78","kind":"fact","title":"Your skin is a working boundary.","text":"It helps limit water loss, blocks many outside threats and detects sensations.\n\nIts layers contain different cells and structures, including nerves, glands and immune cells. The surface you see is part of a much larger protective system.\n\nSkin is an organ doing several jobs at once.","chapter":8,"fact":65,"image":"/assets/books/d1f8a65ee6a111479543.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.niams.nih.gov/health-topics/educational-resources/health-lesson-learning-about-skin"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIAMS, NIH","title":"Health Lesson: Learning About Skin","url":"https://www.niams.nih.gov/health-topics/educational-resources/health-lesson-learning-about-skin"}]},{"number":95,"folio":"79","kind":"fact","title":"Melanin offers protection, but not complete protection.","text":"This pigment contributes to skin colour and helps protect cells from ultraviolet radiation.\n\nEvery skin tone can be damaged by UV exposure. Skin colour changes the degree of natural protection; it does not remove the need to protect skin.\n\nA tan is not a shield against all sun damage.","chapter":8,"fact":66,"image":"/assets/books/b9c63f49ee70087f7e1a.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.niams.nih.gov/health-topics/educational-resources/health-lesson-learning-about-skin"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIAMS, NIH","title":"Health Lesson: Learning About Skin","url":"https://www.niams.nih.gov/health-topics/educational-resources/health-lesson-learning-about-skin"}]},{"number":96,"folio":"80","kind":"fact","title":"Sweat cools you when it evaporates.","text":"Evaporation carries heat away from the skin.\n\nHigh humidity can make this cooling less effective because sweat evaporates less readily. Heavy sweating does not, by itself, prove that a workout is better or that fat is melting away.\n\nThe cooling happens as liquid becomes vapour.","chapter":8,"fact":67,"image":"/assets/books/606d6bdad83da5ea728b.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://medlineplus.gov/ency/anatomyvideos/000127.htm"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"MedlinePlus, NLM","title":"Sweating","url":"https://medlineplus.gov/ency/anatomyvideos/000127.htm"}]},{"number":97,"folio":"81","kind":"fact","title":"You have a second fluid-return network.","text":"Lymphatic vessels collect excess fluid from tissues and help return it to the bloodstream.\n\nLymph nodes contain immune cells that examine material travelling through this network. Lymph vessels also help transport absorbed fats from the intestine.\n\nThe lymphatic system supports both fluid balance and defence.","chapter":8,"fact":68,"image":"/assets/books/34f60c0784b446d891c3.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://training.seer.cancer.gov/anatomy/lymphatic/"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"SEER Training, National Cancer Institute","title":"Introduction to the Lymphatic System","url":"https://training.seer.cancer.gov/anatomy/lymphatic/"}]},{"number":98,"folio":"82","kind":"fact","title":"Your immune system has immediate and learned defences.","text":"Innate responses act rapidly; adaptive responses recognise specific targets and can form memory.\n\nThese systems work together. A healthy response needs regulation as well as strength, because uncontrolled immune activity can damage your own tissues.\n\nGood defence depends on a suitable response, not endless activation.","chapter":8,"fact":69,"image":"/assets/books/bf981b2d5ca34e0cd626.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://pubweb-prod.niaid.nih.gov/research/immune-system-overview"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIAID, NIH","title":"Overview of the Immune System","url":"https://pubweb-prod.niaid.nih.gov/research/immune-system-overview"}]},{"number":99,"folio":"83","kind":"fact","title":"Vaccines prepare immune memory.","text":"Vaccination exposes the immune system to a safe form, part or set of instructions related to a pathogen.\n\nThis can help it respond more effectively during a later encounter. Protection and the need for further doses vary by vaccine and infection.\n\nPreparation can happen before the real exposure.","chapter":8,"fact":70,"image":"/assets/books/ec8b2d984b92baee0f67.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.cdc.gov/vaccines/basics/explaining-how-vaccines-work.html"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"CDC","title":"Explaining How Vaccines Work","url":"https://www.cdc.gov/vaccines/basics/explaining-how-vaccines-work.html"}]},{"number":100,"folio":"84","kind":"fact","title":"An allergy is a misdirected immune response.","text":"The immune system reacts to a substance that is harmless to most people.\n\nFood allergy differs from food intolerance, which does not necessarily involve the same immune mechanism. Allergic reactions can vary from mild symptoms to life-threatening anaphylaxis.\n\nA powerful defence can sometimes identify the wrong target.","chapter":8,"fact":71,"image":"/assets/books/5a85e7aae3ffe97c4b63.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.niaid.nih.gov/sites/default/files/faguidelinespatient.pdf"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIAID, NIH","title":"Guidelines for the Diagnosis and Management of Food Allergy: Summary for Patients","url":"https://www.niaid.nih.gov/sites/default/files/faguidelinespatient.pdf"}]},{"number":101,"folio":"85","kind":"fact","title":"Antibiotics do not treat viral infections.","text":"They act against bacteria, not the viruses responsible for colds and flu.\n\nUnnecessary antibiotic use can cause side effects and helps drive antibiotic resistance. A bacterial complication is a separate reason a clinician might prescribe one.\n\nThe cause of an illness matters to the treatment.","chapter":8,"fact":72,"image":"/assets/books/a17b737773451d6e4bbc.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.cdc.gov/antibiotic-use/communication-resources/wrong-tool-for-virus.html"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"CDC","title":"Antibiotics Do Not Treat Viruses","url":"https://www.cdc.gov/antibiotic-use/communication-resources/wrong-tool-for-virus.html"}]},{"number":102,"folio":"86","kind":"quote","title":"Good protection depends on boundaries and recognition.","text":"","chapter":8,"fact":0,"image":"/assets/books/00c4f590dda2f677e54b.webp","links":[]},{"number":103,"folio":"87","kind":"chapter","title":"Hormones & new life","text":"Tiny messages that shape a lifetime.","chapter":9,"fact":0,"image":"/assets/books/5af3d0f44993940f1049.webp","links":[]},{"number":104,"folio":"88","kind":"fact","title":"Hormones are messages with specific receivers.","text":"They travel through the bloodstream and act on cells with suitable receptors.\n\nThey help regulate growth, metabolism, reproduction and many other processes. The effect depends on the hormone, its concentration and the receiving tissue.\n\nA circulating message does not make every cell respond alike.","chapter":9,"fact":73,"image":"/assets/books/eea9e6b7788110b066c7.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://medlineplus.gov/hormones.html"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"MedlinePlus, NLM","title":"Hormones","url":"https://medlineplus.gov/hormones.html"}]},{"number":105,"folio":"89","kind":"fact","title":"Insulin helps manage blood glucose.","text":"Made in the pancreas, insulin helps glucose move from the blood into many cells for use or storage.\n\nDiabetes develops when the body does not make enough insulin or cannot use it properly. Different types of diabetes have different causes.\n\nBlood sugar regulation involves both a signal and a response.","chapter":9,"fact":74,"image":"/assets/books/f1b92e61231288d5e84a.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.niddk.nih.gov/health-information/diabetes/overview/what-is-diabetes"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIDDK, NIH","title":"What Is Diabetes?","url":"https://www.niddk.nih.gov/health-information/diabetes/overview/what-is-diabetes"}]},{"number":106,"folio":"90","kind":"fact","title":"The thyroid influences the pace of body processes.","text":"Thyroid hormones affect how the body uses energy and influence many organs.\n\nToo little or too much can affect heart rate, temperature tolerance and other functions. Symptoms overlap with many conditions, so a symptom alone cannot diagnose a thyroid disorder.\n\nA small gland can have effects throughout the body.","chapter":9,"fact":75,"image":"/assets/books/23c3341c6886ae4ad4dd.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.niddk.nih.gov/health-information/endocrine-diseases/hypothyroidism"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIDDK, NIH","title":"Hypothyroidism","url":"https://www.niddk.nih.gov/health-information/endocrine-diseases/hypothyroidism"}]},{"number":107,"folio":"91","kind":"fact","title":"Puberty begins with a signalling conversation.",
