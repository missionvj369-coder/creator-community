"text":"Signals from the brain and pituitary stimulate the ovaries or testes to make more reproductive hormones.\n\nThese changes contribute to sexual maturation, growth and other physical changes. Timing and pace differ between people.\n\nDevelopment follows a process, not a race.","chapter":9,"fact":76,"image":"/assets/books/54528b3e74e54899930c.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nichd.nih.gov/health/topics/puberty/conditioninfo/causes"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NICHD, NIH","title":"What Causes Normal Puberty?","url":"https://www.nichd.nih.gov/health/topics/puberty/conditioninfo/causes"}]},{"number":108,"folio":"92","kind":"fact","title":"A menstrual period is the shedding of a lining.","text":"Hormones help the uterus build a lining in preparation for a possible pregnancy.\n\nIf pregnancy does not occur, hormone changes lead to shedding through the vagina. The cycle is counted from the first day of one period to the first day of the next.\n\nThe bleeding is one part of a larger cycle.","chapter":9,"fact":77,"image":"/assets/books/e796fee47d6854579d77.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://womenshealth.gov/menstrual-cycle/your-menstrual-cycle"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"Office on Women's Health","title":"Your Menstrual Cycle","url":"https://womenshealth.gov/menstrual-cycle/your-menstrual-cycle"}]},{"number":109,"folio":"93","kind":"fact","title":"Ovulation does not always happen on day 14.","text":"Ovulation is the release of an egg from an ovary.\n\nCycle length and ovulation timing vary, including within the same person. A calendar estimate alone cannot reliably identify every fertile day or rule out pregnancy.\n\nA textbook day is not a universal biological appointment.","chapter":9,"fact":78,"image":"/assets/books/c2f28226251ad0092309.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://womenshealth.gov/menstrual-cycle/your-menstrual-cycle"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"Office on Women's Health","title":"Your Menstrual Cycle","url":"https://womenshealth.gov/menstrual-cycle/your-menstrual-cycle"}]},{"number":110,"folio":"94","kind":"fact","title":"An egg and a sperm each usually bring 23 chromosomes.","text":"Fertilisation combines their genetic material to begin a new developmental process.\n\nSperm are produced in the testes after puberty. Reproduction depends on multiple steps, including gamete production, transport and, for pregnancy, successful implantation.\n\nOne meeting is the beginning of a complex sequence.","chapter":9,"fact":79,"image":"/assets/books/462ff05d85f4428b2d8b.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nichd.nih.gov/health/topics/factsheets/infertility"},{"x":0.20833333333333334,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.genome.gov/about-genomics/fact-sheets/Chromosomes-Fact-Sheet"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NICHD, NIH","title":"Infertility: Condition Information","url":"https://www.nichd.nih.gov/health/topics/factsheets/infertility"},{"name":"NHGRI, NIH","title":"Chromosomes Fact Sheet","url":"https://www.genome.gov/about-genomics/fact-sheets/Chromosomes-Fact-Sheet"}]},{"number":111,"folio":"95","kind":"fact","title":"The placenta is a temporary, essential organ.","text":"During pregnancy, it supports exchange of oxygen, nutrients and wastes between the pregnant person's circulation and the developing baby's circulation.\n\nThese circulations normally remain distinct. The placenta also makes hormones and is not a perfect barrier against medicines, infections or harmful exposures.\n\nA temporary organ can sustain an entire new life.","chapter":9,"fact":80,"image":"/assets/books/08b666afd447c52161a5.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nichd.nih.gov/health/topics/pregnancy/conditioninfo"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NICHD, NIH","title":"About Pregnancy","url":"https://www.nichd.nih.gov/health/topics/pregnancy/conditioninfo"}]},{"number":112,"folio":"96","kind":"fact","title":"Menopause is a transition in reproductive function.","text":"Natural menopause is recognised after 12 consecutive months without a period when there is no other cause.\n\nThe years around it can involve changing hormone levels, irregular cycles and symptoms such as hot flushes. Experiences differ, and symptoms can be treated.\n\nA normal life transition still deserves individual care.","chapter":9,"fact":81,"image":"/assets/books/c169f53e4fb2494210b9.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://womenshealth.gov/menopause/menopause-basics"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"Office on Women's Health","title":"Menopause Basics","url":"https://womenshealth.gov/menopause/menopause-basics"}]},{"number":113,"folio":"97","kind":"chapter","title":"The sleeping body","text":"The night shift is essential.","chapter":10,"fact":0,"image":"/assets/books/64d886654ef0297221a5.webp","links":[]},{"number":114,"folio":"98","kind":"fact","title":"Sleep is a changing pattern of brain states.","text":"During a typical night, you cycle through non-REM and REM sleep.\n\nDeep non-REM sleep and REM sleep have different features, and their proportions change across the night and across life. Sleep is not simply the brain being switched off.\n\nYour sleeping brain follows an organised night shift.","chapter":10,"fact":82,"image":"/assets/books/a3cfe4a7219d647a12c6.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.ninds.nih.gov/health-information/public-education/brain-basics/brain-basics-understanding-sleep"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NINDS, NIH","title":"Brain Basics: Understanding Sleep","url":"https://www.ninds.nih.gov/health-information/public-education/brain-basics/brain-basics-understanding-sleep"}]},{"number":115,"folio":"99","kind":"fact","title":"Sleep helps learning become more lasting.","text":"Sleep supports processes involved in stabilising memories and learning.\n\nBoth non-REM and REM sleep appear to contribute. Staying awake longer to practise or study can come at the cost of the sleep that supports what you learned.\n\nLearning continues after the book closes.","chapter":10,"fact":83,"image":"/assets/books/c452f6d422c77573d852.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.ninds.nih.gov/health-information/public-education/brain-basics/brain-basics-understanding-sleep"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NINDS, NIH","title":"Brain Basics: Understanding Sleep","url":"https://www.ninds.nih.gov/health-information/public-education/brain-basics/brain-basics-understanding-sleep"}]},{"number":116,"folio":"100","kind":"fact","title":"Light helps set your internal clock.","text":"A daily timing system helps organise sleepiness, alertness and hormone rhythms.\n\nLight reaching the eyes is a major cue for this clock. The timing of light matters, so bright light late in the evening can shift sleep timing.\n\nThe body reads light as information about time.","chapter":10,"fact":84,"image":"/assets/books/9379f85ea7643eb36bf5.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nhlbi.nih.gov/health/sleep/sleep-wake-cycle"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NHLBI, NIH","title":"Your Sleep/Wake Cycle","url":"https://www.nhlbi.nih.gov/health/sleep/sleep-wake-cycle"}]},{"number":117,"folio":"101","kind":"fact","title":"Sleep needs change with age.","text":"Most adults are advised to get 7 to 9 hours a night; teenagers generally need 8 to 10.\n\nChildren usually need more. Individual needs and circumstances vary, and time in bed is not always the same as restorative sleep.\n\nThe right sleep target is not identical at every age.","chapter":10,"fact":85,"image":"/assets/books/c9ff0ad7d7d63c1a4c56.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nhlbi.nih.gov/health/sleep/how-much-sleep"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NHLBI, NIH","title":"How Much Sleep Is Enough?","url":"https://www.nhlbi.nih.gov/health/sleep/how-much-sleep"}]},{"number":118,"folio":"102","kind":"fact","title":"Caffeine changes the feeling of sleep pressure.","text":"Adenosine builds up during waking hours and contributes to sleepiness; caffeine interferes with its signalling.\n\nCaffeine can make you feel more alert without removing the need for sleep. Its effects can last for hours and vary between people.\n\nFeeling less sleepy is different from being fully rested.","chapter":10,"fact":86,"image":"/assets/books/e538cea1ceacc65b0d32.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nhlbi.nih.gov/health/sleep/sleep-wake-cycle"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NHLBI, NIH","title":"Your Sleep/Wake Cycle","url":"https://www.nhlbi.nih.gov/health/sleep/sleep-wake-cycle"}]},{"number":119,"folio":"103","kind":"fact","title":"Alcohol can make sleep less restorative.","text":"It may make falling asleep feel easier while disturbing sleep later in the night.\n\nIt can also worsen breathing problems during sleep. Sedation and healthy sleep are not interchangeable.\n\nFalling asleep quickly is only one part of a good night.","chapter":10,"fact":87,"image":"/assets/books/181107b575a7f4bdfeff.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.niaaa.nih.gov/publications/brochures-and-fact-sheets/hangovers"},{"x":0.20833333333333334,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nhlbi.nih.gov/health/sleep-apnea"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIAAA, NIH","title":"Hangovers: Disrupted Sleep","url":"https://www.niaaa.nih.gov/publications/brochures-and-fact-sheets/hangovers"},{"name":"NHLBI, NIH","title":"Sleep Apnea","url":"https://www.nhlbi.nih.gov/health/sleep-apnea"}]},{"number":120,"folio":"104","kind":"fact","title":"Breathing pauses during sleep deserve attention.","text":"Sleep apnoea involves repeated interruptions of breathing while asleep.\n\nLoud snoring, observed pauses and daytime sleepiness can be clues, though not every snorer has apnoea. Assessment matters because repeated interruptions can affect health and alertness.\n\nA person may sleep for hours and still have disrupted sleep.","chapter":10,"fact":88,"image":"/assets/books/80f37a6f214c87c9d5ee.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nhlbi.nih.gov/health/sleep-apnea"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NHLBI, NIH","title":"Sleep Apnea","url":"https://www.nhlbi.nih.gov/health/sleep-apnea"}]},{"number":121,"folio":"105","kind":"fact","title":"Waking and muscle control can briefly get out of step.","text":"Sleep paralysis can happen while falling asleep or waking, when you feel awake but cannot move or speak.\n\nIt is linked to the muscle inhibition of REM sleep continuing into awareness. Episodes can feel frightening; recurring or distressing symptoms merit medical advice.\n\nA vivid experience can have an explanation in sleep physiology.","chapter":10,"fact":89,"image":"/assets/books/3df022b726f14cde7631.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nhs.uk/conditions/sleep-paralysis/"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NHS","title":"Sleep Paralysis","url":"https://www.nhs.uk/conditions/sleep-paralysis/"}]},{"number":122,"folio":"106","kind":"quote","title":"The night belongs to the body, too.","text":"","chapter":10,"fact":0,"image":"/assets/books/a5b99683c681b53daa95.webp","links":[]},{"number":123,"folio":"107","kind":"chapter","title":"A life in your body","text":"Knowledge becomes care.","chapter":11,"fact":0,"image":"/assets/books/dd3d6161dbdafa10f930.webp","links":[]},{"number":124,"folio":"108","kind":"fact","title":"Regular movement benefits far more than muscles.","text":"Physical activity supports cardiovascular health, mental health and many other aspects of well-being.\n\nFor most adults, WHO recommends 150 to 300 minutes of moderate activity a week, or an equivalent amount of vigorous activity. Some activity is better than none, with adaptations to ability and health.\n\nBenefits begin before you become an athlete.","chapter":11,"fact":90,"image":"/assets/books/433e46bd1aeeabbca5b2.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.who.int/news-room/fact-sheets/detail/physical-activity"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"World Health Organization","title":"Physical Activity","url":"https://www.who.int/news-room/fact-sheets/detail/physical-activity"}]},{"number":125,"folio":"109","kind":"fact","title":"Strength matters throughout adulthood.","text":"Muscle-strengthening activity supports physical function and complements aerobic movement.\n\nWHO recommends it on at least two days a week for adults, involving the major muscle groups. What is suitable depends on a person's abilities and health.\n\nA useful movement plan includes both endurance and strength.","chapter":11,"fact":91,"image":"/assets/books/248e750c34d2cf5a3b51.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.who.int/news-room/fact-sheets/detail/physical-activity"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"World Health Organization","title":"Physical Activity","url":"https://www.who.int/news-room/fact-sheets/detail/physical-activity"}]},{"number":126,"folio":"110","kind":"fact","title":"No single food can do the work of a varied diet.","text":"A healthy eating pattern supplies different nutrients from a range of foods.\n\nVegetables, fruits, pulses, whole grains and suitable protein sources can all contribute. The overall pattern matters more than declaring one ingredient a miracle or a villain.\n\nFood variety helps cover different biological needs.","chapter":11,"fact":92,"image":"/assets/books/e5387982892620713216.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.who.int/news-room/fact-sheets/detail/healthy-diet"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"World Health Organization","title":"Healthy Diet","url":"https://www.who.int/news-room/fact-sheets/detail/healthy-diet"}]},{"number":127,"folio":"111","kind":"fact","title":"You use energy even while resting.","text":"Maintaining cells, circulating blood, breathing and regulating temperature all require energy.\n\nBody size, composition, age, hormones and activity influence energy needs. Daily requirements are therefore not identical between people or constant throughout life.\n\nResting does not mean metabolically inactive.","chapter":11,"fact":93,"image":"/assets/books/9f76b41fdefdbdc8e32d.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.niddk.nih.gov/health-information/weight-management/adult-overweight-obesity/factors-affecting-weight-health"},{"x":0.20833333333333334,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.niddk.nih.gov/research-funding/at-niddk/labs-branches/diabetes-endocrinology-obesity-branch/metabolic-clinical-research-unit/metabolic-testing"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NIDDK, NIH","title":"Factors Affecting Weight and Health","url":"https://www.niddk.nih.gov/health-information/weight-management/adult-overweight-obesity/factors-affecting-weight-health"},{"name":"NIDDK, NIH","title":"Metabolic Testing","url":"https://www.niddk.nih.gov/research-funding/at-niddk/labs-branches/diabetes-endocrinology-obesity-branch/metabolic-clinical-research-unit/metabolic-testing"}]},{"number":128,"folio":"112","kind":"fact","title":"Fever is a regulated rise in temperature.","text":"During fever, the body's temperature-control system raises its target.\n\nThis differs from overheating caused by excessive heat or failed cooling. Infection is a common cause of fever, but the temperature alone cannot identify a specific infection or tell whether antibiotics are needed.\n\nA thermometer gives information, not the whole diagnosis.","chapter":11,"fact":94,"image":"/assets/books/eeca34a3744a18581c49.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://medlineplus.gov/ency/article/003090.htm"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"MedlinePlus, NLM","title":"Fever","url":"https://medlineplus.gov/ency/article/003090.htm"}]},{"number":129,"folio":"113","kind":"fact","title":"Feeling fine does not measure blood pressure.","text":"High blood pressure often causes no noticeable symptoms.\n\nOver time, it can damage blood vessels and organs. A properly taken measurement can reveal a problem that your day-to-day sensations do not detect.\n\nSome important body information has to be measured.","chapter":11,"fact":95,"image":"/assets/books/5f77ab17ea86b528c38a.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nhlbi.nih.gov/health/high-blood-pressure/symptoms"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NHLBI, NIH","title":"High Blood Pressure: Symptoms","url":"https://www.nhlbi.nih.gov/health/high-blood-pressure/symptoms"}]},{"number":130,"folio":"114","kind":"fact","title":"Ageing is not one identical process in everyone.","text":"Body composition commonly changes with age, including changes in muscle, fat and body water.\n\nThe pace and effects differ between people. Activity, nutrition, health conditions and other factors shape function, so chronological age does not describe every ability.\n\nA birthday is not a complete biological assessment.","chapter":11,"fact":96,"image":"/assets/books/835e5a6c103e01745a26.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://medlineplus.gov/ency/article/003998.htm"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"MedlinePlus, NLM","title":"Aging Changes in Body Shape","url":"https://medlineplus.gov/ency/article/003998.htm"}]},{"number":131,"folio":"115","kind":"fact","title":"Cancer begins in the body's own cells.","text":"Changes in genes that regulate growth and division can allow cells to grow out of control.\n\nSome cancer-related changes are inherited; many arise during life. Cancers differ greatly, and a cancer being \"genetic\" does not mean it was necessarily inherited.\n\nGenetic and inherited are not the same word.","chapter":11,"fact":97,"image":"/assets/books/1cc09bb8e815ec67bc26.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.cancer.gov/about-cancer/understanding/what-is-cancer"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"National Cancer Institute, NIH","title":"What Is Cancer?","url":"https://www.cancer.gov/about-cancer/understanding/what-is-cancer"}]},{"number":132,"folio":"116","kind":"fact","title":"Sudden neurological changes can be an emergency.","text":"A stroke can cause sudden facial drooping, arm weakness, speech trouble, vision changes or loss of balance.\n\nUrgent treatment can limit damage. Seek emergency help immediately, even if the symptoms fade; do not wait to see whether sleep or rest fixes them.\n\nSudden change is the signal to act quickly.","chapter":11,"fact":98,"image":"/assets/books/528ef5277335ee98318b.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.ninds.nih.gov/health-information/public-education/brain-basics/brain-basics-preventing-stroke"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NINDS, NIH","title":"Brain Basics: Preventing Stroke","url":"https://www.ninds.nih.gov/health-information/public-education/brain-basics/brain-basics-preventing-stroke"}]},{"number":133,"folio":"117","kind":"fact","title":"A heart attack does not always look dramatic.","text":"Symptoms may include chest pressure, breathlessness, sweating, nausea or pain in the arm, back, neck or jaw.\n\nThey can begin mildly and vary between people. Suspected heart-attack symptoms need emergency medical help; do not wait for severe pain or drive yourself.\n\nKnowing the quieter signs can change what happens next.","chapter":11,"fact":99,"image":"/assets/books/b36a9d3a852d6d6cf941.webp","links":[{"x":0.15625,"y":0.9138888888888889,"w":0.05416666666666667,"h":0.03194444444444444,"url":"https://www.nhlbi.nih.gov/health/heart-attack/symptoms"},{"x":0.75,"y":0.9138888888888889,"w":0.18333333333333332,"h":0.03194444444444444,"page":142}],"sources":[{"name":"NHLBI, NIH","title":"Heart Attack: Symptoms","url":"https://www.nhlbi.nih.gov/health/heart-attack/symptoms"}]},{"number":134,"folio":"118","kind":"quote","title":"Understanding can become a form of care.","text":"","chapter":11,"fact":0,"image":"/assets/books/7ded5e50e6ed567adf1b.webp","links":[]},{"number":135,"folio":"119","kind":"afterword","title":"The life beyond the page","text":"By the time you reach this page, you have met a few of the lives within your life: the cells that exchange, the vessels that deliver, the tissues that adapt, and the signals that keep the whole conversation going.\n\nNone of them has waited for you to learn its name. Your body was already doing this work when you first opened the cover. It will be doing it when you close the book and return to the room around you.\n\nKnowledge does not ask you to monitor every sensation. It can simply make the familiar more intelligible. A meal becomes a journey. A walk becomes coordination. A night of sleep becomes an active part of being awake again.","chapter":-1,"fact":0,"image":"/assets/books/e81e0d10f801641b188a.webp","links":[]},{"number":136,"folio":"120","kind":"afterword","title":"Keep looking closer","text":"There are still countless things to discover. Science continues because careful questions keep finding their way into places that once seemed settled.\n\nLet this book leave you with that kind of attention: clear enough to question a claim, gentle enough to recognise variation, and curious enough to look again.\n\nYou are not separate from the living world you have been reading about. You are one of its ongoing stories.","chapter":-1,"fact":0,"image":"/assets/books/ea7e4a2188bb577da5d2.webp","links":[]},{"number":137,"folio":"121","kind":"glossary","title":"A small language of the body","text":"Adenosine: A signalling molecule that contributes to the feeling of sleep pressure during waking hours.\n\nAdaptive immunity: Defence that recognises specific targets and can develop immunological memory.\n\nAlveoli: Tiny air sacs in the lungs where gases are exchanged with nearby blood vessels.\n\nAntibiotic: A medicine that acts against bacteria. Antibiotics do not treat viral infections.\n\nArtery: A blood vessel carrying blood away from the heart.\n\nATP: Adenosine triphosphate: an energy-carrying molecule continually used and replenished by cells.\n\nAutonomic nervous system: Nervous-system pathways that help regulate many functions without conscious instruction.\n\nBile: A digestive fluid made by the liver that helps the body handle fats.","chapter":-1,"fact":0,"image":"/assets/books/7072f762306d0249c8cf.webp","links":[{"x":0.075,"y":0.2569444444444444,"w":0.85,"h":0.08333333333333333,"page":117},{"x":0.075,"y":0.3388888888888889,"w":0.85,"h":0.08333333333333333,"page":97},{"x":0.075,"y":0.42083333333333334,"w":0.85,"h":0.08333333333333333,"page":58},{"x":0.075,"y":0.5027777777777778,"w":0.85,"h":0.08333333333333333,"page":100},{"x":0.075,"y":0.5847222222222223,"w":0.85,"h":0.08333333333333333,"page":49},{"x":0.075,"y":0.6666666666666666,"w":0.85,"h":0.08333333333333333,"page":22},{"x":0.075,"y":0.7486111111111111,"w":0.85,"h":0.08333333333333333,"page":33},{"x":0.075,"y":0.8305555555555556,"w":0.85,"h":0.08333333333333333,"page":70}]},{"number":138,"folio":"122","kind":"glossary","title":"A small language of the body","text":"Bladder: A muscular organ that stores urine before it leaves the body.\n\nBlood pressure: The force of blood against arterial walls, expressed as systolic and diastolic pressure.\n\nCapillary: A tiny blood vessel whose thin wall allows exchange with surrounding tissues.\n\nCartilage: A firm, flexible connective tissue that covers bone ends in many moving joints.\n\nCell: A basic unit of living tissue, with structures that support its specialised work.\n\nChromosome: An organised structure of DNA and associated proteins that carries genetic information.\n\nCilia: Tiny moving projections that help transport mucus along parts of the respiratory tract.\n\nCochlea: The spiral-shaped inner-ear structure involved in turning sound vibrations into nerve signals.","chapter":-1,"fact":0,"image":"/assets/books/9e70ed5662fafa3e9680.webp","links":[{"x":0.075,"y":0.2569444444444444,"w":0.85,"h":0.08333333333333333,"page":78},{"x":0.075,"y":0.3388888888888889,"w":0.85,"h":0.08333333333333333,"page":55},{"x":0.075,"y":0.42083333333333334,"w":0.85,"h":0.08333333333333333,"page":50},{"x":0.075,"y":0.5027777777777778,"w":0.85,"h":0.08333333333333333,"page":85},{"x":0.075,"y":0.5847222222222223,"w":0.85,"h":0.08333333333333333,"page":17},{"x":0.075,"y":0.6666666666666666,"w":0.85,"h":0.08333333333333333,"page":20},{"x":0.075,"y":0.7486111111111111,"w":0.85,"h":0.08333333333333333,"page":61},{"x":0.075,"y":0.8305555555555556,"w":0.85,"h":0.08333333333333333,"page":40}]},{"number":139,"folio":"123","kind":"glossary","title":"A small language of the body","text":"Diaphragm: A broad muscle below the lungs that helps change chest volume during breathing.\n\nDNA: Deoxyribonucleic acid: the molecule that stores genetic information used by cells.\n\nEnzyme: A biological catalyst that helps a chemical reaction occur; digestive enzymes help break down food.\n\nEpigenetics: The study of changes in gene activity associated with modifications that do not change the DNA sequence.\n\nFertilisation: The process in which an egg and a sperm combine their genetic contributions.\n\nFibre: Food components, mainly from plants, that human digestive enzymes do not fully break down.\n\nHaemoglobin: The iron-containing protein in red blood cells that carries oxygen.\n\nHomeostasis: The active regulation of internal conditions within ranges that support the body's work.","chapter":-1,"fact":0,"image":"/assets/books/bf171e1021a1bfddda32.webp","links":[{"x":0.075,"y":0.2569444444444444,"w":0.85,"h":0.08333333333333333,"page":57},{"x":0.075,"y":0.3388888888888889,"w":0.85,"h":0.08333333333333333,"page":19},{"x":0.075,"y":0.42083333333333334,"w":0.85,"h":0.08333333333333333,"page":69},{"x":0.075,"y":0.5027777777777778,"w":0.85,"h":0.08333333333333333,"page":21},{"x":0.075,"y":0.5847222222222223,"w":0.85,"h":0.08333333333333333,"page":109},{"x":0.075,"y":0.6666666666666666,"w":0.85,"h":0.08333333333333333,"page":71},{"x":0.075,"y":0.7486111111111111,"w":0.85,"h":0.08333333333333333,"page":51},{"x":0.075,"y":0.8305555555555556,"w":0.85,"h":0.08333333333333333,"page":24}]},{"number":140,"folio":"124","kind":"glossary","title":"A small language of the body","text":"Hormone: A chemical messenger that acts on cells with suitable receptors.\n\nInsulin: A pancreatic hormone that helps regulate blood glucose and its uptake by many cells.\n\nKidney: An organ that filters and processes blood, regulates fluid chemistry and performs important signalling jobs.\n\nLigament: A strong band of connective tissue that usually connects one bone to another.\n\nLymph: Fluid collected from tissues and transported through the lymphatic system.\n\nMelanin: A pigment that contributes to skin colour and provides some protection against ultraviolet radiation.\n\nMenopause: The end of menstrual cycling, recognised after 12 months without a period when no other cause explains it.\n\nMitochondrion: A cell structure involved in producing much of the usable energy required by many cellular processes.","chapter":-1,"fact":0,"image":"/assets/books/55bc2ec06fce77b7fc94.webp","links":[{"x":0.075,"y":0.2569444444444444,"w":0.85,"h":0.08333333333333333,"page":103},{"x":0.075,"y":0.3388888888888889,"w":0.85,"h":0.08333333333333333,"page":104},{"x":0.075,"y":0.42083333333333334,"w":0.85,"h":0.08333333333333333,"page":75},{"x":0.075,"y":0.5027777777777778,"w":0.85,"h":0.08333333333333333,"page":86},{"x":0.075,"y":0.5847222222222223,"w":0.85,"h":0.08333333333333333,"page":96},{"x":0.075,"y":0.6666666666666666,"w":0.85,"h":0.08333333333333333,"page":94},{"x":0.075,"y":0.7486111111111111,"w":0.85,"h":0.08333333333333333,"page":111},{"x":0.075,"y":0.8305555555555556,"w":0.85,"h":0.08333333333333333,"page":22}]},{"number":141,"folio":"125","kind":"glossary","title":"A small language of the body","text":"Myelin: An insulating material around many nerve fibres that helps signals travel efficiently.\n\nNephron: A kidney filtering unit made up of a filtering structure and a processing tubule.\n\nNeuron: A specialised cell that communicates through electrical signals and, at many connections, chemical messages.\n\nOvulation: The release of an egg from an ovary.\n\nPancreas: An organ with both digestive-enzyme-producing and hormone-producing functions.\n\nPeristalsis: Coordinated waves of muscle activity that move and mix material through the digestive tract.\n\nPlacenta: A temporary organ in pregnancy that supports exchange and produces important hormones.\n\nPlatelet: A small blood-cell fragment involved in forming the initial response to blood-vessel injury.","chapter":-1,"fact":0,"image":"/assets/books/10c7438b7d812cdef5c5.webp","links":[{"x":0.075,"y":0.2569444444444444,"w":0.85,"h":0.08333333333333333,"page":28},{"x":0.075,"y":0.3388888888888889,"w":0.85,"h":0.08333333333333333,"page":75},{"x":0.075,"y":0.42083333333333334,"w":0.85,"h":0.08333333333333333,"page":27},{"x":0.075,"y":0.5027777777777778,"w":0.85,"h":0.08333333333333333,"page":108},{"x":0.075,"y":0.5847222222222223,"w":0.85,"h":0.08333333333333333,"page":69},{"x":0.075,"y":0.6666666666666666,"w":0.85,"h":0.08333333333333333,"page":66},{"x":0.075,"y":0.7486111111111111,"w":0.85,"h":0.08333333333333333,"page":110},{"x":0.075,"y":0.8305555555555556,"w":0.85,"h":0.08333333333333333,"page":53}]},{"number":142,"folio":"126","kind":"glossary","title":"A small language of the body","text":"Pupil: The opening in the iris through which light enters the eye.\n\nREM sleep: Rapid-eye-movement sleep: one of the recurring sleep states, associated with characteristic brain and muscle activity.\n\nRetina: Light-sensitive tissue at the back of the eye that converts light into electrical signals.\n\nSynapse: A connection at which a neuron communicates with another cell.\n\nTendon: Connective tissue that transfers force between muscle and bone.\n\nThyroid: A gland whose hormones influence energy use and many other body functions.\n\nVaccine: A preparation that helps the immune system develop protection against a particular pathogen or disease.\n\nVein: A blood vessel carrying blood back toward the heart.","chapter":-1,"fact":0,"image":"/assets/books/da7b6981b8b81da3fd31.webp","links":[{"x":0.075,"y":0.2569444444444444,"w":0.85,"h":0.08333333333333333,"page":38},{"x":0.075,"y":0.3388888888888889,"w":0.85,"h":0.08333333333333333,"page":113},{"x":0.075,"y":0.42083333333333334,"w":0.85,"h":0.08333333333333333,"page":37},{"x":0.075,"y":0.5027777777777778,"w":0.85,"h":0.08333333333333333,"page":27},{"x":0.075,"y":0.5847222222222223,"w":0.85,"h":0.08333333333333333,"page":86},{"x":0.075,"y":0.6666666666666666,"w":0.85,"h":0.08333333333333333,"page":105},{"x":0.075,"y":0.7486111111111111,"w":0.85,"h":0.08333333333333333  const sh=new Path2D();sh.moveTo(edge(0)+curl*.7,0);for(let y=0;y<=h;y+=h/40)sh.lineTo(edge(y)+curl*.7,y);for(let y=h;y>=0;y-=h/40)sh.lineTo(edge(y)+curl+shadow,y);sh.closePath();let gr=ctx.createLinearGradient(base+curl*.6,0,base+curl+shadow,0);gr.addColorStop(0,'rgba(41,29,18,.38)');gr.addColorStop(.5,'rgba(41,29,18,.17)');gr.addColorStop(1,'rgba(41,29,18,0)');ctx.fillStyle=gr;ctx.fill(sh);
 const back=new Path2D();back.moveTo(edge(0),0);for(let y=0;y<=h;y+=h/40)back.lineTo(edge(y),y);for(let y=h;y>=0;y-=h/40)back.lineTo(edge(y)+curl*(.85+.15*Math.sin(Math.PI*y/h)),y);back.closePath();gr=ctx.createLinearGradient(base,0,base+curl,0);gr.addColorStop(0,'#bba98d');gr.addColorStop(.16,'#e8d8bb');gr.addColorStop(.58,'#fff9ed');gr.addColorStop(.82,'#fffdf5');gr.addColorStop(1,'#cfbfa2');ctx.fillStyle=gr;ctx.fill(back);
 ctx.save();ctx.clip(back);ctx.globalAlpha=.07;ctx.translate(base*2+curl*.8,0);ctx.scale(-1,1);ctx.drawImage(flip.old,0,0,w,h);ctx.restore();ctx.strokeStyle='rgba(255,255,248,.8)';ctx.lineWidth=Math.max(.7,w*.0015);ctx.stroke(path(curl*.88));ctx.restore();}
function endTurn(commit){if(!flip)return;const target=flip.target;cancelAnimationFrame(raf);turnCanvas.hidden=true;flip=null;busy=false;currentProgress=0;if(commit)index=target;update();if(queued){const q=Math.sign(queued);queued-=q;setTimeout(()=>turn(q),20);}}
function animateTo(to,duration=650){if(!flip)return;if(reduceMotion){endTurn(to===1);return;}const from=currentProgress,start=performance.now(),token=flip.token;const frame=now=>{if(!flip||flip.token!==token)return;const t=Math.min(1,(now-start)/duration),e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;drawCurl(from+(to-from)*e);if(t<1)raf=requestAnimationFrame(frame);else endTurn(to===1);};raf=requestAnimationFrame(frame);}
async function turn(delta){if(busy){queued=Math.max(-4,Math.min(4,queued+delta));return;}if(index+delta<0||index+delta>=PAGES.length){queued=0;return;}if(reduceMotion){goTo(index+delta);return;}try{if(await prepareTurn(delta)){paperSound();animateTo(1,720);}}catch{busy=false;flip=null;turnCanvas.hidden=true;update();notify('Please try turning the page again.');}}
function followPageLink(x,y){const p=PAGES[index],hit=(p.links||[]).find(l=>x>=l.x&&x<=l.x+l.w&&y>=l.y&&y<=l.y+l.h);if(!hit)return false;if(hit.url)window.open(hit.url,'_blank','noopener,noreferrer');else goTo(hit.page);return true;}
function goTo(n){n=Math.max(0,Math.min(PAGES.length-1,Math.round(n)));flipToken++;cancelAnimationFrame(raf);flip=null;busy=false;queued=0;turnCanvas.hidden=true;index=n;update();}
book.addEventListener('pointerdown',e=>{if(e.button!==0||busy)return;const r=book.getBoundingClientRect();drag={id:e.pointerId,start:e.clientX,last:e.clientX,startY:e.clientY,y:(e.clientY-r.top)/r.height,time:performance.now(),moved:false,preparing:false,delta:0};book.setPointerCapture(e.pointerId);});
book.addEventListener('pointermove',async e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.start;drag.last=e.clientX;if(Math.abs(dx)<8&&!drag.moved)return;e.preventDefault();if(!drag.moved){drag.moved=true;drag.delta=dx<0?1:-1;const current=drag;drag.preparing=true;try{const ok=await prepareTurn(drag.delta,drag.y);if(!ok){if(drag===current)drag=null;return;}if(drag!==current){animateTo(0,220);return;}drag.preparing=false;}catch{drag=null;busy=false;return;}}
 if(drag&&!drag.preparing&&flip){const width=book.getBoundingClientRect().width;drawCurl(Math.max(0,Math.min(.99,(drag.delta>0?-dx:dx)/(width*.92))));}});
book.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;const d=drag;drag=null;try{book.releasePointerCapture(e.pointerId);}catch{}if(!d.moved){const r=book.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;if(!followPageLink(x,y))turn(x<.3?-1:1);return;}if(flip){const travelled=Math.abs(d.last-d.start),speed=travelled/Math.max(1,performance.now()-d.time);const commit=currentProgress>.17||speed>.45;paperSound();animateTo(commit?1:0,commit?Math.max(180,470*(1-currentProgress)):260);}});
book.addEventListener('pointercancel',()=>{drag=null;if(flip)animateTo(0,220);});
$('nextButton').onclick=()=>turn(1);$('previousButton').onclick=()=>turn(-1);$('openButton').onclick=()=>turn(1);$('progress').oninput=e=>goTo(+e.target.value);
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||$('contentsDialog').open||$('readingDialog').open||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();turn(1);}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();turn(-1);}else if(e.key==='Home'){e.preventDefault();goTo(0);}else if(e.key==='End'){e.preventDefault();goTo(PAGES.length-1);}else if(e.key.toLowerCase()==='b')toggleBookmark();});
function toggleBookmark(){if(state.marks.includes(index)){state.marks=state.marks.filter(n=>n!==index);notify('Bookmark removed');}else{state.marks.push(index);state.marks.sort((a,b)=>a-b);notify('Page bookmarked');}update();}
$('bookmarkButton').onclick=toggleBookmark;
function renderContents(){const q=$('search').value.trim().toLowerCase(),list=$('tocList');list.replaceChildren();let rows;
 if(q){rows=PAGES.map((p,i)=>({p,i})).filter(({p})=>p.kind==='fact'&&(p.title+' '+p.text).toLowerCase().includes(q)).sort((a,b)=>(b.p.title.toLowerCase().includes(q)?1:0)-(a.p.title.toLowerCase().includes(q)?1:0)).map(({p,i})=>({title:p.title,page:i,small:'Fact '+String(p.fact).padStart(2,'0')}));}
 else if(activeTab==='saved')rows=state.marks.map(i=>({title:PAGES[i].title,page:i,small:'Page '+(i+1)}));else rows=CHAPTERS.map(p=>({...p,small:String(p.page+1).padStart(3,'0')}));
 if(!rows.length){const p=document.createElement('p');p.className='empty';p.textContent=q?'No matching facts. Try a different word.':'Use the ribbon button to keep a page here.';list.append(p);return;}
 for(const row of rows){const button=document.createElement('button');button.className='toc-item';const label=document.createElement('span');label.textContent=row.title;const small=document.createElement('small');small.textContent=row.small;button.append(label,small);button.onclick=()=>{goTo(row.page);$('contentsDialog').close();book.focus({preventScroll:true});};list.append(button);}}
$('contentsButton').onclick=()=>{renderContents();$('contentsDialog').showModal();setTimeout(()=>$('search').focus(),50);};$('closeContents').onclick=()=>$('contentsDialog').close();$('search').oninput=renderContents;
function setTab(tab){activeTab=tab;$('chaptersTab').setAttribute('aria-selected',String(tab==='chapters'));$('savedTab').setAttribute('aria-selected',String(tab==='saved'));renderContents();}
$('chaptersTab').onclick=()=>setTab('chapters');$('savedTab').onclick=()=>setTab('saved');$('soundButton').onclick=()=>{state.sound=!state.sound;save();$('soundButton').textContent=state.sound?'On':'Off';$('soundButton').setAttribute('aria-pressed',String(state.sound));if(state.sound)paperSound();};
async function updateReading(){const p=PAGES[index];$('readKicker').textContent=p.kind==='fact'?'Fact '+String(p.fact).padStart(2,'0')+' · The Body You Live In':p.kind.replaceAll('-',' ');$('readTitle').textContent=p.title;$('readText').replaceChildren();for(const block of p.text.split(/\n\s*\n/)){if(!block.trim())continue;const pp=document.createElement('p');pp.textContent=block;$('readText').append(pp);}$('readArticle').style.fontSize=state.textSize+'px';$('readSources').replaceChildren();for(const s of p.sources||[]){const a=document.createElement('a');a.href=s.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=s.title+' · '+s.name;$('readSources').append(a);}$('readSources').hidden=!(p.sources?.length);$('readPrevious').disabled=index===0;$('readNext').disabled=index===PAGES.length-1;
 const picture=$('readPicture');picture.hidden=true;try{const img=await loadImage(index);if(p.kind==='fact'){const cc=document.createElement('canvas');cc.width=1000;cc.height=667;cc.getContext('2d').drawImage(img,img.naturalWidth*26/480,img.naturalHeight*(720-282-285.333)/720,img.naturalWidth*428/480,img.naturalHeight*285.333/720,0,0,1000,667);picture.src=cc.toDataURL('image/jpeg',.92);picture.alt='Illustration for '+p.title;picture.hidden=false;}else if(['cover','chapter','back'].includes(p.kind)){picture.src=p.image;picture.alt=p.title;picture.hidden=false;}}catch{} }
$('readingButton').onclick=()=>{updateReading();$('readingDialog').showModal();};$('closeReading').onclick=()=>$('readingDialog').close();$('largerText').onclick=()=>{state.textSize=Math.min(28,state.textSize+1);save();$('readArticle').style.fontSize=state.textSize+'px';};$('smallerText').onclick=()=>{state.textSize=Math.max(16,state.textSize-1);save();$('readArticle').style.fontSize=state.textSize+'px';};
$('readPrevious').onclick=()=>{goTo(index-1);updateReading();$('readingDialog').scrollTop=0;};$('readNext').onclick=()=>{goTo(index+1);updateReading();$('readingDialog').scrollTop=0;};
$('fullscreenButton').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{notify('Full screen is unavailable in this view.');}};
for(const d of [$('contentsDialog'),$('readingDialog')])d.addEventListener('click',e=>{const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();});
const resumePage=Number.isInteger(saved.page)&&saved.page>0&&saved.page<PAGES.length?saved.page:0;update(false);if(resumePage){$('resumeButton').hidden=false;$('resumeButton').textContent='Continue from page '+(resumePage+1);$('resumeButton').onclick=()=>goTo(resumePage);}resize();
window.__bookDebug={get page(){return index;},get busy(){return busy;},get progress(){return currentProgress;},goTo,turn,pages:PAGES.length};
</script>
