per-wrap{max-width:265px;margin:0 auto}.day-content{padding-top:0}.day-content h1{font-size:38px}.topline{margin-bottom:24px}.progress{width:100px}.topline .eyebrow{font-size:9px}.collection-head{display:block}.collection-head h1{font-size:37px}.grid{grid-template-columns:repeat(3,1fr);gap:22px 10px}.tile h3{font-size:11px}.tile-state{font-size:8px;left:5px;right:5px;padding:6px}.tile-number{font-size:8px;left:6px;top:6px}.action-card{padding:21px}.action-card p{font-size:16px}.actions .primary{width:100%}footer{padding:22px;font-size:10px}.cue{font-size:16px}.day-content .explain{font-size:13px}dialog{padding:25px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<script type="module">const EMBEDDED_DAYS=[{"day":1,"title":"The Focused Beam","cue":"One task. Ten minutes. Begin.","category":"Focus","explanation":"The single bright route represents choosing where to put your attention.","action":"Pick one useful task. Work on it for ten minutes. Each time you drift, return to that task.","image":"assets/rewire/day-01.jpg","download":"assets/rewire/day-01.jpg","thumbnail":"assets/rewire/day-01-thumb.webp"},{"day":2,"title":"The Space Between","cue":"Pause. Exhale. Choose.","category":"Pause","explanation":"The gap between branches represents a moment to choose your response.","action":"Before one reactive reply today, pause, let out a gentle breath, and choose what to say.","image":"assets/rewire/day-02.jpg","download":"assets/rewire/day-02.jpg","thumbnail":"assets/rewire/day-02-thumb.webp"},{"day":3,"title":"Intentional Unlock","cue":"When I unlock, I choose my purpose.","category":"Phone use","explanation":"The gate represents filtering distractions through an intention.","action":"Before opening an app, say why you unlocked your phone. If there is no purpose, put it down.","image":"assets/rewire/day-03.jpg","download":"assets/rewire/day-03.jpg","thumbnail":"assets/rewire/day-03-thumb.webp"},{"day":4,"title":"The First Two Minutes","cue":"Make the first step small enough to start.","category":"Starting","explanation":"The small seed represents an action that can grow through practice.","action":"Choose a task you have avoided. Do its smallest first step for two minutes.","image":"assets/rewire/day-04.jpg","download":"assets/rewire/day-04.jpg","thumbnail":"assets/rewire/day-04-thumb.webp"},{"day":5,"title":"Thought Is Not Fact","cue":"Notice the thought. Check the evidence.","category":"Perspective","explanation":"The cloud and lens separate a thought from the evidence for it.","action":"Write down a troubling thought. Identify a fact that supports it and a fact that complicates it.","image":"assets/rewire/day-05.jpg","download":"assets/rewire/day-05.jpg","thumbnail":"assets/rewire/day-05-thumb.webp"},{"day":6,"title":"Return to Now","cue":"Feel your feet. Notice what is here.","category":"Presence","explanation":"The grounded figure represents noticing direct sensory experience.","action":"At three natural pauses, feel your feet and name three things you can see.","image":"assets/rewire/day-06.jpg","download":"assets/rewire/day-06.jpg","thumbnail":"assets/rewire/day-06-thumb.webp"},{"day":7,"title":"Name the Feeling","cue":"Name it before you act.","category":"Emotion","explanation":"The bounded signal represents identifying an emotion before responding.","action":"Name a strong feeling in plain words. Then choose one useful next action.","image":"assets/rewire/day-07.jpg","download":"assets/rewire/day-07.jpg","thumbnail":"assets/rewire/day-07-thumb.webp"},{"day":8,"title":"The Slow Exhale","cue":"Let the next exhale be gentle and unhurried.","category":"Calm","explanation":"The ribbon represents breathing gently rather than forcing calm.","action":"Take three comfortable breaths with unhurried exhales. Return to normal breathing if uncomfortable.","image":"assets/rewire/day-08.jpg","download":"assets/rewire/day-08.jpg","thumbnail":"assets/rewire/day-08-thumb.webp"},{"day":9,"title":"One Next Action","cue":"Write the next action. Do only that.","category":"Clarity","explanation":"The converging paths represent turning a problem into a concrete step.","action":"Write one action beginning with a verb. Do that action before planning the rest.","image":"assets/rewire/day-09.jpg","download":"assets/rewire/day-09.jpg","thumbnail":"assets/rewire/day-09-thumb.webp"},{"day":10,"title":"Close the Loop","cue":"Choose a finish line. Reach it.","category":"Finishing","explanation":"The closing circuit represents a realistic stopping point.","action":"Define what finished means for one small task. Complete that version before adding more.","image":"assets/rewire/day-10.jpg","download":"assets/rewire/day-10.jpg","thumbnail":"assets/rewire/day-10-thumb.webp"},{"day":11,"title":"Active Recall","cue":"Close the page. Recall one idea.","category":"Learning","explanation":"The reconstructed network represents retrieving an idea from memory.","action":"After studying, close the page and explain one idea from memory. Reopen it to check.","image":"assets/rewire/day-11.jpg","download":"assets/rewire/day-11.jpg","thumbnail":"assets/rewire/day-11-thumb.webp"},{"day":12,"title":"Space the Practice","cue":"Review tomorrow. Return next week.","category":"Memory","explanation":"The separated nodes represent returning to learning across time.","action":"Review one idea today. Schedule a short review for tomorrow and next week.","image":"assets/rewire/day-12.jpg","download":"assets/rewire/day-12.jpg","thumbnail":"assets/rewire/day-12-thumb.webp"},{"day":13,"title":"Learn from Error","cue":"Find the error. Change one step.","category":"Feedback","explanation":"The corrected junction represents using feedback to adjust your approach.","action":"Identify a step that led to one mistake. Change that step and try again.","image":"assets/rewire/day-13.jpg","download":"assets/rewire/day-13.jpg","thumbnail":"assets/rewire/day-13-thumb.webp"},{"day":14,"title":"Protect Your Attention","cue":"Silence one distraction before you begin.","category":"Attention","explanation":"The filter represents arranging your surroundings to support your intention.","action":"Silence one notification source and move one distraction out of reach before focusing.","image":"assets/rewire/day-14.jpg","download":"assets/rewire/day-14.jpg","thumbnail":"assets/rewire/day-14-thumb.webp"},{"day":15,"title":"Rest Is a Rhythm","cue":"Choose a bedtime. Begin winding down.","category":"Rest","explanation":"The fading arc represents making room for a regular wind-down.","action":"Choose tonight's wind-down time. Dim your environment and stop one stimulating activity then.","image":"assets/rewire/day-15.jpg","download":"assets/rewire/day-15.jpg","thumbnail":"assets/rewire/day-15-thumb.webp"},{"day":16,"title":"Move the Body","cue":"Stand up. Take a short walk.","category":"Movement","explanation":"The figure represents breaking up a long period of sitting.","action":"Take a short comfortable walk at a natural break, or choose movement suitable for your body.","image":"assets/rewire/day-16.jpg","download":"assets/rewire/day-16.jpg","thumbnail":"assets/rewire/day-16-thumb.webp"},{"day":17,"title":"The Kinder Voice","cue":"Speak to yourself as you would to a friend.","category":"Self-talk","explanation":"The warm bridge represents treating your own struggle with care.","action":"Rewrite a self-critical sentence as advice you would give a friend. Use that advice.","image":"assets/rewire/day-17.jpg","download":"assets/rewire/day-17.jpg","thumbnail":"assets/rewire/day-17-thumb.webp"},{"day":18,"title":"Compare Less","cue":"Choose your own next step.","category":"Comparison","explanation":"The chosen route represents your own direction.","action":"When comparison distracts you, take one step toward your own goal.","image":"assets/rewire/day-18.jpg","download":"assets/rewire/day-18.jpg","thumbnail":"assets/rewire/day-18-thumb.webp"},{"day":19,"title":"The Worry Window","cue":"Write the worry. Choose when to revisit it.","category":"Worry","explanation":"The contained loop represents giving a worry a place and a time.","action":"Write a non-urgent worry down and schedule ten minutes to revisit it. Handle urgent practical issues now.","image":"assets/rewire/day-19.jpg","download":"assets/rewire/day-19.jpg","thumbnail":"assets/rewire/day-19-thumb.webp"},{"day":20,"title":"Make Room","cue":"Let the feeling be here. Choose your action.","category":"Acceptance","explanation":"The steady axis represents acting while a feeling is still present.","action":"Notice a difficult feeling without demanding it disappear. Take a small action that matters to you.","image":"assets/rewire/day-20.jpg","download":"assets/rewire/day-20.jpg","thumbnail":"assets/rewire/day-20-thumb.webp"},{"day":21,"title":"Check the Story","cue":"What happened? What am I adding?","category":"Interpretation","explanation":"The layers separate an event from your interpretation.","action":"Describe an upsetting event using observable facts. Write your interpretation separately.","image":"assets/rewire/day-21.jpg","download":"assets/rewire/day-21.jpg","thumbnail":"assets/rewire/day-21-thumb.webp"},{"day":22,"title":"Control the Next Step","cue":"Act on what is yours to change.","category":"Agency","explanation":"The nearby nodes represent what you can influence.","action":"List one thing you can influence. Spend ten minutes acting on it.","image":"assets/rewire/day-22.jpg","download":"assets/rewire/day-22.jpg","thumbnail":"assets/rewire/day-22-thumb.webp"},{"day":23,"title":"Respond with Care","cue":"Read again. Reply after a pause.","category":"Communication","explanation":"The buffered link represents a deliberate pause.","action":"Reread a tense message after a pause. Make one edit that improves clarity or care.","image":"assets/rewire/day-23.jpg","download":"assets/rewire/day-23.jpg","thumbnail":"assets/rewire/day-23-thumb.webp"},{"day":24,"title":"Listen First","cue":"Understand before you answer.","category":"Listening","explanation":"The bridge represents checking your understanding.","action":"Summarise what you heard and check your understanding before giving advice in one conversation.","image":"assets/rewire/day-24.jpg","download":"assets/rewire/day-24.jpg","thumbnail":"assets/rewire/day-24-thumb.webp"},{"day":25,"title":"Set the Boundary","cue":"Say what you can do. Say what you cannot.","category":"Boundaries","explanation":"The boundary represents connection with clear limits.","action":"Use a clear sentence: I can do this, but I cannot do that. Offer a realistic alternative if helpful.","image":"assets/rewire/day-25.jpg","download":"assets/rewire/day-25.jpg","thumbnail":"assets/rewire/day-25-thumb.webp"},{"day":26,"title":"Notice the Good","cue":"Name one specific thing you appreciate.","category":"Appreciation","explanation":"The illuminated detail represents noticing something specific.","action":"Name one thing you appreciate and why. If it involves someone, consider telling them yourself.","image":"assets/rewire/day-26.jpg","download":"assets/rewire/day-26.jpg","thumbnail":"assets/rewire/day-26-thumb.webp"},{"day":27,"title":"Repeat the Cue","cue":"After my daily cue, I do one small action.","category":"Habit cue","explanation":"The repeated nodes represent pairing a cue with an action.","action":"Make a plan: After [daily routine], I will [small action]. Practise it at that cue today.","image":"assets/rewire/day-27.jpg","download":"assets/rewire/day-27.jpg","thumbnail":"assets/rewire/day-27-thumb.webp"},{"day":28,"title":"Change the Environment","cue":"Put the helpful choice within reach.","category":"Environment","explanation":"The reachable node represents making a helpful choice easier.","action":"Put a useful object where you will use it: a book, walking shoes, or a water bottle.","image":"assets/rewire/day-28.jpg","download":"assets/rewire/day-28.jpg","thumbnail":"assets/rewire/day-28-thumb.webp"},{"day":29,"title":"Begin Again","cue":"A missed day is a cue to return.","category":"Returning","explanation":"The reconnected path represents resuming after interruption.","action":"Resume a paused habit with its smallest useful version. Return without trying to catch up.","image":"assets/rewire/day-29.jpg","download":"assets/rewire/day-29.jpg","thumbnail":"assets/rewire/day-29-thumb.webp"},{"day":30,"title":"Practise the Person","cue":"Choose one action that matches your values.","category":"Values","explanation":"The figure represents making values visible through actions.","action":"Choose a value such as care, learning, or honesty. Take one concrete action that expresses it.","image":"assets/rewire/day-30.jpg","download":"assets/rewire/day-30.jpg","thumbnail":"assets/rewire/day-30-thumb.webp"}];
const KEY='rewire.journey.v1';
const dateKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function tomorrow(key){const [y,m,d]=key.split('-').map(Number);return dateKey(new Date(y,m-1,d+1,12));}
function cleanState(raw){
 const out={version:1,started:typeof raw?.started==='string'?raw.started:null,downloads:[],practice:[],pending:null,reminder:'09:00'};
 if(!out.started)return out;
 for(const item of Array.isArray(raw.downloads)?raw.downloads:[]){
  const day=out.downloads.length+1;
  if(day>30||item?.day!==day||!/^\d{4}-\d{2}-\d{2}$/.test(item.date)||item.date<(day===1?out.started:tomorrow(out.downloads[day-2].date)))break;
  out.downloads.push({day,date:item.date});
 }
 out.practice=Array.isArray(raw.practice)?raw.practice.filter(x=>Number.isInteger(x)&&x>0&&x<=out.downloads.length):[];
 if(raw.pending&&raw.pending.day===out.downloads.length+1)out.pending=raw.pending;
 if(/^([01]\d|2[0-3]):[0-5]\d$/.test(raw.reminder||''))out.reminder=raw.reminder;
 return out;
}
function availableDay(state,today=dateKey()){
 if(!state.started)return 0;
 const n=state.downloads.length;
 if(!n)return 1;
 if(n===30)return 30;
 return today>=tomorrow(state.downloads[n-1].date)?n+1:n;
}
function confirmDownload(state,day,today=dateKey()){
 if(!state.started||day!==state.downloads.length+1||day!==availableDay(state,today)||state.pending?.day!==day)return false;
 state.downloads.push({day,date:today});state.pending=null;return true;
}

async function prepareShareFile(day,fetcher=fetch){
 const response=await fetcher(day.download);
 if(!response.ok)throw new Error('Image unavailable');
 const bytes=new Uint8Array(await response.arrayBuffer());
 // Static hosts may serve image bytes as application/octet-stream.
 // Validate the actual JPEG signature instead of rejecting its MIME header.
 if(bytes.length<3||bytes[0]!==255||bytes[1]!==216||bytes[2]!==255)throw new Error('Invalid JPEG');
 return new File([bytes],`Rewire-Day-${String(day.day).padStart(2,'0')}.jpg`,{type:'image/jpeg'});
}
function requestDirectDownload(day,doc=document){
 const a=doc.createElement('a');a.href=day.download;
 a.download=`Rewire-Day-${String(day.day).padStart(2,'0')}.jpg`;
 doc.body.append(a);a.click();a.remove();
}

const app=document.querySelector('#app'),modal=document.querySelector('#modal'),body=document.querySelector('#modalBody');
let days=[],view='today',selected=null,state=cleanState(null),storageWorks=true,busy=false,toastTimer;
function read(){try{state=cleanState(JSON.parse(localStorage.getItem(KEY)||'null'));}catch{storageWorks=false;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{storageWorks=false;toast('Your browser cannot save progress. Keep this page open.');}}
function toast(message){const el=document.querySelector('#toast');el.textContent=message;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),5000);}
function show(html){body.innerHTML=html;if(!modal.open)modal.showModal();}
function pretty(key){const [y,m,d]=key.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});}
function warning(){return storageWorks?'':'<div class="storage-warning">This browser cannot store progress. Your journey is available for this visit, but may be lost when you close the page. Enable browser storage to continue reliably.</div>';}
function render(){
 const available=availableDay(state),n=state.downloads.length;
 document.querySelector('#todayNav').classList.toggle('active',view==='today');document.querySelector('#collectionNav').classList.toggle('active',view==='collection');
 if(view==='collection'){collection(available);return;}
 if(!state.started){landing();return;}
 const number=selected&&selected<=available?selected:available,d=days[number-1],downloaded=number<=n,old=number<available;
 const unlock=n&&n<30?tomorrow(state.downloads[n-1].date):null;
 const pending=state.pending?.day===number;
 app.innerHTML=warning()+`<div class="topline"><div class="eyebrow">Your journey · Day ${String(number).padStart(2,'0')} / 30</div><div><div class="progress-label">${n} of 30 wallpapers saved</div><div class="progress"><div style="width:${n/30*100}%"></div></div></div></div>${old?'<button class="text-btn back" id="backToday">← Back to your current day</button>':''}<section class="day-layout"><div class="wallpaper-wrap"><button class="tile" id="previewImage" aria-label="View wallpaper full size"><img class="wallpaper-full" src="${d.image}" alt="${d.title} wallpaper: ${d.cue}" loading="lazy" decoding="async"></button><div class="image-label"><span>PORTRAIT · 9:16</span><span>TAP TO PREVIEW ↗</span></div></div><div class="day-content"><span class="pill">${d.category}</span><h1>${d.title}</h1><p class="cue">“${d.cue}”</p><p class="explain">${d.explanation}</p><div class="action-card"><div class="label">YOUR ACTION THROUGHOUT TODAY</div><p>${d.action}</p></div>${!downloaded?'<div class="waiting reminder">Your wallpaper is waiting. Save it to keep your journey moving.</div>':''}<div class="actions"><button class="primary" id="downloadBtn">${downloaded?'Download again ↓':'Download wallpaper ↓'}</button><button class="secondary" id="setupBtn">Set as wallpaper ↗</button></div>${pending&&!downloaded?'<button id="savedBtn" class="secondary full" style="margin-top:12px">I’ve saved it to my phone ✓</button>':''}<p class="small" style="margin-top:12px">Save the image, then confirm. Your phone’s settings handle the wallpaper change.</p>${downloaded&&!old&&n<30?`<div class="waiting"><strong>Day ${n+1} opens ${pretty(unlock)}.</strong><br>Today is for practising this action. Your next wallpaper unlocks after midnight in your device’s local time.</div>`:''}${n===30&&!old?'<div class="waiting complete">All 30 wallpapers saved. Keep returning to the actions that help you most.</div>':''}<label class="practice"><input id="practiceCheck" type="checkbox" ${state.practice.includes(number)?'checked':''} ${!downloaded?'disabled':''}>I practised today’s action</label><button class="text-btn" id="remindBtn">Add a daily calendar reminder</button>${number<30?`<div class="next-preview"><img src="${days[number].thumbnail}" alt="" loading="lazy"><div><small>UP NEXT · DAY ${number+1}</small><strong>${days[number].title}</strong></div></div>`:''}</div></section>`;
 document.querySelector('#downloadBtn').onclick=()=>download(d);
 document.querySelector('#setupBtn').onclick=()=>setup(d);
 document.querySelector('#previewImage').onclick=()=>show(`<img class="modal-image" src="${d.image}" alt="${d.title}" decoding="async"><p style="margin-top:16px">${d.cue}</p>`);
 document.querySelector('#savedBtn')?.addEventListener('click',()=>confirmSaved(number));
 document.querySelector('#practiceCheck').onchange=e=>{read();state.practice=state.practice.filter(x=>x!==number);if(e.target.checked)state.practice.push(number);save();toast(e.target.checked?'One small action counts.':'Practice mark removed.');};
 document.querySelector('#remindBtn').onclick=reminders;
 document.querySelector('#backToday')?.addEventListener('click',()=>{selected=null;render();});
 app.setAttribute('aria-busy','false');
}
function landing(){app.innerHTML=warning()+`<section class="hero"><div class="intro"><div class="eyebrow">30 wallpapers · 30 everyday intentions</div><h1>Change your screen.<br><em>Choose your action.</em></h1><p class="lead">Turn the moment you reach for your phone into a moment you choose. One wallpaper. One small action. One day at a time.</p><button class="primary" id="beginBtn">Begin day one <span style="margin-left:28px">↗</span></button><p class="small">Your pace. No streak pressure. No skipped days.</p><div class="steps"><div><b><i>01</i> Save it</b>Download your daily wallpaper.</div><div><b><i>02</i> Live it</b>Carry one action into your day.</div><div><b><i>03</i> Return</b>Your next day opens tomorrow.</div></div></div><div class="hero-art"><div class="phone"><img src="${days[0].image}" alt="The Focused Beam wallpaper"><div class="clock"><small>YOUR NEXT CHAPTER</small>09:41</div></div><div class="floating"><strong>✦ A screen with purpose</strong><span>Your daily reminder to act with intention.</span></div></div></section>`;document.querySelector('#beginBtn').onclick=()=>{read();if(!state.started){state.started=dateKey();save();}selected=null;render();window.scrollTo(0,0);};app.setAttribute('aria-busy','false');}
function collection(available){app.innerHTML=warning()+`<div class="collection-head"><div><div class="eyebrow">A collection that grows with you</div><h1>Thirty days. Your pace.</h1><p>Saved wallpapers stay available. Each new day follows the last download.</p></div><span class="pill">${state.downloads.length} / 30 saved</span></div><section class="grid" aria-label="All 30 wallpapers">${days.map(d=>{const unlocked=d.day<=available,saved=d.day<=state.downloads.length;return `<button class="tile ${unlocked?'unlocked':'locked'}" data-day="${d.day}" aria-label="Day ${d.day}, ${d.title}, ${saved?'saved':unlocked?'available':'locked'}"><div class="tile-image"><img src="${d.thumbnail}" alt="" loading="lazy"><span class="tile-number">DAY ${String(d.day).padStart(2,'0')}</span><span class="tile-state">${saved?'✓ Saved':unlocked?'Open your day ↗':'⌑ Unlocks in order'}</span></div><h3>${d.title}</h3><span class="small">${d.category}</span></button>`;}).join('')}</section>`;app.querySelectorAll('[data-day]').forEach(btn=>btn.onclick=()=>{read();const n=Number(btn.dataset.day);if(n>availableDay(state)){show(`<h2>One day at a time.</h2><p>${!state.started?'Tap Begin to open Day 1.':state.downloads.length===availableDay(state)?`Your next wallpaper opens ${pretty(tomorrow(state.downloads.at(-1).date))}.`:`Save and confirm Day ${availableDay(state)} first. The next wallpaper opens the following day.`}</p><p>Days do not pile up while you are away. Continue from where you left off.</p>`);return;}selected=n;view='today';render();window.scrollTo(0,0);});app.setAttribute('aria-busy','false');}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
function markPending(d){read();if(d.day===availableDay(state)&&d.day===state.downloads.length+1){state.pending={day:d.day,requestedAt:Date.now()};save();}}
function download(d){
 // Keep the direct link click inside the user's gesture; no fetch/blob step.
 requestDirectDownload(d);savePanel(d,false);
}
function savePanel(d,setting){
 show(`<h2>${setting?'Set your wallpaper.':'Save your wallpaper.'}</h2><p>Press and hold the image below to save it to Photos or your gallery. On desktop, right-click and choose Save image as.</p><img id="saveImage" class="modal-image" src="${d.download}" alt="${d.title}" decoding="async"><p id="imageStatus" class="small">Loading full-resolution JPEG…</p><div class="actions"><a class="primary" id="directSave" href="${d.download}" download="Rewire-Day-${String(d.day).padStart(2,'0')}.jpg">Download JPEG ↓</a><a class="secondary" id="imageTab" href="${d.download}" target="_blank" rel="noopener">Open image ↗</a></div><button class="secondary full" id="shareImage" style="margin-top:12px" hidden>Share / Save to Photos ↗</button>${setting?'<p><strong>iPhone:</strong> Settings → Wallpaper → Add New Wallpaper → Photos.<br><strong>Android:</strong> Open the saved image → menu → Set as wallpaper / Use as.</p><p class="small">Your phone requires you to apply the wallpaper manually. The website cannot change it automatically.</p>':'<p class="small">If the download is blocked inside another app, open this page in Safari or Chrome, or use Open image and save it there.</p>'}${d.day>state.downloads.length?'<button class="primary full" id="confirmModal" style="margin-top:16px" disabled>I’ve saved it to my phone ✓</button>':'<p class="small">Already saved in your journey. Downloading again does not change your unlock date.</p>'}`);
 const image=document.querySelector('#saveImage'),status=document.querySelector('#imageStatus'),confirm=document.querySelector('#confirmModal');
 const ready=()=>{markPending(d);status.textContent='Full-resolution JPEG ready. Save the image before confirming.';if(confirm)confirm.disabled=false;};
 image.onload=ready;
 image.onerror=()=>{status.textContent='The image could not load. Try Open image, or reopen this page in Safari or Chrome.';};
 if(image.complete&&image.naturalWidth)ready();
 document.querySelector('#directSave').onclick=()=>markPending(d);
 document.querySelector('#imageTab').onclick=()=>markPending(d);
 if(confirm)confirm.onclick=()=>confirmSaved(d.day);
 const share=document.querySelector('#shareImage');
 if(navigator.share&&navigator.canShare){prepareShareFile(d).then(file=>{
  if(!share.isConnected||!navigator.canShare({files:[file]}))return;
  share.hidden=false;
  // File is ready before this new click, preserving native share activation.
  share.onclick=async()=>{try{await navigator.share({files:[file]});markPending(d);}catch(error){if(error.name!=='AbortError')toast('Use Download JPEG or press and hold the image to save.');}};
 }).catch(()=>{/* Direct JPEG links and press-and-hold remain available. */});}
}
function confirmSaved(day){read();if(confirmDownload(state,day)){save();modal.close();render();toast(day===30?'Your collection is complete.':`Saved. Day ${day+1} opens tomorrow.`);}else{modal.close();render();toast('Progress refreshed. Continue with your current day.');}}
function setup(d){savePanel(d,true);}
function reminders(){show(`<h2>A daily nudge.</h2><p>The app reminds you about an unfinished download whenever you return. For a reminder while the app is closed, add this daily event to your calendar.</p><label class="settings-row"><span>Daily reminder time</span><input id="reminderTime" type="time" value="${state.reminder}"></label><button id="calendarBtn" class="primary full">Download calendar reminder ↓</button><p class="small">Import the .ics file into your calendar. Enable calendar notifications. The event repeats daily until you remove it, including after Day 30.</p>`);document.querySelector('#calendarBtn').onclick=()=>{const time=document.querySelector('#reminderTime').value;if(!time)return;read();state.reminder=time;save();const now=new Date(),[h,m]=time.split(':').map(Number);let start=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m);if(start<=now)start.setDate(start.getDate()+1);const pad=n=>String(n).padStart(2,'0');const stamp=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;const end=new Date(start.getTime()+10*60000);const desc=`Open your Rewire journey. If today's wallpaper is waiting\, download and confirm it. Carry one action into your day. https://rewire-wallpaper-journey.magichinny.chatgpt.site`;const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Rewire//Daily Ritual//EN','BEGIN:VEVENT',`UID:rewire-${Date.now()}@wallpaper-journey`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z/,'Z')}`,`DTSTART:${stamp(start)}`,`DTEND:${stamp(end)}`,'RRULE:FREQ=DAILY','SUMMARY:Rewire — your daily wallpaper ritual',`DESCRIPTION:${desc}`,`URL:https://rewire-wallpaper-journey.magichinny.chatgpt.site`,'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:Return to your daily wallpaper and action.','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');downloadBlob(new Blob([ics],{type:'text/calendar;charset=utf-8'}),'Rewire-Daily-Reminder.ics');toast('Import the reminder into your calendar to activate it.');};}
function settings(){show(`<h2>Your journey.</h2><p>${state.started?`Started ${pretty(state.started)}. ${state.downloads.length} wallpapers saved.`:'Your first day is waiting.'}</p><p>Progress stays in this browser on this device. Clearing browser data or switching devices does not carry it across automatically.</p><button class="secondary full" id="backupBtn">Save progress backup ↓</button><label class="text-btn" style="display:block;margin-top:15px">Restore a backup <input type="file" id="restoreInput" accept="application/json,.json" style="display:block;margin-top:10px;max-width:100%"></label><button class="text-btn danger" id="resetBtn">Restart journey</button>`);document.querySelector('#backupBtn').onclick=()=>downloadBlob(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'Rewire-Progress.json');document.querySelector('#restoreInput').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>100000)throw new Error();const raw=JSON.parse(await f.text());if(raw.version!==1||!Array.isArray(raw.downloads)||typeof raw.started!=='string')throw new Error();const restored=cleanState(raw);if(restored.downloads.length!==raw.downloads.length||restored.started>dateKey()||restored.downloads.some(x=>x.date>dateKey()))throw new Error();show('<h2>Restore this journey?</h2><p>This replaces the progress currently saved in this browser.</p><button class="primary full" id="restoreConfirm">Restore progress</button>');document.querySelector('#restoreConfirm').onclick=()=>{state=restored;save();selected=null;view='today';modal.close();render();toast('Progress restored.');};}catch{toast('That backup is invalid. Your progress was kept.');}};document.querySelector('#resetBtn').onclick=()=>{show('<h2>Begin again?</h2><p>This resets your saved days in this browser. Download a backup first if you want to keep your progress.</p><button class="secondary danger full" id="resetConfirm">Reset all journey progress</button>');document.querySelector('#resetConfirm').onclick=()=>{state=cleanState(null);save();selected=null;view='today';modal.close();render();};};}
document.querySelector('#closeModal').onclick=()=>modal.close();
document.querySelector('#todayNav').onclick=()=>{read();view='today';selected=null;render();};
document.querySelector('#collectionNav').onclick=()=>{read();view='collection';selected=null;render();};
document.querySelector('.brand').onclick=e=>{e.preventDefault();view='today';selected=null;render();};
document.querySelector('#settingsNav').onclick=settings;
document.querySelector('#aboutBtn').onclick=()=>show(`<h2>A cue to practise.</h2><p>These wallpapers pair conceptual neural-inspired art with everyday actions. They are reminders, not medical diagrams or a proven brain-rewiring treatment.</p><p>Research supports specific cue–action plans and repeated learning practice. This collection itself has not been clinically tested.</p><p><a href="https://pubmed.ncbi.nlm.nih.gov/19106078/" target="_blank" rel="noopener">Research on cue-based action plans ↗</a><br><a href="https://www.nature.com/articles/nrn.2015.18" target="_blank" rel="noopener">Research on spaced learning ↗</a></p><p>Day 1 opens when you begin. Once you save and confirm a wallpaper, the next opens on the following local calendar day. If you miss a download, that day waits for you. Checking off practice is optional and does not unlock days.</p>`);
window.addEventListener('storage',e=>{if(e.key===KEY){read();render();}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){read();render();}});
let lastDate=dateKey();setInterval(()=>{if(lastDate!==dateKey()){lastDate=dateKey();read();selected=null;render();}},30000);
try{days=EMBEDDED_DAYS;if(days.length!==30)throw new Error();read();render();}catch{app.innerHTML='<div class="error"><h2>Your collection could not load.</h2><p>Please refresh and try again. Saved progress remains in your browser.</p><button class="primary" id="retryBtn">Try again</button></div>';app.setAttribute('aria-busy','false');document.querySelector('#retryBtn').onclick=()=>location.reload();}
</script></body></html>
