const sources={who:{name:'WHO · Doing What Matters in Times of Stress',url:'https://www.who.int/publications/i/item/9789240003927',note:'Evidence-informed guidance on grounding, unhooking, values, making room for emotions and kindness.'},habit:{name:'Wood & Rünger · Psychology of Habit (2016)',url:'https://doi.org/10.1146/annurev-psych-122414-033417',note:'Research review on repetition, context cues and habitual behaviour. Insight alone does not guarantee change.'},cbt:{name:'NHS · Cognitive behavioural therapy',url:'https://www.nhs.uk/tests-and-treatments/cognitive-behavioural-therapy-cbt/',note:'Explains examining thoughts and behaviours. These exercises are educational adaptations, not a course of clinical CBT.'},plan:{name:'Gollwitzer & Sheeran · Implementation Intentions (2006)',url:'https://doi.org/10.1016/S0065-2601(06)38002-1',note:'Meta-analysis on if–then plans and goal attainment. Effects depend on task and context.'},context:{name:'Albarracín et al. · Determinants of behaviour (2024)',url:'https://www.nature.com/articles/s44159-024-00305-0',note:'Review of individual and social-structural influences and interventions.'},mindful:{name:'NIH / NCCIH · Meditation and Mindfulness',url:'https://www.nccih.nih.gov/health/meditation-and-mindfulness-effectiveness-and-safety',note:'Benefits and limitations of mindfulness research; some people experience adverse effects.'}};
let state;try{state=JSON.parse(localStorage.getItem('loop21-v1'))||{}}catch{state={}}state.logs=state.logs||{};state.day=state.day||1;state.value=state.value||'Care';let tab='today',step=0,mode='automatic',timer=null,seconds=30;const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('loop21-v1',JSON.stringify(state))}catch{toast('Browser storage unavailable. Export your work before closing.')}}function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}function person(){return '<div class="human"><i class="head"></i><i class="body"></i><i class="arm"></i><i class="arm right"></i><i class="leg"></i><i class="leg right"></i></div>'}function art(){return `<div class="art" aria-label="Illustration of a person surrounded by social influences"><div class="orbit pulse"></div><div class="orbit"></div><div class="orbit"></div>${person()}<span class="art-label">FAMILY EXPECTATIONS</span><span class="art-label">ATTENTION ECONOMY</span><span class="art-label">REWARDS & HABITS</span><span class="art-label">SOCIAL BELONGING</span><div class="art-caption">LEARNED DOES NOT MEAN FIXED</div></div>`}function count(){return Object.values(state.logs).filter(l=>l.complete).length}function log(){return state.logs[state.day]||(state.logs[state.day]={})}function navigate(t){clearInterval(timer);timer=null;seconds=30;tab=t;step=0;mode='automatic';render();window.scrollTo({top:0,behavior:'instant'})}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>navigate(b.dataset.tab));function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='today')today();if(tab==='journey')journey();if(tab==='progress')progress();if(tab==='science')science();bind()}function dayCards(start=0,end=21){return curriculum.slice(start,end).map((d,k)=>{let n=start+k+1;return `<button class="day ${n===state.day?'selected':''}" data-day="${n}"><span class="number ${state.logs[n]?.complete?'done':''}">${state.logs[n]?.complete?'✓':String(n).padStart(2,'0')}</span><small>${n<8?'01 / SEE THE PATTERN':n<15?'02 / CREATE A CHOICE':'03 / LIVE THE PRACTICE'}</small><h3>${d[0]}</h3><p>${d[1]} · 5–10 minutes</p></button>`}).join('')}function today(){if(state.started){session();return}app.innerHTML=`<div class="hero"><div><div class="tag"><i class="dot"></i>21 DAYS · ONE REAL PATTERN AT A TIME</div><h1>You learned the loop.<br><span style="color:var(--lime)">You can learn<br>a different response.</span></h1><p>See how your world shapes your reactions. Practise a pause. Change one condition. Make more room for a life you choose.</p><div class="actions"><button class="primary" id="start">Begin my 21 days ↗</button><button class="secondary" id="explore">Explore the journey</button></div><p class="hint">No perfection. No awakening score. A few minutes of practice, followed by one real-world experiment.</p></div>${art()}</div><div class="strip"><div><strong>01 / See</strong><span>Understand your automatic patterns.</span></div><div><strong>02 / Choose</strong><span>Experiment with a different response.</span></div><div><strong>03 / Practise</strong><span>Build conditions that support change.</span></div></div><div class="sectionhead"><h2>Your first encounters</h2><span class="badge">SCIENCE-INFORMED</span></div><div class="grid">${dayCards(0,3)}</div><p class="notice">“Escape the matrix” is a metaphor for understanding learned habits and social influences. The goal is greater flexibility, not eliminating all conditioning. This programme has not been clinically tested.</p>`;document.getElementById('start').onclick=()=>{state.started=true;state.startedAt=new Date().toISOString();save();render()};document.getElementById('explore').onclick=()=>navigate('journey')}
function journey(){app.innerHTML=`<div class="eyebrow">THE COMPLETE FIELD GUIDE</div><h1>21 days.<br>A little more choice.</h1><p>Move at your own pace. Repeat a day whenever it is useful. All encounters stay available; 21 days is a learning structure, not a deadline for changing your brain.</p>${[0,7,14].map((n,i)=>`<div class="sectionhead"><h2>${['01 / See the pattern','02 / Create a choice','03 / Live the practice'][i]}</h2><span class="muted">Days ${n+1}–${n+7}</span></div><div class="grid">${dayCards(n,n+7)}</div>`).join('')}`}
function session(){const d=curriculum[state.day-1],l=log(),src=sources[d[11]];app.innerHTML=`<div class="sectionhead"><div><div class="eyebrow">DAY ${String(state.day).padStart(2,'0')} / 21 · ${d[1]}</div><h1 style="font-size:42px">${d[0]}</h1></div><button class="secondary" id="all">All days ↗</button></div><div class="session"><div class="session-main"><div class="steps" aria-label="Step ${step+1} of 4">${[0,1,2,3].map(i=>`<span class="${i<=step?'on':''}"></span>`).join('')}</div>${step===0?scene(d):step===1?practice(d,l):step===2?experiment(d,l):review(d,l)}<div class="actions">${step>0?'<button class="secondary" id="back">← Back</button>':''}${step<3?`<button class="primary" id="next">${['Try the practice','Make my experiment','Record what happened'][step]} →</button>`:`<button class="primary" id="complete">${l.complete?'Save my updated observation':'Save this day'} ✓</button>`}</div></div><aside class="panel aside"><div class="eyebrow">YOUR JOURNEY</div><h2>${count()} <span class="muted" style="font-size:16px">/ 21 recorded</span></h2><div class="meter"><i style="width:${count()/21*100}%"></i></div><p>Progress means trying, observing and adjusting. A difficult day still contains useful information.</p><hr style="border:0;border-top:1px solid var(--line)"><h3>Today's science</h3><p>${d[10]}</p><a href="${src.url}" target="_blank" rel="noopener" style="font-size:12px">${src.name} ↗</a><p class="hint">${src.note}</p><p class="notice">Examples are illustrative. Your history, resources and circumstances may be different. Stop an exercise if it increases distress; seek qualified support for persistent difficulties.</p></aside></div>`;document.getElementById('all').onclick=()=>navigate('journey');document.getElementById('next')?.addEventListener('click',()=>{persistFields();clearInterval(timer);step++;render()});document.getElementById('back')?.addEventListener('click',()=>{persistFields();clearInterval(timer);step--;render()});document.getElementById('complete')?.addEventListener('click',()=>{persistFields();const l=log();if(!l.result){toast('Choose what happened; “not tried yet” is welcome too.');return}l.complete=true;l.recordedAt=new Date().toISOString();save();toast('Observation saved. Keep practising at your own pace.');navigate('progress')});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});document.getElementById('timer')?.addEventListener('click',runTimer)}
function scene(d){const flex=mode==='flexible';return `<div class="scene"><div class="scene-top"><span class="eyebrow">01 / SEE THE MOMENT</span><span class="badge">ILLUSTRATIVE SCENE</span></div><h3>${d[2]}</h3><div class="mode" role="group" aria-label="Compare responses"><button data-mode="automatic" class="${!flex?'on':''}">Automatic</button><button data-mode="flexible" class="${flex?'on':''}">More choice</button></div><div class="scene-display"><div class="scene-person">${person()}</div><div class="thought ${flex?'flexible':''}"><span class="eyebrow">${flex?'A PRACTISED ALTERNATIVE':'THE LEARNED STORY'}</span><blockquote>“${d[flex?4:3]}”</blockquote><p>${flex?'The emotion may still be present. A pause makes another action possible.':'This response may have served a purpose. Notice its short-term payoff and longer-term cost.'}</p></div></div><div class="flow"><div><small>The loop</small><p>${d[5]}</p></div><div><small>Possible influences</small><p>${d[6]}</p></div><div><small>A condition to change</small><p>${d[8]}</p></div></div></div><p class="hint">These paths show possibilities, not a prediction of your life. Change rarely follows a straight line.</p>`}
function practice(d,l){return `<div class="panel"><div class="eyebrow">02 / PRACTISE THE SPACE</div><h2>${d[10]}</h2><p style="font-size:18px;color:var(--text)">${d[7]}</p><div class="timer"><strong id="clock" aria-live="polite">0:30</strong><p>Optional pause · eyes open · breathe normally</p><button class="secondary" id="timer">Start a 30-second pause</button></div><label for="trigger">One trigger from your own life (optional)</label><input id="trigger" data-field="trigger" placeholder="For example: seeing a notification while working" value="${esc(l.trigger)}"><label for="story">The story or urge I notice (optional)</label><input id="story" data-field="story" placeholder="For example: I have to respond immediately" value="${esc(l.story)}"><p class="hint">You can skip the timer and written fields. Orient to your surroundings if focusing inward feels uncomfortable.</p></div>`}
function experiment(d,l){return `<div class="panel"><div class="eyebrow">03 / TRY IT IN LIFE</div><h2>One small experiment.</h2><p>Choose something safe, specific and realistic. Practise in a low-stakes situation first.</p><label for="value">A direction that matters to me</label><select id="value" data-field="value">${['Care','Curiosity','Integrity','Connection','Health','Learning','Creativity','Independence'].map(v=>`<option ${v===(l.value||state.value)?'selected':''}>${v}</option>`).join('')}</select><label for="plan">My if–then plan</label><textarea id="plan" data-field="plan">${esc(l.plan||d[9])}</textarea><label for="condition">One condition I can change</label><textarea id="condition" data-field="condition">${esc(l.condition||d[8])}</textarea><label for="small">My fallback on a difficult day (optional)</label><input id="small" data-field="small" value="${esc(l.small)}" placeholder="For example: just notice the urge once"><p class="notice">Personal practice cannot remove unsafe conditions, poverty or discrimination. A helpful next action may be seeking support or making a collective change.</p></div>`}
function review(d,l){return `<div class="panel"><div class="eyebrow">04 / OBSERVE, DON'T GRADE</div><h2>What happened in real life?</h2><p>You can save your plan now and return after trying it. The app cannot verify behaviour or measure neural change.</p><label>My experiment</label><p style="color:var(--text)">${esc(l.plan||d[9])}</p><label>Did I try my chosen action?</label><div class="choice" data-group="result">${['Not tried yet','Tried once','Tried more than once'].map(x=>`<button data-answer="${x}" class="${l.result===x?'on':''}">${x}</button>`).join('')}</div><label>Did I notice the pattern before acting?</label><div class="choice" data-group="noticed">${['Not yet','Sometimes','Often','Not applicable'].map(x=>`<button data-answer="${x}" class="${l.noticed===x?'on':''}">${x}</button>`).join('')}</div><label>How did the alternative work for me?</label><div class="choice" data-group="helped">${['Not assessed','Unhelpful','Mixed','Helpful'].map(x=>`<button data-answer="${x}" class="${l.helped===x?'on':''}">${x}</button>`).join('')}</div><label for="observation">What I observed / what I will adjust (optional)</label><textarea id="observation" data-field="observation" placeholder="What helped? What made it hard?">${esc(l.observation)}</textarea></div>`}
function persistFields(){document.querySelectorAll('[data-field]').forEach(x=>log()[x.dataset.field]=x.value);save()}function runTimer(){if(timer){clearInterval(timer);timer=null;document.getElementById('timer').textContent='Resume pause';return}if(seconds<=0)seconds=30;document.getElementById('timer').textContent='Pause timer';timer=setInterval(()=>{seconds--;const c=document.getElementById('clock');if(c)c.textContent='0:'+String(seconds).padStart(2,'0');if(seconds<=0){clearInterval(timer);timer=null;seconds=30;document.getElementById('timer').textContent='Repeat pause';toast('Pause complete. Choose what happens next.')}},1000)}
function progress(){const logs=Object.entries(state.logs).filter(([n,l])=>l.complete),tried=logs.filter(([n,l])=>l.result!=='Not tried yet'),helpful=tried.filter(([n,l])=>l.helped==='Helpful');app.innerHTML=`<div class="eyebrow">YOUR PERSONAL FIELD NOTES</div><h1>Change you can observe.</h1><p>These are your own reports, not clinical scores. Look for useful patterns over time. More entries do not automatically mean more improvement.</p><div class="report"><div class="panel"><div class="metric">${logs.length}</div><p>Days with an observation</p></div><div class="panel"><div class="metric">${tried.length}</div><p>Days you reported trying an action</p></div><div class="panel"><div class="metric">${helpful.length}</div><p>Tried days you described as helpful</p></div></div><div class="sectionhead"><h2>Your experiments</h2><button class="secondary" id="continue">Continue practice →</button></div>${logs.length?logs.map(([n,l])=>`<div class="log"><span class="eyebrow">DAY ${n} · ${esc(l.result)}</span><strong>${curriculum[n-1][0]}</strong><p>${esc(l.plan||curriculum[n-1][9])}</p><p>Noticed before acting: ${esc(l.noticed||'Not recorded')} · Alternative: ${esc(l.helped||'Not assessed')}</p>${l.observation?`<p>${esc(l.observation)}</p>`:''}<button class="secondary" data-day="${n}">Revisit / update</button></div>`).join(''):'<div class="empty"><h3>Your first observation starts here.</h3><p>Try one encounter and record what happened. “Not tried yet” is also a useful starting point.</p></div>'}<div class="panel" style="margin-top:25px"><h3>Your next-week plan</h3><p>Keep one useful response. Choose a regular cue for practice. Identify support for conditions you cannot change alone.</p><label for="maintenance">My ongoing practice</label><textarea id="maintenance" placeholder="After… I will… If it gets difficult, I will…">${esc(state.maintenance)}</textarea><button class="secondary" id="keep" style="margin-top:15px">Save ongoing plan</button></div><div class="actions"><button class="secondary" id="export">Export my record</button><button class="secondary" id="import">Restore a record</button><input id="file" type="file" accept="application/json" hidden><button class="secondary" id="print">Print my report</button><button class="secondary" id="reset">Reset local data</button></div><p class="hint">Stored only in this browser. Clearing browser storage removes your record. Export a backup to keep it or move devices.</p>`;document.getElementById('continue').onclick=()=>{state.started=true;state.day=curriculum.findIndex((d,i)=>!state.logs[i+1]?.complete)+1||21;save();navigate('today')};document.getElementById('keep').onclick=()=>{state.maintenance=document.getElementById('maintenance').value;save();toast('Ongoing plan saved')};document.getElementById('export').onclick=()=>{const a=document.createElement('a');const url=URL.createObjectURL(new Blob([JSON.stringify({format:'the-loop-21',version:1,state},null,2)],{type:'application/json'}));a.href=url;a.download='the-loop-my-practice.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(data.format!=='the-loop-21'||data.version!==1||!data.state||typeof data.state.logs!=='object'||Array.isArray(data.state.logs)||!Number.isInteger(data.state.day)||data.state.day<1||data.state.day>21)throw Error();const clean={day:data.state.day,started:!!data.state.started,logs:{},value:'Care',maintenance:String(data.state.maintenance||'').slice(0,10000)};for(const [n,l] of Object.entries(data.state.logs)){if(!/^([1-9]|1[0-9]|2[01])$/.test(n)||!l||typeof l!=='object')continue;clean.logs[n]={complete:l.complete===true,encounterSeen:l.encounterSeen===true};for(const k of ['trigger','story','plan','condition','value','small','result','noticed','helped','observation','recordedAt','encounterAt'])if(typeof l[k]==='string')clean.logs[n][k]=l[k].slice(0,10000)}if(!confirm('Replace this browser’s current record with the imported record?'))return;state=clean;save();render();toast('Record restored')}catch{toast('This is not a valid Loop practice record.')}};document.getElementById('print').onclick=()=>window.print();document.getElementById('reset').onclick=()=>{if(confirm('Delete all practice data in this browser? Export first if you want to keep it.')){state={day:1,logs:{},value:'Care'};save();navigate('today')}}}
function science(){app.innerHTML=`<div class="eyebrow">EVIDENCE, WITHOUT THE HYPE</div><h1>Learned does<br>not mean inevitable.</h1><div class="panel"><h2>What this tool aims to do</h2><p>Help you recognise learned reactions, examine interpretations, practise personally meaningful actions and adjust environmental cues. It combines educational adaptations of established approaches. This particular 21-day programme has not been clinically validated.</p><h3>What “escape the matrix” means here</h3><p>A metaphor for noticing habits, social expectations and incentives. It does not mean reality is a simulation or that everyone is controlled by a single hidden system. A completely unconditioned mind is not an established scientific endpoint. Useful habits and learning remain part of human life.</p><h3>Why 21 days?</h3><p>Twenty-one encounters provide a manageable learning sequence. Habit change varies across people, actions and environments. There is no promise of permanent transformation in 21 days.</p><h3>What an outcome looks like</h3><p>A specific behaviour you tried, a pattern you noticed, or a practical condition you changed. Your reports cannot establish causation or measure brain rewiring. To establish product effectiveness, the programme itself would need an appropriate evaluation against a comparison condition.</p><h3>Practise safely</h3><p>This is an educational self-help tool, not diagnosis or treatment. Use low-stakes examples; do not use exercises to confront unsafe situations or deliberately relive traumatic experiences. Grounding and mindfulness are optional. If practice increases distress, stop and use an external activity that feels steadying. Persistent or severe difficulties deserve qualified support.</p></div><div class="sectionhead"><h2>Read the foundations</h2><span class="badge">DIRECT SOURCES</span></div><ul class="sources">${Object.values(sources).map(s=>`<li><a target="_blank" rel="noopener" href="${s.url}">${s.name} ↗</a><br>${s.note}</li>`).join const themeKnowledge=[
['I cannot stop scrolling','Interest, boredom, anticipation','A cue can become linked to checking through repetition. Immediate stimulation can make stopping harder. This is a possible pattern, not a diagnosis.','Just one more will give me what I need.','I can notice the pull and finish the action I intended.','Notice the next urge before touching the screen. Look up and name one thing in the room.','habit'],
['My thoughts keep looping','Anxiety, regret, uncertainty','Replaying can feel like problem-solving while adding no new information. Distinguish a practical issue from a repeated hypothetical question.','If I think about this long enough I will become certain.','Some uncertainty can remain while I take a useful action.','Say silently: I am noticing a repeating thought. Ask whether there is a practical step available now.','worry'],
['I cannot begin','Fear, frustration, anticipated shame','Avoiding an uncomfortable task may give immediate relief, making avoidance familiar. Unclear instructions and missing resources also matter.','I must feel ready or finish everything before starting.','A small clear step can come before confidence.','Find the first visible action. Mentally rehearse doing only that step.','cbt'],
['My attention keeps breaking','Interest, urgency, apprehension','Repeated alerts can cue checking. The pressure to be constantly available may also come from genuine expectations.','Every notification deserves an immediate response.','I can distinguish urgent contact from an interrupting cue.','Let one nonurgent urge pass before checking; return to the last sentence or action.','habit'],
['My phone takes my sleep time','Enjoyment, loneliness, tiredness','Immediate enjoyment can compete with a delayed need for rest. Sleep opportunity depends on schedules and responsibilities too.','This is my only personal time; I cannot stop yet.','I can protect rest and seek a realistic place for personal time.','Choose the next stopping point and picture where the phone will go. No breathing technique is required.','sleep'],
['Everyone seems ahead','Envy, shame, admiration','A selective social comparison can become a global judgement about worth. Envy may also reveal a wish worth examining.','Their success proves I am failing.','Their visible moment does not measure my whole life.','Notice the comparison and identify one thing you genuinely value today.','who'],
['Guilt keeps me stuck','Guilt, shame, disappointment','A specific missed action can become a global self-attack. Useful guilt may support repair; prolonged punishment may delay it.','I ruined the day, so there is no point restarting.','I can repair one action without condemning my whole self.','Describe the event without an insult. Identify the smallest realistic repair.','cbt'],

['A deadline makes me freeze','Fear, apprehension, uncertainty','Anticipated consequences can capture attention and make approaching the task difficult. A brief grounding practice may help re-engagement.','This feeling means I cannot handle the next step.','A feeling can be present while I approach a manageable step.','Look around, notice three objects and feel contact with the floor. Breathe normally; stop if uncomfortable.','who'],
['I keep checking for a reply','Fear, longing, insecurity','Checking may briefly reduce uncertainty, then renew the urge. Silence alone does not establish what another person thinks.','No reply means I am unimportant.','I do not yet know what the delay means.','Separate the observable fact from the interpretation. Choose a reasonable next checking point.','cbt'],

['I am depleted','Frustration, sadness, numbness or fatigue','Exhaustion is a state, not a moral defect. Workload, sleep, care demands and health can affect capacity.','I should override my limits to prove my worth.','Capacity and support belong in the plan.','Notice your available capacity. Identify one demand to reduce or one source of practical support.','context'],
['Expectations crowd out my wishes','Guilt, fear, loyalty, resentment','Belonging and obligation can shape choices. A useful examination considers personal values alongside real constraints.','Disagreeing means I am a bad person.','I can examine options while respecting relationships and safety.','Silently name one personally important direction and one real constraint. Both deserve consideration.','who'],
['I cannot switch off','Anxiety, responsibility, restlessness','Unfinished demands can keep attention engaged. Role expectations and actual availability requirements also matter.','If I stop thinking about it, I am irresponsible.','A realistic handover or next-step plan can support a boundary.','Name the next practical step and when it belongs. Orient to the activity in front of you.','plan'],

sources.worry={name:'NHS · Tackling your worries',url:'https://www.nhs.uk/every-mind-matters/mental-wellbeing-tips/self-help-cbt-techniques/tackling-your-worries/',note:'Separating practical problems from hypothetical worries and returning to the present. This brief adaptation has not been independently tested.'};

state.context=contexts.some(c=>c.id===state.context)?state.context:'study';state.scenarioLogs=state.scenarioLogs||{};let lens='moment',response='automatic',quick=false,quickStep=0,libraryFilter='',practiceRunning=false,practiceRemaining=30,practiceClock=null;

function tile(s){const record=state.scenarioLogs[s.id];return `<button class="day scenario-card" data-scenario="${s.id}"><small>DAY ${String(s.day).padStart(2,'0')} · ${record?.visited?'VISITED':s.emotions.split(',')[0].toUpperCase()}</small><h3>${s.title}</h3><p>${s.scene}</p><span class="card-link">Explore this moment ↗</span></button>`}

today=function(){adapt();if(state.started){session();return}app.innerHTML=`<div class="hero"><div><div class="tag"><i class="dot"></i>105 HUMAN MOMENTS · 21 THEMES · 5 CONTEXTS</div><h1>Understand yourself.<br>Recover choice.<br><span style="color:var(--lime)">Act with care.</span></h1><p>When life feels difficult, begin with the moment you are in. Understand the feeling, recognise a possible pattern and find one realistic next action.</p><div class="actions"><button class="primary" id="beginAdaptive">My 21-day journey ↗</button><button class="secondary" id="helpImmediate">Help me now</button></div><p class="hint">No required writing · Context stays on this device · Science-informed</p></div>${art()}</div>${contextControls()}<div class="sectionhead"><h2>What is happening right now?</h2><span class="badge">A RELEVANT STARTING POINT</span></div><div class="grid">${[1,2,3,8,11,15].map(n=>tile(scenarioLibrary.find(s=>s.day===n&&s.context===state.context))).join('')}</div><div class="strip"><div><strong>Understand</strong><span>The feeling and possible learned pattern.</span></div><div><strong>Rehearse</strong><span>A response you can use.</span></div><div><strong>Change conditions</strong><span>Practical support matters too.</span></div></div><p class="notice">This is a broad educational library, not a solution to every mental health condition. Emotions are not moral grades. “Matrix” is a metaphor for learned habits and social influences.</p>`;document.getElementById('beginAdaptive').onclick=()=>openScenario(state.day);document.getElementById('helpImmediate').onclick=showQuickMenu;wireContext();wireScenarios()}
function showQuickMenu(){stopAdaptive();tab='today';app.innerHTML=`<div class="eyebrow">HELP WITH THIS MOMENT</div><h1>One practical next step.</h1><p>Choose what fits. Each opens a brief guided sequence, followed by a useful action. No daily lesson is required.</p>${contextControls()}<div class="grid">${[1,2,3,8,9,11,12,15,19,20].map(n=>{const s=scenarioLibrary.find(x=>x.day===n&&x.context===state.context);return tile(s).replace('data-scenario=', 'data-quick="true" data-scenario=')}).join('')}</div><div class="actions"><button class="secondary" id="returnPractice">Back to practice</button></div><p class="notice">If you are in immediate danger, prioritise getting to safety and contacting local emergency services or a trusted person. This practice cannot make an unsafe situation safe.</p>`;wireContext(showQuickMenu);wireScenarios();document.getElementById('returnPractice').onclick=()=>navigate('today')}
session=function(){adapt();if(quick){quickView();return}const s=selected(),src=sources[s.source],r=state.scenarioLogs[s.id]||{};phase=response==='automatic'?0:2;app.innerHTML=`<div class="sectionhead"><div><div class="eyebrow">DAY ${state.day} / 21 · ${contexts.find(c=>c.id===state.context).label}</div><h1 style="font-size:clamp(30px,4vw,44px)">${s.title}</h1></div><button class="secondary" id="now">Help me now ↗</button></div>${contextControls()}<div class="session"><section><div class="lens-tabs" role="group" aria-label="Encounter layers">${[['moment','The moment'],['understand','Understand'],['practice','Rehearse'],['conditions','Change conditions']].map(([id,label])=>`<button data-lens="${id}" class="${lens===id?'selected':''}" aria-pressed="${lens===id}">${label}</button>`).join('')}</div>${lens==='moment'?momentView(s):lens==='understand'?understandView(s):lens==='practice'?rehearseView(s):conditionsView(s)}<div class="actions"><button class="primary" id="mainNext">${lens==='moment'?'Understand the pattern →':lens==='understand'?'Rehearse another response →':lens==='practice'?'Find practical support →':'Keep this action ✓'}</button><button class="secondary" id="readAloud">Listen to this section ▷</button></div></section><aside class="panel aside"><div class="eyebrow">ONE ACTION FOR REAL LIFE</div><h3 style="line-height:1.7">${s.action}</h3><p class="hint">You do not have to feel positive before taking a helpful action. Trying, adapting or seeking support are all valid directions.</p><details><summary>Scientific foundation</summary><p class="hint">${src.note}</p><a href="${src.url}" target="_blank" rel="noopener">${src.name} ↗</a><p class="hint">Scenario advice is an educational adaptation. Individual results and needs vary.</p></details><hr style="border:0;border-top:1px solid var(--line);margin:23px 0"><div class="eyebrow">OPTIONAL REAL-WORLD OBSERVATION</div><p class="hint">After trying the action, one tap is enough. Viewing a scene is recorded separately.</p><div class="choice">${['Helpful','Mixed','Unhelpful'].map(v=>`<button data-real="${v}" class="${r.outcome===v?'on':''}">${v}</button>`).join('')}</div><p class="notice">Use safe, low-stakes examples. Stop if distress increases. Persistent or severe difficulties deserve qualified support.</p></aside></div>`;wireContext(()=>{response='automatic';render()});document.getElementById('now').onclick=showQuickMenu;document.querySelectorAll('[data-lens]').forEach(b=>b.onclick=()=>{stopAdaptive();lens=b.dataset.lens;render()});document.getElementById('mainNext').onclick=()=>{stopAdaptive();if(lens==='conditions'){markVisited();return}lens={moment:'understand',understand:'practice',practice:'conditions'}[lens];render()};document.getElementById('readAloud').onclick=()=>readText(sectionText(s));document.querySelectorAll('[data-response]').forEach(b=>b.onclick=()=>{response=b.dataset.response;render()});document.getElementById('practicePause')?.addEventListener('click',practiceTimer);document.querySelectorAll('[data-real]').forEach(b=>b.onclick=()=>recordOutcome(b.dataset.real));}
function momentView(s){return `<div class="scene"><div class="scene-top"><span class="eyebrow">A SPECIFIC HUMAN MOMENT</span><span class="badge">ILLUSTRATIVE SCENE</span></div><h3 style="line-height:1.7">${s.scene}</h3><div class="mode"><button data-response="automatic" class="${response==='automatic'?'on':''}">Automatic response</button><button data-response="flexible" class="${response==='flexible'?'on':''}">A practised alternative</button></div>${sceneSVG()}<div class="thought ${response==='flexible'?'flexible':''}" style="margin-top:22px"><span class="eyebrow">${response==='flexible'?'ANOTHER POSSIBLE RESPONSE':'A POSSIBLE LEARNED STORY'}</span><blockquote>“${response==='flexible'?s.alternative:s.story}”</blockquote><p>${response==='flexible'?s.action:'The response may offer short-term relief or protection. Whether it helps now depends on the situation.'}</p></div></div>`}
function understandView(s){return `<div class="panel"><div class="eyebrow">FEELING · MEANING · LEARNING · CONTEXT</div><h2>Understand without blaming.</h2><div class="knowledge-row"><strong>Possible feelings</strong><p>${s.emotions}. These are examples, not an assessment of you.</p></div><div class="knowledge-row"><strong>Possible learned story</strong><p>“${s.story}”</p></div><div class="knowledge-row"><strong>How the loop may persist</strong><p>${s.mechanism}</p></div><div class="knowledge-row"><strong>What to check</strong><p>Is there an immediate danger or a practical demand? What is directly observed, and what is an interpretation? What resources or support are missing?</p></div><div class="knowledge-row"><strong>A broader view</strong><p>Your response exists within a body, a learning history, relationships and material circumstances. An explanation is not a fault or a fixed identity.</p></div><a href="${sources.thought.url}" target="_blank" rel="noopener">Explore examining thoughts ↗</a></div>`}
function rehearseView(s){return `<div class="panel"><div class="eyebrow">ONE GUIDED REHEARSAL</div><h2>Make the next action familiar.</h2><p class="large-copy">${s.practice}</p><div class="timer"><strong id="practiceClock">0:30</strong><button class="secondary" id="practicePause">Optional 30-second practice ▷</button></div><div class="rehearsal"><span class="eyebrow">THEN REHEARSE THIS ACTION</span><p>${s.action}</p></div><p>Imagine the relevant moment arriving. Mentally rehearse the first small action. You can keep your eyes open and skip the timer.</p><p class="notice">This is an invitation to practise, not an instruction to confront danger or deliberately revisit traumatic experiences.</p></div>`}
function conditionsView(s){return `<div class="panel"><div class="eyebrow">PERSONAL CHOICE + PRACTICAL CONDITIONS</div><h2>You do not have to carry it alone.</h2><p class="large-copy">${s.condition}</p><div class="knowledge-row"><strong>What I can control</strong><p>A small action, an accessible cue or the way I ask for help.</p></div><div class="knowledge-row"><strong>What I may influence</strong><p>An agreement, workload decision, shared responsibility or available support.</p></div><div class="knowledge-row"><strong>What needs outside support</strong><p>Unsafe conditions, coercion, lack of resources or persistent difficulties. These are not solved by demanding better thoughts.</p></div><p class="notice">A helpful response can be seeking support, setting a safe boundary or making a collective change. It does not always mean becoming calmer.</p></div>`}
function sectionText(s){return lens==='moment'?s.scene+' '+(response==='automatic'?s.story:s.alternative+' '+s.action):lens==='understand'?s.emotions+'. '+s.mechanism:lens==='practice'?s.practice+' '+s.action:s.condition}
function readText(text){if(!narrator()){toast('Narration is unavailable; all guidance remains visible.');return}narrator().cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.86;u.lang='en';narrator().speak(u)}
function practiceTimer(){if(practiceRunning){clearInterval(practiceClock);practiceRunning=false;document.getElementById('practicePause').textContent='Resume practice ▷';return}practiceRunning=true;document.getElementById('practicePause').textContent='Pause Ⅱ';practiceClock=setInterval(()=>{practiceRemaining--;document.getElementById('practiceClock').textContent='0:'+String(practiceRemaining).padStart(2,'0');if(practiceRemaining<=0){clearInterval(practiceClock);practiceRunning=false;practiceRemaining=30;document.getElementById('practicePause').textContent='Repeat practice ▷';toast('Practice complete. Try the action when it is relevant.')}},1000)}
function recordOutcome(v){const s=selected();state.scenarioLogs[s.id]={...state.scenarioLogs[s.id],attempted:true,outcome:v,updatedAt:new Date().toISOString()};save();toast('Real-world observation saved');render()}
function markVisited(){const s=selected();state.scenarioLogs[s.id]={...state.scenarioLogs[s.id],visited:true,visitedAt:new Date().toISOString()};save();app.innerHTML=`<div class="finish-view"><div class="eyebrow">${contexts.find(c=>c.id===s.context).label} · DAY ${s.day}</div><div class="finish-symbol">↗</div><h1>One useful action.<br>In your actual life.</h1><p class="takeaway">${s.action}</p><p>${s.condition}</p><div class="actions center"><button class="primary" id="finishAdaptive">Done for now ✓</button><button class="secondary" id="shareAdaptive">Share this scenario ↗</button></div><p class="hint">Visited is not the same as tried. Return for an optional one-tap observation after using the action.</p></div>`;document.getElementById('finishAdaptive').onclick=()=>navigate('progress');document.getElementById('shareAdaptive').onclick=shareScenario}
async function shareScenario(){const s=selected(),url=new URL(location.href);url.search='';url.hash=`scenario=${s.id}`;try{if(navigator.share)await navigator.share({title:'THE LOOP · '+s.title,text:s.action,url:url.href});else if(navigator.clipboard){await navigator.clipboard.writeText(s.action+'\n'+url.href);toast('Scenario link copied. Site access permissions still apply.')}else prompt('Copy this scenario link:',url.href)}catch(e){if(e.name!=='AbortError')toast('Sharing unavailable. Copy the page link instead.')}}
function quickView(){const s=selected(),texts=['Look around and orient to where you are. If there is an immediate threat, prioritise safety and real-world support.',s.practice,s.action,s.condition];app.innerHTML=`<div class="finish-view"><div class="eyebrow">HELP ME NOW · ${contexts.find(c=>c.id===s.context).label}</div><h1 style="font-size:42px">${s.title}</h1><div class="steps">${texts.map((t,i)=>`<span class="${i<=quickStep?'on':''}"></span>`).join('')}</div><div class="panel quick-panel"><div class="eyebrow">${['ORIENT','MAKE SOME SPACE','ONE NEXT ACTION','SUPPORTING CONDITIONS'][quickStep]}</div><p class="takeaway">${texts[quickStep]}</p><div class="actions center"><button class="primary" id="quickNext">${quickStep===3?'Keep this action ✓':'Continue →'}</button><button class="secondary" id="quickListen">Listen ▷</button></div></div><div class="actions center"><button class="secondary" id="quickDeep">Understand this pattern</button><button class="secondary" id="quickOther">Choose another moment</button></div><p class="hint">Go at your own pace. Stop if discomfort increases. This is educational support, not emergency care or treatment.</p></div>`;document.getElementById('quickNext').onclick=()=>{stopAdaptive();if(quickStep===3)markVisited();else{quickStep++;quickView()}};document.getElementById('quickListen').onclick=()=>readText(texts[quickStep]);document.getElementById('quickDeep').onclick=()=>{quick=false;lens='understand';render()};document.getElementById('quickOther').onclick=showQuickMenu}
journey=function(){app.innerHTML=`<div class="eyebrow">21 THEMES × 5 LIFE CONTEXTS</div><h1>Your life changes.<br>Your scenario can too.</h1><p>Five scenarios are available for each theme. Choose the one relevant to your current situation; there is no requirement to complete all five in a day.</p>${contextControls()}<label for="scenarioSearch">Find a problem or situation (optional)</label><input type="search" id="scenarioSearch" placeholder="Try exam, sleep, anger, messages…" value="${esc(libraryFilter)}"><div id="scenarioResults"></div><p class="notice">Twenty-one days is a learning structure. No fixed deadline is promised for changing habits or emotional responses.</p>`;wireContext();document.getElementById('scenarioSearch').oninput=e=>{libraryFilter=e.target.value;renderResults()};renderResults()}
function renderResults(){const match=scenarioLibrary.filter(s=>s.context===state.context&&`${s.title} ${s.scene} ${s.emotions}`.toLowerCase().includes(libraryFilter.toLowerCase()));document.getElementById('scenarioResults').innerHTML=`<div class="sectionhead"><h2>${match.length} relevant scenarios</h2><span class="badge">105 IN THE COMPLETE LIBRARY</span></div><div class="grid">${match.map(tile).join('')}</div>${match.length?'':'<p>No exact match. Try another word or context; this library does not cover every human situation.</p>'}`;wireScenarios()}
function emotionsView(){stopAdaptive();app.innerHTML=`<div class="eyebrow">A WORKING MAP · NOT AN EXHAUSTIVE TAXONOMY</div><h1>Understand the feeling.<br>Choose the response.</h1><p>Emotions overlap, change with context and can serve different functions. Pleasant does not always mean helpful; uncomfortable does not always mean harmful. These families are an educational organising framework, not a validated diagnostic model.</p><div class="emotion-grid">${emotionFamilies.map(([name,examples,meaning,learning,action])=>`<details class="panel"><summary>${name}</summary><span class="badge">${examples}</span><p>${meaning}</p><h3>A possible learned pattern</h3><p>${learning}</p><h3>A useful direction to explore</h3><p>${action}</p></details>`).join('')}</div><div class="panel" style="margin-top:22px"><h3>Mixed feelings and other states</h3><p>Love and anger can coexist. Relief and grief can coexist. Fatigue, overwhelm and numbness deserve attention without being reduced to a single emotion. Your context matters more than finding a perfect label.</p><h3>Where can change happen?</h3><p>A person may change an accessible situation, modify a cue, redirect attention, examine an interpretation or choose a response. The useful point depends on context; regulating emotion does not require suppressing every difficult feeling.</p><a href="${sources.regulation.url}" target="_blank" rel="noopener">Emotion regulation research ↗</a><p class="hint">${sources.emotionResearch.note}</p><a href="${sources.emotionResearch.url}" target="_blank" rel="noopener">Read the emotion study ↗</a><h3>What can be learned?</h3><p>Experiences can shape associations, expectations and familiar responses. The same emotion can lead to different actions. A possible loop is event → meaning and feeling → action → immediate consequence → learning. This is a simplified explanatory model; it is not a brain scan or an account of every cause.</p></div>`}
science=function(){originalScience();app.innerHTML=`<div class="actions" style="margin:0 0 25px"><button class="primary" id="emotionMap">Explore the emotional map ↗</button></div>`+app.innerHTML;document.getElementById('emotionMap').onclick=emotionsView}
progress=function(){const entries=Object.entries(state.scenarioLogs),visited=entries.filter(([id,r])=>r.visited),attempted=entries.filter(([id,r])=>r.attempted),next=Array.from({length:21},(_,i)=>i+1).find(n=>!state.scenarioLogs[`d${n}-${state.context}`]?.visited)||21;app.innerHTML=`<div class="eyebrow">OBSERVATIONS, NOT AN AWAKENING SCORE</div><h1>Notice what helps.<br>Keep your choices open.</h1><div class="report"><div class="panel"><div class="metric">${visited.length}</div><p>Distinct scenarios visited</p></div><div class="panel"><div class="metric">${attempted.length}</div><p>Scenarios with a reported attempt</p></div><div class="panel"><div class="metric">${attempted.filter(([id,r])=>r.outcome==='Helpful').length}</div><p>Attempted scenarios described as helpful</p></div></div><p>These are personal records, not clinical scores, proof of causation or measurements of neural change.</p>${contextControls()}<div class="actions"><button class="primary" id="resumeAdaptive">Next in this context: day ${next} →</button><button class="secondary" id="progressNow">Help me now</button></div><div class="sectionhead"><h2>Your saved moments</h2></div><div class="grid">${entries.filter(([id,r])=>r.visited||r.attempted).map(([id,r])=>{const s=scenarioLibrary.find(s=>s.id===id);return s?`<button class="day" data-scenario="${id}"><small>DAY ${s.day} · ${contexts.find(c=>c.id===s.context).label}</small><h3>${s.title}</h3><p>${r.visited?'Visited':'Not marked visited'} · ${r.attempted?'Reported attempt: '+esc(r.outcome):'No attempt reported'}</p></button>`:''}).join('')}</div>${entries.length?'':'<div class="empty">Start with one moment. Nothing needs to be written.</div>'}<div class="actions"><button class="secondary" id="exportAdaptive">Export all my records</button><button class="secondary" id="restoreAdaptive">Restore a backup</button><input id="adaptiveFile" type="file" accept="application/json" hidden><button class="secondary" id="previous">Earlier records</button><button class="secondary" id="printAdaptive">Print report</button><button class="secondary" id="clearAdaptive">Reset local data</button></div><p class="hint">Records remain in this browser. Export a backup before clearing storage or changing devices.</p>`;wireContext();wireScenarios();document.getElementById('resumeAdaptive').onclick=()=>openScenario(next);document.getElementById('progressNow').onclick=showQuickMenu;document.getElementById('previous').onclick=()=>{curriculum.forEach((d,i)=>d.splice(0,d.length,...baselineCurriculum[i]));legacyProgress();bind()};document.getElementById('printAdaptive').onclick=()=>window.print();document.getElementById('exportAdaptive').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({format:'the-loop-adaptive',version:3,state},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='the-loop-all-my-records.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('restoreAdaptive').onclick=()=>document.getElementById('adaptiveFile').click();document.getElementById('adaptiveFile').onchange=restoreAdaptive;document.getElementById('clearAdaptive').onclick=()=>{if(confirm('Delete all practice records on this browser? Export first to keep a copy.')){state={day:1,context:'study',logs:{},scenarioLogs:{},value:'Care'};save();navigate('today')}}}
async function restoreAdaptive(e){try{const file=e.target.files[0];if(!file||file.size>2000000)throw Error();const data=JSON.parse(await file.text());if(!['the-loop-adaptive','the-loop-21'].includes(data.format)||!data.state||!Number.isInteger(data.state.day)||data.state.day<1||data.state.day>21)throw Error();const clean={day:data.state.day,context:contexts.some(c=>c.id===data.state.context)?data.state.context:'study',logs:{},scenarioLogs:{},started:!!data.state.started,personalised:data.state.personalised===true,value:'Care',maintenance:String(data.state.maintenance||'').slice(0,10000)};for(const [id,r] of Object.entries(data.state.scenarioLogs||{})){if((!scenarioLibrary.some(s=>s.id===id)&&!/^original-([1-9]|1[0-9]|2[01])$/.test(id))||!r||typeof r!=='object')continue;clean.scenarioLogs[id]={visited:r.visited===true,attempted:r.attempted===true,outcome:['Helpful','Mixed','Unhelpful'].includes(r.outcome)?r.outcome:undefined};for(const k of ['visitedAt','updatedAt'])if(typeof r[k]==='string')clean.scenarioLogs[id][k]=r[k].slice(0,100)}for(const [n,r] of Object.entries(data.state.logs||{})){if(!/^([1-9]|1[0-9]|2[01])$/.test(n)||!r||typeof r!=='object')continue;clean.logs[n]={complete:r.complete===true,encounterSeen:r.encounterSeen===true};for(const k of ['trigger','story','plan','condition','value','small','result','noticed','helped','observation','recordedAt','encounterAt'])if(typeof r[k]==='string')clean.logs[n][k]=r[k].slice(0,10000)}if(!confirm('Replace the current browser record with this backup?'))return;state=clean;save();navigate('progress');toast('All records restored')}catch{toast('Not a valid Loop backup, or file too large.')}}

function applyScenarioHash(){const m=location.hash.match(/^#scenario=(d(?:[1-9]|1[0-9]|2[01])-(?:study|office|shift|home|life))$/);if(m){const s=scenarioLibrary.find(s=>s.id===m[1]);if(s)openScenario(s.day,s.context)}}
window.addEventListener('hashchange',applyScenarioHash);document.addEventListener('visibilitychange',()=>{if(document.hidden){stopAdaptive();const c=document.getElementById('practiceClock'),b=document.getElementById('practicePause');if(c)c.textContent='0:30';if(b)b.textContent='Optional 30-second practice ▷'}});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>navigate(b.dataset.tab));
const emotionNav=document.createElement('button');emotionNav.textContent='Emotions';emotionNav.onclick=()=>{tab='emotions';stopAdaptive();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.remove('active'));emotionsView()};document.querySelector('nav').appendChild(emotionNav);adapt();render();applyScenarioHash();

sceneSVG=function(){const s=selected();const category=s.context==='study'?'desk':s.context==='office'?'desk':s.context==='home'?'conversation':s.context==='shift'?'window':'phone';setScenes[s.day-1]=[5,15].includes(s.day)?'bedroom':category;let svg=illustrativeScene();const decor=s.context==='study'?'<g><rect x="359" y="236" width="84" height="11" rx="2" fill="#d6c89d"/><path d="M367 241H435" stroke="#8d8467"/><text x="357" y="260" fill="#b8c29b" font-size="10">PRACTICE NOTES</text></g>':s.context==='office'?'<g><rect x="454" y="103" width="67" height="46" rx="4" fill="#b3c397"/><path d="M464 116H508M464 128H497" stroke="#547353" stroke-width="3"/><text x="446" y="167" fill="#b8c29b" font-size="10">TASKS & PRIORITIES</text></g>':s.context==='shift'?'<g><circle cx="159" cy="77" r="24" fill="#b5c19a"/><path d="M159 59V77L170 84" stroke="#334c38" stroke-width="3"/><text x="106" y="117" fill="#b8c29b" font-size="10">PERMITTED PAUSE</text></g>':s.context==='home'?'<g><rect x="119" y="219" width="50" height="70" rx="5" fill="#778c64"/><path d="M129 233H158M129 245H153M129 257H158" stroke="#c2cd9e"/><text x="111" y="308" fill="#b8c29b" font-size="10">SHARED RESPONSIBILITIES</text></g>':'<g><path d="M127 130L140 98L152 130Z" fill="#819768"/><rect x="138" y="130" width="5" height="57" fill="#819768"/><text x="113" y="212" fill="#b8c29b" font-size="10">ROOM FOR CONNECTION</text></g>';return svg.replace('</svg>',decor+`<text x="28" y="25" fill="#d0deb6" font-size="10" letter-spacing="1">${esc(contexts.find(c=>c.id===s.context).place.toUpperCase())} · DAY ${s.day}</text></svg>`)};

</script><script>
/* Restore the first build's focused interaction, with optional depth. */
const detailedProgress=progress;let simpleStep=0;
function currentDay(){return state.personalised?curriculum[state.day-1]:baselineCurriculum[state.day-1]}
function applyDay(){if(state.personalised)adapt();else curriculum.forEach((d,i)=>d.splice(0,d.length,...baselineCurriculum[i]))}
function optionalSituation(){return `<details class="situation-drawer"><summary>Change my situation ↗</summary><div class="drawer-fields"><label for="simpleContext">Where does this happen?</label><select id="simpleContext">${contexts.map(c=>`<option value="${c.id}" ${c.id===state.context?'selected':''}>${c.label}</option>`).join('')}</select><label for="simpleProblem">What would help today?</label><select id="simpleProblem">${themeKnowledge.map((t,i)=>`<option value="${i+1}" ${state.day===i+1?'selected':''}>${t[0]}</option>`).join('')}</select><button class="secondary" id="applySituation">Use this situation →</button><button class="quiet" id="originalJourney">Use the original journey</button><p class="hint">One relevant scene from 105 possibilities. You can change this any time.</p></div></details>`}
function bindSituation(){document.getElementById('applySituation').onclick=()=>{stopAdaptive();state.context=document.getElementById('simpleContext').value;state.day=Number(document.getElementById('simpleProblem').value);state.personalised=true;state.started=true;simpleStep=0;mode='automatic';save();applyDay();render()};document.getElementById('originalJourney').onclick=()=>{state.personalised=false;simpleStep=0;save();applyDay();render()}}
navigate=function(t){stopAdaptive();clearInterval(timer);timer=null;seconds=30;simpleStep=0;mode='automatic';tab=t;applyDay();render();window.scrollTo({top:0,behavior:'instant'})};
today=function(){applyDay();if(state.started){session();return}app.innerHTML=`<div class="hero celebration-hero"><div><div class="tag"><i class="dot"></i>THE HUMAN JOURNEY · 21 DAYS OF GREATER CHOICE</div><h1>You learned<br>the loop.<br><span class="creative-text">Choose your<br>next chapter.</span></h1><p>Understand what shapes your reactions.<br>Make space for a different response.<br>Take one useful action into your life.</p><div class="actions"><button class="primary" id="simpleBegin">Begin my journey ↗</button><button class="secondary" id="simpleExplore">Explore the 21 days</button></div><p class="hint">A few minutes · No writing required · At your own pace</p></div><div class="creative-art">${art()}<div class="art-note">LEARNED DOES NOT MEAN FIXED.</div></div></div><div class="strip"><div><strong>01 / Notice</strong><span>See the pattern with curiosity.</span></div><div><strong>02 / Practise</strong><span>Make room for another response.</span></div><div><strong>03 / Live</strong><span>Try one small change in real life.</span></div></div><div class="sectionhead"><h2>Your first encounters</h2><span class="badge">SCIENCE-INFORMED · HUMAN-CENTRED</span></div><div class="grid">${dayCards(0,3)}</div>${optionalSituation()}<p class="notice">A learning experience for greater flexibility. No promise of perfect positivity, complete deconditioning or transformation in a fixed number of days.</p>`;document.getElementById('simpleBegin').onclick=()=>{state.started=true;state.startedAt=state.startedAt||new Date().toISOString();save();navigate('today')};document.getElementById('simpleExplore').onclick=()=>navigate('journey');bindSituation()};
session=function(){applyDay();const d=currentDay(),src=sources[d[11]],record=state.scenarioLogs[state.personalised?`d${state.day}-${state.context}`:`original-${state.day}`]||{};app.innerHTML=`<div class="sectionhead"><div><div class="eyebrow">DAY ${String(state.day).padStart(2,'0')} / 21 ${state.personalised?'· '+contexts.find(c=>c.id===state.context).label:''}</div><h1 style="font-size:clamp(32px,4.5vw,49px);margin-bottom:0">${d[0]}</h1></div><button class="secondary" id="simpleAll">All days ↗</button></div><div class="session simple-session"><section><div class="steps" aria-label="Step ${simpleStep+1} of 3">${[0,1,2].map(i=>`<span class="${i<=simpleStep?'on':''}"></span>`).join('')}</div>${simpleStep===0?scene(d):simpleStep===1?`<div class="panel practice-panel"><div class="eyebrow">02 / PRACTISE THE SPACE</div><h2>A moment for a different response.</h2><p class="large-copy">${d[7]}</p><div class="timer"><strong id="clock" aria-live="polite">0:30</strong><p>Optional pause · eyes open · breathe normally</p><button class="secondary" id="timer">Start a 30-second pause</button></div><p class="hint">No need to write anything. Skip the timer if you prefer. Stop if the exercise increases distress.</p></div>`:`<div class="panel takeaway-panel"><div class="eyebrow">03 / TAKE IT INTO YOUR LIFE</div><div class="takeaway-symbol">↗</div><h2>One small action is enough.</h2><p class="large-copy">${d[9]}</p><details><summary>Make the conditions support you</summary><p>${d[8]}</p></details><p class="hint">Try this when the relevant moment arrives. You do not need to feel perfectly calm or positive first.</p><details class="optional-observation"><summary>Optional: I tried this in real life</summary><div class="choice">${['Helpful','Mixed','Unhelpful'].map(v=>`<button data-simple-outcome="${v}" class="${record.outcome===v?'on':''}">${v}</button>`).join('')}</div><p class="hint">Your report is separate from viewing an encounter.</p></details></div>`}<div class="actions">${simpleStep?'<button class="secondary" id="simpleBack">← Back</button>':''}<button class="primary" id="simpleNext">${['Try the practice →','Take one action →','Done for today ✓'][simpleStep]}</button></div>${optionalSituation()}</section><aside class="panel aside simple-aside"><div class="eyebrow">A LITTLE MORE CHOICE</div><h3>Understand.<br>Practise.<br>Keep what helps.</h3><p>Useful change can be small. Difficult emotions can remain while you choose a helpful response.</p><details><summary>Why this may help ↗</summary><p class="hint">${src.note}</p><a href="${src.url}" target="_blank" rel="noopener">${src.name} ↗</a><p class="hint">This programme itself has not been clinically validated.</p></details><details><summary>When you need more support</summary><p class="hint">Unsafe conditions, persistent distress or insufficient resources may need practical or professional support. Personal practice cannot solve every circumstance.</p></details></aside></div>`;document.getElementById('simpleAll').onclick=()=>navigate('journey');document.getElementById('simpleNext').onclick=()=>{clearInterval(timer);timer=null;seconds=30;if(simpleStep<2){simpleStep++;render()}else{const key=state.personalised?`d${state.day}-${state.context}`:`original-${state.day}`;state.scenarioLogs[key]={...state.scenarioLogs[key],visited:true,visitedAt:new Date().toISOString()};save();toast('Encounter visited. Try the action when it matters.');navigate('progress')}};document.getElementById('simpleBack')?.addEventListener('click',()=>{clearInterval(timer);timer=null;seconds=30;simpleStep--;render()});document.getElementById('timer')?.addEventListener('click',runTimer);document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});document.querySelectorAll('[data-simple-outcome]').forEach(b=>b.onclick=()=>{const key=state.personalised?`d${state.day}-${state.context}`:`original-${state.day}`;state.scenarioLogs[key]={...state.scenarioLogs[key],attempted:true,outcome:b.dataset.simpleOutcome,updatedAt:new Date().toISOString()};save();toast('Observation saved');render()});bindSituation()};
journey=function(){applyDay();app.innerHTML=`<div class="eyebrow">YOUR FIELD GUIDE</div><h1>21 days.<br><span class="creative-text">A little more choice.</span></h1><p>One encounter at a time. Repeat any day that helps. No streak to protect and no deadline for changing your mind.</p>${[0,7,14].map((n,i)=>`<div class="sectionhead"><h2>${['01 / See the pattern','02 / Create a choice','03 / Live the practice'][i]}</h2><span class="muted">Days ${n+1}–${n+7}</span></div><div class="grid">${dayCards(n,n+7)}</div>`).join('')}${optionalSituation()}`;bindSituation()};
progress=function(){const all=Object.entries(state.scenarioLogs),visited=all.filter(([id,r])=>r.visited),attempted=all.filter(([id,r])=>r.attempted),next=Array.from({length:21},(_,i)=>i+1).find(n=>!state.scenarioLogs[state.personalised?`d${n}-${state.context}`:`original-${n}`]?.visited)||21;app.innerHTML=`<div class="eyebrow">YOUR JOURNEY</div><h1>Keep what helps.<br><span class="creative-text">Keep going gently.</span></h1><p>${visited.length} encounters visited · ${attempted.length} real-world attempts reported.<br>These are observations, not a score of your mind.</p><div class="actions"><button class="primary" id="simpleContinue">Continue with day ${next} →</button><button class="secondary" id="simpleReview">Explore any day</button></div><div class="sectionhead"><h2>Your recent moments</h2></div>${all.length?`<div class="grid">${all.slice(-6).reverse().map(([id,r])=>{const match=id.match(/^original-(\d+)$/),s=match?{day:+match[1],title:baselineCurriculum[+match[1]-1][0]}:scenarioLibrary.find(s=>s.id===id);return s?`<button class="day" data-simple-day="${s.day}" data-simple-id="${id}"><small>DAY ${s.day} · ${r.visited?'VISITED':'OBSERVATION'}</small><h3>${s.title}</h3><p>${r.attempted?'Reported attempt: '+esc(r.outcome):'No attempt reported'}</p></button>`:''}).join('')}</div>`:'<div class="empty">Your first encounter starts here. Nothing needs to be filled in.</div>'}<details class="situation-drawer"><summary>Earlier records, backups and data controls ↗</summary><p class="hint">All previous notes and scenario records remain available.</p><button class="secondary" id="simpleRecords">Open my records</button></details>`;document.getElementById('simpleContinue').onclick=()=>{state.day=next;state.started=true;save();navigate('today')};document.getElementById('simpleReview').onclick=()=>navigate('journey');document.getElementById('simpleRecords').onclick=()=>{detailedProgress();bind()};document.querySelectorAll('[data-simple-day]').forEach(b=>b.onclick=()=>{state.personalised=!b.dataset.simpleId.startsWith('original-');if(state.personalised)state.context=scenarioLibrary.find(s=>s.id===b.dataset.simpleId).context;state.day=+b.dataset.simpleDay;state.started=true;save();navigate('today')})};
// Keep advanced knowledge available through the existing science page, not the daily flow.
const emotionButton=document.querySelector('nav button:last-child');if(emotionButton&&!emotionButton.dataset.tab)emotionButton.remove();
state.personalised=state.personalised===true;applyDay();simpleStep=0;mode='automatic';tab='today';render();

</script><script>
// Focused content refinement; the established three-step interface stays intact.
const refinedOriginal=[
['You unlock your phone to check the time. A notification leads to a feed, and the task beside you waits.','I should check this before I do anything else.','I opened the phone for one reason. I can finish that and stop.','Look up from the screen. Say silently: what did I open this for? Finish that action and lock the phone.','When I unlock my phone without a clear purpose, I will pause before opening a feed.'],
['A message asking to talk arrives. Your chest tightens and you begin typing before knowing what the conversation is about.','This feeling means something bad is about to happen.','I feel alarmed. I can get more information before responding.','Feel the floor under your feet. Look at three objects. Rehearse: what would you like to talk about?','When a message makes me feel rushed, I will orient to the room before replying.'],
['A friend has not answered. You reopen the chat, then imagine what you did wrong.','Their silence proves they do not care.','There is no reply yet. I do not know why.','Name the observable fact: no reply yet. Name the interpretation separately. Return to one activity already in front of you.','When I interpret a delayed reply as rejection, I will separate the fact from my explanation before checking again.'],
['You consider an opportunity, then hear a familiar family rule in your mind: respectable people choose a different path.','If I disagree, I am letting everyone down.','I can respect my family and examine this expectation.','Rehearse: I understand why this matters to you. Here is what matters to me, and the option I want to explore. Use only where safe.','When an inherited rule decides for me, I will examine one realistic alternative before committing.'],
['After a tiring day, you scroll for relief. The next video starts while the rest you wanted keeps getting delayed.','This is the only way I can switch off.','I need a break. I can test another kind of rest.','Put the screen down briefly. Notice whether you want rest, novelty or contact. Try one accessible alternative before choosing more scrolling.','When I reach for a feed to recover after work, I will first try a brief screen-free pause.'],
['You are halfway through a paragraph when a notification appears. You open it and lose your place.','Every alert needs me immediately.','This can wait until I finish this paragraph.','Rehearse letting one nonurgent alert wait. Finish the current sentence or small task, then decide whether to check.','When a nonurgent notification interrupts a task, I will finish the current small step before checking.'],
['You planned to practise, but a difficult day passed without it. You think about abandoning the whole journey.','Missing a day means I have failed.','I can learn from what got in the way and restart smaller.','Name one barrier without blaming yourself. Rehearse the smallest version you could use at the next opportunity.','When I miss a practice, I will adjust one barrier and use a smaller version next time.'],
['A friend posts a success. You stop your own task and browse more profiles, feeling further behind.','Their achievement makes my effort meaningless.','I can admire them without using their life as my score.','Notice comparison. Say: this is one public moment. Return to one action connected to something you personally value.','When a success post pulls me into comparison, I will return to one personally meaningful action.'],
['Someone asks for a favour. You say yes immediately, then remember a deadline you already promised to meet.','A pause or a no will make them reject me.','I can check my capacity before committing.','Rehearse: let me check what I can manage and get back to you. Then practise one clear limit if appropriate.','When I receive a nonurgent request, I will check my existing commitments before agreeing.'],
['You open a task, feel discomfort, and close it for something easier. The relief lasts until you remember the task again.','I need to stop feeling this before I can begin.','I can feel uncomfortable and do one manageable step.','Name the feeling gently. Open the task and rehearse only its smallest safe first action. Do not demand that discomfort disappear.','When discomfort makes me avoid a manageable task, I will try its smallest safe step.'],
['You make one mistake. The thought I always ruin things appears, and you stop trying to correct it.','One error proves I am incapable.','This is one error. I can identify what needs correcting.','Describe the exact event without always or never. Rehearse one specific correction or request for clarification.','When I turn a mistake into a judgement of my whole self, I will name the specific event and one repair.'],
['Two activities compete for your evening. One looks impressive; the other matters to you but attracts little attention.','The impressive option must be the right one.','I can choose a direction I personally endorse.','Think of a value such as care, learning or integrity. Rehearse one small action that expresses it, within your real obligations.','When I choose between tasks, I will connect the next action to a value I personally endorse.'],
['A critical message arrives. You type a sharp reply and hover over send.','I must make them understand right now.','I can take the issue seriously without sending this immediately.','Leave the reply unsent. Rehearse: when this happened, this was the impact; here is my request. Return to the draft when ready.','When I want to send an angry reply, I will save a draft and revisit the request before sending.'],
['You notice an old pattern, but still act on it. You conclude that understanding it has changed nothing.','Noticing should have fixed this already.','Noticing and trying another response are different skills.','Recall one moment you noticed. Rehearse the alternative first action, then make its cue easier to recognise.','When I notice a familiar loop, I will practise one alternative instead of demanding immediate transformation.'],
['You want to practise, but an unpredictable day pushes the intention out of mind.','I need stronger motivation every morning.','I can connect a tiny action to an existing routine.','Choose a routine that actually happens. Rehearse: after that routine, I will do this one small action.','After an existing daily routine, I will practise one minute of a response I want to keep.'],
['After a short night, a small request feels unbearable. You blame your character while continuing to take on demands.','I should cope with everything regardless of capacity.','My current capacity matters. I may need rest or support.','Notice depletion without turning it into an identity. Rehearse one realistic request for relief or a reduction in demand.','When I am depleted, I will reduce one avoidable demand or ask for practical support before taking on more.'],
['A familiar trigger appears away from the app. You remember the lesson but fall back into your usual response.','I can only do this when I am calm.','I can try the smallest version in this real moment.','Picture a safe, low-stakes situation. Rehearse the first alternative action and what you will observe afterward.','When my chosen trigger appears in a low-stakes situation, I will try the smallest alternative and observe what happens.'],
['Several demands arrive at once. You think better discipline should make an impossible workload manageable.','This is entirely my failure to cope.','Some conditions need clarification or outside support.','Separate a small personal action from a demand that needs support. Rehearse asking which task should take priority.','When a demand exceeds my capacity or control, I will identify an appropriate source of practical support.'],
['During stress, an old habit returns. Shame makes you avoid the practice for the rest of the week.','I am back at zero.','A familiar response returned. I can restart at the next opportunity.','Describe the slip without an insult. Rehearse one small fallback action for the next difficult moment.','When an old habit returns, I will identify one cue and resume with a smaller action.'],
['You see a claim that fits your beliefs and begin sharing it before checking the source.','Agreeing with me makes it trustworthy.','I can check a claim even when I want it to be true.','Rehearse opening the original source, checking what it actually supports and noticing uncertainty before sharing.','When a claim fits my beliefs, I will check its source before sharing it.'],
['You reach the final day and hope you will never react automatically again. A difficult moment makes you doubt the whole experience.','Finishing should make me permanently free of old patterns.','I have practices I can keep adapting as life changes.','Choose one useful response, a cue that reminds you and a fallback for difficult days. Rehearse those three together.','When a familiar pattern returns, I will use one small response and adjust the conditions that support it.']
];
refinedOriginal.forEach((r,i)=>{const d=baselineCurriculum[i];[d[2],d[3],d[4],d[7],d[9]]=r});
const triggerCues=['I notice myself continuing a feed','a thought starts repeating without new information','I postpone the first step','a nonurgent notification pulls my attention','my phone use delays the rest I intended','comparison makes me abandon my own task','self-blame stops me restarting','competing demands exceed my capacity','a deadline makes me freeze','I repeatedly check for a reply','I feel an urge to react in anger','I am asked to take on another commitment','criticism becomes a judgement of my worth','fear makes me avoid a safe beginner step','I notice depletion or unsafe fatigue','an expectation crowds out my own wishes','unfinished demands follow me into rest time','my screen interrupts a conversation','I want connection and reach for a feed','an old pattern returns during stress','I need to carry this practice forward'];
scenarioLibrary.forEach(s=>{s.directAction=s.action;s.action=`When ${triggerCues[s.day-1]}, I will try this: ${s.directAction.charAt(0).toLowerCase()+s.directAction.slice(1)}`});
const previousScene=scene;
scene=function(d){const s=state.personalised?selected():null,action=s?s.directAction:d[7];return `<div class="scene refined-scene"><div class="scene-top"><span class="eyebrow">01 / RECOGNISE THE MOMENT</span><span class="badge">ILLUSTRATIVE EXAMPLE</span></div><h3 style="line-height:1.65">${d[2]}</h3><div class="mode" role="group" aria-label="Compare responses"><button data-mode="automatic" class="${mode==='automatic'?'on':''}">Automatic</button><button data-mode="flexible" class="${mode==='flexible'?'on':''}">More choice</button></div><div class="scene-display"><div class="scene-person">${person()}</div><div class="thought ${mode==='flexible'?'flexible':''}"><span class="eyebrow">${mode==='flexible'?'A RESPONSE TO REHEARSE':'A POSSIBLE LEARNED STORY'}</span><blockquote>“${d[mode==='flexible'?4:3]}”</blockquote><p>${mode==='flexible'?action:'Notice the response without judging yourself. This example may or may not fit your own experience.'}</p></div></div><details class="scene-depth"><summary>Understand the pattern ↗</summary><p>${s?s.mechanism:'Possible loop: '+d[5]+'. Context and learning history can both matter.'}</p><p>${s?s.condition:d[8]}</p></details></div>`};
// Keep assets versioned in the document so returning users receive this refinement.
applyDay();render();

</script></body></html>
