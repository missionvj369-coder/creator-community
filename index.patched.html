  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; height: 100vh; margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
    header { padding: 10px 16px; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; }

    header { position: relative; z-index: 10; }

    .day-bar, .status, .btn, .title, .menu, .prompt { position: relative; z-index: 5; }

    .view { display: none; flex-direction: column; align-items: center; justify-content: center; flex: 1 1 auto; min-height: 0; width: 100%; overflow-y: auto; }
    .view.active { display: flex; }
    canvas { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
    .day-bar { display: flex; gap: 6px; padding: 10px 0; overflow-x: auto; }
    .day-chip { padding: 6px 12px; background: #080808; border: 1px solid #1a1a1a; border-radius: 12px; font-size: 10px; cursor: pointer; }
    .day-chip.active { background: #00f0ff; color: #000; border-color: #00f0ff; }
    .btn { padding: 14px 24px; border-radius: 24px; border: none; font-size: 12px; font-weight: bold; cursor: pointer; }
    .tool-grid { display: flex; flex-direction: column; gap: 10px; padding: 10px 0; }
    .tool { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #080808; border: 1px solid #1a1a1a; border-radius: 12px; cursor: pointer; }
    .tool:hover { border-color: #00f0ff; }
    .tool-title { font-size: 13px; font-weight: bold; color: #eee; }
    .tool-desc { font-size: 10px; color: #666; }
    .prompt { background: #0c0c0c; border: 1px solid #00f0ff33; border-radius: 12px; padding: 16px; margin-top: 10px; font-family: monospace; }

    .prompt-text { font-size: 12px; line-height: 1.6; color: #ccc; white-space: pre-wrap; margin-bottom: 12px; }

    .trigger-box { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; z-index: 5; text-align: center; max-width: 340px; }

    .squeeze-box { position: fixed; inset: 0; background: rgba(0,0,0,0.96); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 32px; text-align: center; }

    .squeeze-desc { font-size: 13px; color: #fff; line-height: 2; }

    .completion-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.97); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 90; padding: 32px; text-align: center; gap: 16px; }

    .completion-screen.active { display: flex; }

    .completion-label { font-size: 11px; color: #00f0ff; letter-spacing: 3px; border: 1px solid rgba(0,240,255,0.3); padding: 6px 14px; border-radius: 20px; }

    .completion-title { font-size: 15px; font-weight: bold; color: #fff; }

    .completion-desc { font-size: 12px; color: #888; line-height: 1.7; max-width: 320px; }

    .next-day-btn { padding: 14px 32px; border-radius: 24px; border: 1px solid #00f0ff; background: transparent; color: #00f0ff; font-size: 12px; font-weight: bold; cursor: pointer; letter-spacing: 1px; }

    .menu button:hover { border-color: #00f0ff; }

    .tool-num { font-size: 9px; color: #00f0ff; letter-spacing: 2px; margin-bottom: 4px; }

    .card-left { flex: 1; min-width: 0; }

    .arrow { color: #00f0ff; font-size: 16px; }

  </style>
</head>

      { day: 9, carrier: 432, beat: 10, sub: 0, mode: "infinity", color: "#00f0ff", title: "Day 09: Ciliary Eye Cooling", desc: "432Hz Alpha Wave with Vertical Eye Muscle Tracking." },
      { day: 10, carrier: 528, beat: 8, sub: 0, mode: "breath", color: "#ff00aa", title: "Day 10: Heart-Brain Sync", desc: "528Hz Transformation Pitch with 8Hz Coherence Pulse." },
      { day: 11, carrier: 285, beat: 6, sub: 0, mode: "core", color: "#9900ff", title: "Day 11: Subconscious Anchor", desc: "Deep 285Hz Solfeggio Tone with 6Hz Theta Brainwave Driver." },
      { day: 12, carrier: 741, beat: 16, sub: 0, mode: "core", color: "#00ffff", title: "Day 12: Neural Noise Erasure", desc: "Sharp 741Hz High-Frequency Focus Tone with 16Hz Beta Waves." },
      { day: 13, carrier: 852, beat: 18, sub: 0, mode: "strobe", color: "#ffff00", title: "Day 13: Dopamine Reset", desc: "High-Pitch 852Hz Cognitive Driver with Fast Strobe Sync." },

      { day: 16, carrier: 120, beat: 6, sub: 60, mode: "breath", color: "#00ff66", title: "Day 16: Vocal Cord Resonance", desc: "Low 120Hz Sub-Hum matching Vagal voo Vocal Sound." },
      { day: 17, carrier: 432, beat: 7, sub: 0, mode: "infinity", color: "#ff9900", title: "Day 17: Emotional Defusion", desc: "432Hz Soft Alpha Tone with Shrinking Visual Core." },
      { day: 18, carrier: 528, beat: 5, sub: 0, mode: "core", color: "#0099ff", title: "Day 18: Unflappable Lock-In", desc: "528Hz Decelerating Wave from Beta down to Theta." },
      { day: 19, carrier: 432, beat: 10, sub: 0, mode: "infinity", color: "#cc00ff", title: "Day 19: Deep Spatial Shift", desc: "432Hz Swirling 3D Stereo Panning across ears." },
      { day: 20, carrier: 108, beat: 4, sub: 30, mode: "core", color: "#33cc33", title: "Day 20: Subconscious Delta", desc: "Ultra-Low 108Hz Deep Sleep Delta Resonance." },
      { day: 21, carrier: 528, beat: 10, sub: 55, mode: "breath", color: "#00f0ff", title: "Day 21: Master Alignment", desc: "Full-Spectrum 528Hz + 10Hz Alpha + 55Hz Vagal Alignment." }
    ];
    
    function buildDayBar() {
      const bar = document.getElementById("dayBar");
      bar.innerHTML = "";
      protocols.forEach(p => {
        const chip = document.createElement("div");
        chip.className = "day-chip " + (p.day === activeDay ? "active" : "");
        chip.innerText = "Day " + (p.day < 10 ? "0" : "") + p.day;
        chip.onclick = () => selectDay(p.day);
        bar.appendChild(chip);
      });
    }
    buildDayBar();
    
    function selectDay(dayNum) {
      activeDay = dayNum;
      buildDayBar();
      stopAndDestroyAudio();
      document.getElementById("startBtn").innerHTML = "START<br>DAY " + (activeDay < 10 ? "0" : "") + activeDay;
      const p = protocols[activeDay - 1];
      document.getElementById("statusBadge").innerText = p.title + ": " + p.desc;
    }
    
    function resize() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    window.addEventListener("resize", resize);
    resize();
    
    function triggerHaptic(pattern) {
      if ("vibrate" in navigator) navigator.vibrate(pattern);
    }
    
    function stopAndDestroyAudio() {
      if (audioCtx) {
        try {
          if (carrierOsc) carrierOsc.stop();
          if (binauralOsc) binauralOsc.stop();
          if (subBassOsc) subBassOsc.stop();
          audioCtx.close();
        } catch(e) {}
        audioCtx = null;
        carrierOsc = null;
        binauralOsc = null;
        subBassOsc = null;
      }
    }
    
    function setFrequencies(carrier, beat, subFreq) {
      stopAndDestroyAudio();
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      gainNode = audioCtx.createGain();
      gainNode.gain.setValueAtTime(0.01, audioCtx.currentTime);
      panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
      carrierOsc = audioCtx.createOscillator();
      binauralOsc = audioCtx.createOscillator();
      carrierOsc.type = "sine";
      binauralOsc.type = "sine";
      carrierOsc.frequency.setValueAtTime(carrier, audioCtx.currentTime);
      binauralOsc.frequency.setValueAtTime(carrier + beat, audioCtx.currentTime);
      if (panner) {
        carrierOsc.connect(panner);
        binauralOsc.connect(panner);
        panner.connect(gainNode);
      } else {
        carrierOsc.connect(gainNode);
        binauralOsc.connect(gainNode);
      }
      if (subFreq > 0) {
        subBassOsc = audioCtx.createOscillator();
        subBassOsc.type = "triangle";
        subBassOsc.frequency.setValueAtTime(subFreq, audioCtx.currentTime);
        subBassOsc.connect(gainNode);
        subBassOsc.start();
      }
      gainNode.connect(audioCtx.destination);
      gainNode.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 1);
      carrierOsc.start();
      binauralOsc.start();
    }
    
    function startDailyProtocol() {
      document.getElementById("triggerBox").style.display = "none";
      const textEl = document.getElementById("instructionText");
      const p = protocols[activeDay - 1];
      if (activeDay === 2) {
        document.getElementById("squeezeBox").classList.add("active");
        triggerHaptic([500, 100, 500, 100, 1000]);
        setTimeout(() => {
          document.getElementById("squeezeBox").classList.remove("active");
          textEl.innerText = "DROP EVERYTHING. LET YOUR ENTIRE BODY GO LIMP.";
          triggerHaptic([30, 30, 30]);
          setFrequencies(p.carrier, p.beat, p.sub);
        }, 8000);
      } else {
        setFrequencies(p.carrier, p.beat, p.sub);
        textEl.innerText = p.desc;
      }
      elapsedSeconds = 0;
      clearInterval(sessionTimer);
      sessionTimer = setInterval(() => {
        elapsedSeconds++;
        let m = Math.floor(elapsedSeconds / 60);
        let s = elapsedSeconds % 60;
        document.getElementById("statusBadge").innerText = "DAY " + (activeDay < 10 ? "0" : "") + activeDay + " | " + p.carrier + "Hz : " + m + ":" + (s < 10 ? "0" : "") + s;
        if (panner && audioCtx) {
          panner.pan.setValueAtTime(Math.sin(audioCtx.currentTime * 0.6), audioCtx.currentTime);
        }
        if (elapsedSeconds >= 180) {
          clearInterval(sessionTimer);
          if (gainNode && audioCtx) {
            gainNode.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 2);
          }
          document.getElementById("completedDayLabel").innerText = "DAY " + (activeDay < 10 ? "0" : "") + activeDay + " COMPLETE";
          document.getElementById("completedTitle").innerText = p.title;
          document.getElementById("completedDesc").innerText = p.desc;
          document.getElementById("completionScreen").classList.add("active");
          document.getElementById("statusBadge").innerText = "SESSION COMPLETE";
        }
      }, 1000);
    }
    
    function advanceToNextDay() {
      document.getElementById("completionScreen").classList.remove("active");
      document.getElementById("triggerBox").style.display = "block";
      if (activeDay < 21) {
        selectDay(activeDay + 1);
      } else {
        selectDay(1);
      }
    }
    
    // Canvas Visual Engine
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const p = protocols[activeDay - 1];
      timeStep += 0.025;
      if (flickerActive && Math.random() > 0.85) {
        ctx.fillStyle = "rgba(0, 240, 255, 0.04)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      if (elapsedSeconds < 160) {
        const x = cx + Math.sin(timeStep) * (canvas.width * 0.33);
        const y = cy + Math.sin(timeStep * 2) * 42;
        let gradient = ctx.createRadialGradient(x, y, 2, x, y, 55);
        gradient.addColorStop(0, "rgba(0, 240, 255, 0.95)");
        gradient.addColorStop(0.3, "rgba(0, 180, 255, 0.3)");
        gradient.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(x, y, 55, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.shadowBlur = 20;
        ctx.shadowColor = "#00f0ff";
        ctx.fill();
      } else {
        let radius = 30 + Math.sin(timeStep) * 10;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(0, 240, 255, 0.2)";
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      requestAnimationFrame(render);
    }
    render();

    function openTool(i) {
      const t = tools[i];

        switchTab(t.target);
